<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 N05 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wall{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vmin;
background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 .4vmin,transparent .4vmin 7vmin),linear-gradient(180deg,#1d3560 0%,#0f1f40 45%,#091530 100%)}
.head{display:flex;align-items:center;gap:3vmin;animation:headIn .35s 0s 1 both ease-out}
.head h1{margin:0;font-size:8vmin;font-weight:800;letter-spacing:.6vmin;color:#f2c94c;text-shadow:0 .4vmin 1.5vmin rgba(242,201,76,.45)}
.head i{display:block;width:12vmin;height:.7vmin;border-radius:1vmin;background:linear-gradient(90deg,transparent,#f2c94c,transparent);transform-origin:center;animation:lineIn .35s 0s 1 both ease-out}
.row{display:grid;grid-template-columns:repeat(3,30vmin);gap:2vmin;justify-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:3vmin}
.hang{position:relative;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;
animation:drop 1.2s 1 both ease-out,flash .8s 2.3s 1 both ease-in-out}
.hang::before{content:"";width:.5vmin;height:4vmin;background:#c9b26a}
.badge{position:relative;width:24vmin;height:24vmin;display:flex;align-items:center;justify-content:center;
font-size:10vmin;color:rgba(255,255,255,.92);text-shadow:0 .5vmin 1vmin rgba(0,0,0,.35);overflow:hidden}
.badge::before{content:"";position:absolute;inset:14%;border:.5vmin dashed rgba(255,255,255,.65);border-radius:50%}
.badge::after{content:"";position:absolute;top:-10%;left:0;width:30%;height:120%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);transform:translateX(-200%) skewX(-22deg);opacity:0;
animation:shine 1s 1 both ease-in-out}
.b1 .badge{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1a8,#f2c94c 45%,#b8860b)}
.b2 .badge{clip-path:polygon(0 8%,50% 0,100% 8%,100% 55%,50% 100%,0 55%);background:linear-gradient(160deg,#6cb4ff,#2a5fd0 55%,#17317a)}
.b3 .badge{clip-path:polygon(50% 0,60% 9%,73% 5%,77% 18%,91% 20%,90% 33%,100% 42%,93% 54%,100% 66%,88% 72%,86% 86%,72% 85%,63% 96%,50% 90%,37% 96%,28% 85%,14% 86%,12% 72%,0 66%,7% 54%,0 42%,10% 33%,9% 20%,23% 18%,27% 5%,40% 9%);background:linear-gradient(150deg,#6fe0a4,#1f9d63 55%,#0d5c3b)}
.b2 .badge::before{border-radius:40%}
.label{width:30vmin;text-align:center;font-size:4vmin;font-weight:800;line-height:1.25;color:#e3e6ea;animation:labelIn .9s 1 both ease-out}
.b1 .hang{animation-delay:.2s,2.3s}.b1 .badge::after{animation-delay:1.75s}.b1 .label{animation-delay:.5s}
.b2 .hang{animation-delay:.42s,2.3s}.b2 .badge::after{animation-delay:1.93s}.b2 .label{animation-delay:.72s}
.b3 .hang{animation-delay:.64s,2.3s}.b3 .badge::after{animation-delay:2.11s}.b3 .label{animation-delay:.94s}
@keyframes headIn{from{opacity:0;transform:translateY(-3vmin) scale(.9)}to{opacity:1;transform:none}}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-70vmin) rotate(0)}6%{opacity:1}30%{transform:translateY(0) rotate(0)}
45%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}75%{transform:rotate(4deg)}90%{transform:rotate(-1.5deg)}100%{opacity:1;transform:rotate(0)}}
@keyframes labelIn{from{opacity:0;transform:translateY(2.5vmin)}to{opacity:1;transform:none}}
@keyframes shine{0%{opacity:1;transform:translateX(-200%) skewX(-22deg)}100%{opacity:1;transform:translateX(480%) skewX(-22deg)}}
@keyframes flash{0%{filter:drop-shadow(0 0 0 rgba(255,230,140,0)) brightness(1)}50%{filter:drop-shadow(0 0 4vmin rgba(255,230,140,.95)) brightness(1.35)}100%{filter:drop-shadow(0 0 0 rgba(255,230,140,0)) brightness(1)}}
</style>
<div class="wall">
  <div class="head"><i></i><h1>인증 · 수상</h1><i></i></div>
  <div class="row">
    <div class="slot b1"><div class="hang"><div class="badge">★</div></div><div class="label">우수기관 인증</div></div>
    <div class="slot b2"><div class="hang"><div class="badge">✓</div></div><div class="label">안전 인증</div></div>
    <div class="slot b3"><div class="hang"><div class="badge">◆</div></div><div class="label">고객만족 대상</div></div>
  </div>
</div>
</html>
