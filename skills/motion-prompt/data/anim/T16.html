<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T16 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;
  background:linear-gradient(180deg,#6f8fb8 0%,#a9bfd6 48%,#7a6a5a 48.5%,#4d4036 100%)}
.hill{position:absolute;left:-10vmin;right:-10vmin;top:34%;height:30%;
  background:linear-gradient(180deg,#5d7d6a,#44604f);border-radius:50% 50% 0 0}
.head{position:absolute;left:62%;top:20%;width:14vmin;height:14vmin;border-radius:50%;
  background:linear-gradient(180deg,#e3b99a,#c99876)}
.body{position:absolute;left:55%;top:36%;width:28vmin;height:46vmin;border-radius:14vmin 14vmin 0 0;
  background:linear-gradient(180deg,#3d4a63,#2a3347)}
.tag{position:absolute;top:3vmin;right:3vmin;font-size:2.4vmin;color:rgba(255,255,255,.7);
  background:rgba(0,0,0,.25);padding:.6vmin 1.4vmin;border-radius:1vmin}
.lt{position:absolute;left:5vmin;bottom:6vmin;display:flex;align-items:center;height:17vmin}
.bar{width:1.2vmin;height:17vmin;background:#FFB45A;transform-origin:center;transform:scaleY(0);
  animation:barK 4.4s linear .2s 1 both}
.band{position:relative;width:56vmin;height:17vmin;overflow:hidden;
  background:linear-gradient(90deg,rgba(14,26,63,.88),rgba(22,38,86,.78));
  transform-origin:left center;transform:scaleX(0);
  animation:bandK 4.3s linear .3s 1 both}
.shine{position:absolute;top:0;bottom:0;left:-15%;width:14%;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,200,130,.75),transparent);
  animation:shineK .6s ease-in-out .8s 1 both}
.txt{position:absolute;left:4.2vmin;top:0;height:17vmin;display:flex;flex-direction:column;justify-content:center;gap:.6vmin}
.name{font-size:8.5vmin;font-weight:900;color:#fff;line-height:1.1;white-space:nowrap;opacity:0;
  animation:nameK 4s linear .6s 1 both}
.role{font-size:4.6vmin;font-weight:500;color:#9FB0D0;line-height:1.2;white-space:nowrap;opacity:0;
  animation:roleK 3.8s linear .8s 1 both}
@keyframes barK{0%{transform:scaleY(0)}5.68%{transform:scaleY(1)}88.64%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes bandK{0%{transform:scaleX(0)}11.63%{transform:scaleX(1)}88.37%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes shineK{0%{left:-15%;opacity:0}20%{opacity:1}80%{opacity:1}100%{left:110%;opacity:0}}
@keyframes nameK{0%{opacity:0;transform:translateY(3vmin)}10%{opacity:1;transform:translateY(0)}87.5%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes roleK{0%{opacity:0;transform:translateY(2.4vmin)}10.53%{opacity:1;transform:translateY(0)}86.84%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
</style>
<div class="stage">
  <div class="hill"></div>
  <div class="body"></div>
  <div class="head"></div>
  <div class="tag">촬영 화면 예시</div>
  <div class="lt">
    <div class="bar"></div>
    <div class="band"><div class="shine"></div></div>
    <div class="txt">
      <div class="name">홍길동</div>
      <div class="role">○○카페 대표</div>
    </div>
  </div>
</div>
</html>
