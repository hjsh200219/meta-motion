<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 B05 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#1b2433;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.shot{position:fixed;inset:0;background:linear-gradient(160deg,#3b4a63 0%,#6a5a7a 55%,#c98a6b 100%)}
.shot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(0deg,rgba(20,18,30,.55),transparent)}
.stage{position:relative;width:100vmin;height:100vmin;flex:none}
.person{position:absolute;left:18%;top:40%;width:20%;height:16%;border-radius:50%;background:linear-gradient(180deg,#e9c3a4,#c99874)}
.body{position:absolute;left:8%;top:58%;width:40%;height:50%;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#2d3e5c,#1d2740)}
svg{position:absolute;inset:0;width:100%;height:100%}
.arrow{animation:fadeout .4s linear 3.4s 1 both}
.line{fill:none;stroke:#FFD400;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-in-out .3s 1 both}
.tip{fill:#FFD400;stroke:#FFD400;stroke-width:.6;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 0;transform:scale(0);animation:tip .1s ease-out .75s 1 both}
.pop{position:absolute;left:50%;top:12%;transform-origin:0% 50%;opacity:0;animation:pop .35s ease-out .8s 1 both}
.wob{transform-origin:0% 50%;animation:wob 2.25s ease-in-out 1.15s 1 both}
.out{transform-origin:0% 50%;animation:out .4s ease-in 3.4s 1 both}
.tag{background:#FFD400;border:.9vmin solid #16130E;border-radius:2.4vmin;box-shadow:1.4vmin 1.4vmin 0 #16130E;padding:1.6vmin 3vmin 2vmin;color:#16130E;white-space:nowrap}
.tag small{display:block;font-size:3.6vmin;font-weight:600;letter-spacing:.2vmin}
.tag b{display:block;font-size:5.8vmin;font-weight:900;line-height:1.2}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes tip{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(0);opacity:0}10%{opacity:1}55%{transform:scale(1.3);opacity:1}80%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes wob{0%{transform:rotate(0)}20%{transform:rotate(-1.5deg)}40%{transform:rotate(1.5deg)}60%{transform:rotate(-1.5deg)}80%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
@keyframes out{from{transform:scale(1);opacity:1}to{transform:scale(.1);opacity:0}}
@keyframes fadeout{from{opacity:1}to{opacity:.15}}
</style>
<div class="shot"></div>
<div class="stage">
  <div class="body"></div>
  <div class="person"></div>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <g class="arrow">
      <path class="line" pathLength="1" d="M49 26 Q37 12 39.5 36"/>
      <polygon class="tip" points="39.5,41 36.3,34 42.7,34"/>
    </g>
  </svg>
  <div class="pop"><div class="wob"><div class="out">
    <div class="tag"><small>등장인물</small><b>AI 초보 김대리</b></div>
  </div></div></div>
</div>
</html>
