<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 B19 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0705;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#0b0705}
.wall{position:absolute;left:0;top:0;width:100%;height:74%;background:linear-gradient(180deg,#0f0a07 0%,#1d130d 70%,#150d09 100%)}
.glow{position:absolute;left:0;top:0;width:100%;height:74%;background:radial-gradient(ellipse 60% 70% at 50% 85%,rgba(232,68,46,.75),rgba(232,68,46,.25) 55%,rgba(232,68,46,0) 80%);opacity:0;animation:glow .7s ease-out 1.9s 1 both}
.truss{position:absolute;left:8%;top:5%;width:84%;height:.5vmin;background:#2a1f18}
.floor{position:absolute;left:50%;bottom:7%;width:88%;height:36%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#3a281d 0%,#241811 55%,#150e09 100%);border:.5vmin solid rgba(255,240,214,.12);box-shadow:0 2vmin 4vmin rgba(0,0,0,.8),inset 0 .6vmin 2vmin rgba(255,240,214,.08)}
.floor::after{content:"";position:absolute;left:18%;top:10%;width:64%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,240,214,.07),rgba(255,240,214,0))}
.lights{position:absolute;inset:0;animation:flash .35s ease-out 1.55s 1 both}
.L{position:absolute;top:0;height:100%;width:0}
.L:nth-child(1){left:20%;--r:-6deg}
.L:nth-child(2){left:40%;--r:-3deg}
.L:nth-child(3){left:60%;--r:3deg}
.L:nth-child(4){left:80%;--r:6deg}
.fix{position:absolute;left:-3.2vmin;top:5.5%;width:6.4vmin;height:3.6vmin;border-radius:.8vmin .8vmin 3.2vmin 3.2vmin;background:linear-gradient(180deg,#4a3b30,#241a14)}
.fix i{position:absolute;left:12%;bottom:-.4vmin;width:76%;height:2.2vmin;border-radius:50%;background:#FFF0D6;box-shadow:0 0 3vmin 1.2vmin rgba(255,240,214,.8);opacity:0;animation:on .28s linear 0s 1 both}
.beam{position:absolute;left:-9vmin;top:9%;width:18vmin;height:66%;transform-origin:50% 0;transform:rotate(var(--r));opacity:0;animation:on .28s linear 0s 1 both}
.cone{position:absolute;inset:0;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(255,240,214,.55),rgba(255,240,214,.14) 70%,rgba(255,240,214,.1))}
.pool{position:absolute;left:-6%;bottom:-3vmin;width:112%;height:6vmin;border-radius:50%;background:radial-gradient(ellipse,rgba(255,240,214,.65),rgba(255,240,214,0) 70%)}
.L:nth-child(1) .fix i,.L:nth-child(1) .beam{animation-delay:.4s}
.L:nth-child(2) .fix i,.L:nth-child(2) .beam{animation-delay:.69s}
.L:nth-child(3) .fix i,.L:nth-child(3) .beam{animation-delay:.98s}
.L:nth-child(4) .fix i,.L:nth-child(4) .beam{animation-delay:1.27s}
.tb{position:absolute;left:0;top:0;width:100%;height:80%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;animation:out .4s ease-in 4.5s 1 both}
.sub{font-size:4.6vmin;font-weight:800;letter-spacing:.6vmin;color:#E8442E;text-shadow:0 .3vmin 1.2vmin rgba(0,0,0,.9);opacity:0;animation:sub .4s ease-out 2.6s 1 both}
.title{font-size:10vmin;font-weight:900;color:#F4F1EA;white-space:nowrap;text-shadow:0 .8vmin 2vmin rgba(0,0,0,.95),0 .2vmin .4vmin rgba(0,0,0,.9);opacity:0;animation:rise .9s ease-out 2.1s 1 both}
@keyframes on{0%{opacity:0}30%{opacity:.7}55%{opacity:.12}100%{opacity:1}}
@keyframes flash{0%{filter:brightness(1)}25%{filter:brightness(2.6)}100%{filter:brightness(1)}}
@keyframes glow{0%{opacity:0;transform:scale(.7)}100%{opacity:.7;transform:scale(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(4vmin);filter:blur(1.2vmin)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes sub{0%{opacity:0;transform:translateY(1.5vmin)}100%{opacity:1;transform:translateY(0)}}
@keyframes out{0%{opacity:1}100%{opacity:0}}
</style>
<div class="stage">
  <div class="wall"></div>
  <div class="glow"></div>
  <div class="floor"></div>
  <div class="truss"></div>
  <div class="lights">
    <div class="L"><div class="beam"><div class="cone"></div><div class="pool"></div></div><div class="fix"><i></i></div></div>
    <div class="L"><div class="beam"><div class="cone"></div><div class="pool"></div></div><div class="fix"><i></i></div></div>
    <div class="L"><div class="beam"><div class="cone"></div><div class="pool"></div></div><div class="fix"><i></i></div></div>
    <div class="L"><div class="beam"><div class="cone"></div><div class="pool"></div></div><div class="fix"><i></i></div></div>
  </div>
  <div class="tb">
    <div class="sub">시즌 2 · 1화</div>
    <div class="title">모두의 AI교육</div>
  </div>
</div>
</html>
