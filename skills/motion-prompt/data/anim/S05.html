<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 S05 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#EEF3FA;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#12224f;font-weight:800}
.stage{position:relative;width:100%;height:100%;overflow:hidden}
.title{position:absolute;left:5vmin;top:4vmin;margin:0;font-size:8vmin;line-height:1.1;color:#12224f;animation:tin .5s ease-out 0s 1 both}
@keyframes tin{0%{opacity:0;transform:translateX(-4vmin)}100%{opacity:1;transform:none}}

.steps{position:absolute;left:0;right:0;top:53%;transform:translateY(-50%);display:flex;justify-content:center;align-items:flex-start;gap:2vmin}
.col{position:relative;width:min(30vw,46vmin)}
.c{position:relative;z-index:2;width:8vmin;height:8vmin;border-radius:50%;display:grid;place-items:center;font-size:4.6vmin;background:#dbe5f6;color:#8aa0c8;animation:pop .3s ease-out var(--on) 1 both,on .3s ease-out var(--on) 1 both}
.c .n,.c .k{grid-area:1/1}
.c .n{animation:hide .25s ease-in var(--ck) 1 both}
.c .k{color:#fff;animation:chk .35s ease-out var(--ck) 1 both}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes on{0%{background:#dbe5f6;color:#8aa0c8}100%{background:#2563EB;color:#fff}}
@keyframes hide{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0)}}
@keyframes chk{0%{opacity:0;transform:scale(0) rotate(-30deg)}60%{opacity:1;transform:scale(1.4) rotate(0)}100%{opacity:1;transform:scale(1)}}

.rail{position:absolute;z-index:1;left:4vmin;top:3.4vmin;width:calc(100% + 2vmin);height:1.2vmin;border-radius:1vmin;background:#cbd8ee;overflow:hidden}
.rail i{display:block;width:100%;height:100%;background:#2563EB;transform-origin:left;animation:fill .4s ease-in-out var(--rd) 1 both}
@keyframes fill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

.cw{animation:up .55s ease-out var(--cd) 1 both}
@keyframes up{0%{opacity:0;transform:translateY(8vmin) scale(.8)}55%{opacity:1;transform:translateY(-2.2vmin) scale(1.04)}78%{transform:translateY(.8vmin) scale(.99)}100%{opacity:1;transform:none}}
.card{height:34vmin;background:#fff;border-radius:3vmin;box-shadow:0 1.2vmin 3vmin rgba(18,34,79,.16);display:grid;place-items:center;position:relative}
.nm{margin-top:2vmin;text-align:center;font-size:4vmin;line-height:1.25;color:#12224f}
.c1{--on:.1s;--ck:1.1s}.c2{--on:1.5s;--ck:2.3s}.c3{--on:2.7s;--ck:3.4s}
.col:nth-child(1) .rail{--rd:1.1s}.col:nth-child(2) .rail{--rd:2.3s}.col:nth-child(3) .rail{display:none}
.col:nth-child(1) .cw{--cd:.3s;margin:4vmin 0 0 4vmin;rotate:-2deg}
.col:nth-child(2) .cw{--cd:1.5s;margin:10vmin 3vmin 0 0;rotate:1.5deg;animation-duration:.5s}
.col:nth-child(3) .cw{--cd:2.7s;margin:6vmin 0 0 2vmin;rotate:-1deg;animation-duration:.45s}

/* 1 phone + QR */
.ph{width:15vmin;height:27vmin;border:1vmin solid #12224f;border-radius:3vmin;background:#fff;display:grid;place-items:center;box-sizing:border-box;position:relative;overflow:hidden}
.qr{position:relative;width:9vmin;height:9vmin;background:conic-gradient(#12224f 25%,transparent 0 50%,#12224f 0 75%,transparent 0) 0 0/1.5vmin 1.5vmin;animation:stamp .35s ease-out .55s 1 both}
@keyframes stamp{0%{opacity:0;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
.f{position:absolute;width:3vmin;height:3vmin;box-sizing:border-box;border:.7vmin solid #12224f;background:#fff}
.f::after{content:"";position:absolute;inset:.3vmin;background:#12224f}
.f:nth-child(1){left:0;top:0}.f:nth-child(2){right:0;top:0}.f:nth-child(3){left:0;bottom:0}
.scan{position:absolute;left:-4%;width:108%;height:.8vmin;border-radius:1vmin;background:#e5322d;box-shadow:0 0 1.4vmin #e5322d;animation:scan .78s ease-in-out .7s 6 both}
@keyframes scan{0%{top:4%;opacity:0}6%{opacity:1}50%{top:92%}94%{opacity:1}100%{top:4%;opacity:0}}
.ph .scan{left:0;width:100%}

/* 2 calendar */
.cal{width:88%}
.cal b{display:block;font-size:3.6vmin;margin-bottom:1.2vmin;text-align:center}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:.5vmin}
.g i{display:grid;place-items:center;aspect-ratio:1;font-style:normal;font-size:2.8vmin;position:relative;border-radius:50%;color:#12224f}
.g i.t{animation:dfill .2s ease-out 2.3s 1 both;z-index:2}
@keyframes dfill{0%{background:transparent;color:#12224f}100%{background:#2563EB;color:#fff}}
.ring{position:absolute;left:-30%;top:-30%;width:160%;height:160%;overflow:visible;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:#e5322d;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .3s ease-out 2.15s 1 both}
@keyframes draw{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
.cur{position:absolute;left:55%;top:60%;width:3.4vmin;height:4vmin;background:#12224f;clip-path:polygon(0 0,100% 62%,58% 68%,40% 100%);filter:drop-shadow(0 .3vmin .4vmin rgba(0,0,0,.4));animation:cur .8s ease-in-out 1.75s 1 both;z-index:3}
@keyframes cur{0%{opacity:0;transform:translate(14vmin,12vmin)}10%{opacity:1}50%{opacity:1;transform:translate(0,0) scale(1)}62%{opacity:1;transform:translate(0,0) scale(.8)}100%{opacity:0;transform:translate(0,0) scale(1)}}

/* 3 sms */
.sms{width:84%;height:84%;display:grid;grid-template-rows:auto 1fr auto;align-items:start}
.bar{height:1.4vmin;border-radius:1vmin;background:#dbe5f6;margin-top:1vmin}
.msg{display:grid;margin-top:3vmin}
.msg>*{grid-area:1/1;justify-self:start}
.dots{display:flex;gap:1vmin;background:#e3e9f4;padding:2vmin 2.4vmin;border-radius:2.4vmin;align-self:start;animation:blink .25s linear 2.85s 1 both}
.dots span{width:1.5vmin;height:1.5vmin;border-radius:50%;background:#8aa0c8}
@keyframes blink{0%{opacity:0}25%{opacity:1}50%{opacity:.3}75%{opacity:1}100%{opacity:0}}
.bub{position:relative;background:#fff;border:.5vmin solid #16a34a;border-radius:2.4vmin;padding:1.8vmin 2.2vmin;transform-origin:0 100%;animation:bub .3s ease-out 3.1s 1 both;box-shadow:0 .6vmin 1.6vmin rgba(22,163,74,.25)}
@keyframes bub{0%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.4)}72%{transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.ok{display:block;font-size:3.6vmin;color:#16a34a;white-space:nowrap;animation:glow .7s ease-out 3.3s 1 both}
@keyframes glow{0%{text-shadow:0 0 0 rgba(74,222,128,0)}30%{text-shadow:0 0 1.6vmin #4ade80,0 0 3.6vmin #16a34a;filter:brightness(1.25)}100%{text-shadow:0 0 0 rgba(74,222,128,0)}}

.foot{position:absolute;left:50%;bottom:4vmin;transform:translateX(-50%);max-width:90vw;width:max-content;box-sizing:border-box;text-align:center;background:#fff;border-radius:6vmin;padding:1.6vmin 3.5vmin;font-size:4vmin;line-height:1.25;color:#12224f;box-shadow:0 .8vmin 2.4vmin rgba(18,34,79,.14);animation:fin .5s ease-out 3.4s 1 both}
@keyframes fin{0%{opacity:0;margin-bottom:-4vmin}100%{opacity:1;margin-bottom:0}}
</style>
<div class="stage">
  <h1 class="title">진료 예약 방법</h1>
  <div class="steps">
    <div class="col">
      <div class="c c1"><span class="n">1</span><span class="k">✓</span></div>
      <div class="rail"><i></i></div>
      <div class="cw">
        <div class="card">
          <div class="ph"><div class="qr"><span class="f"></span><span class="f"></span><span class="f"></span></div><div class="scan"></div></div>
        </div>
        <div class="nm">전화·QR로 신청</div>
      </div>
    </div>
    <div class="col">
      <div class="c c2"><span class="n">2</span><span class="k">✓</span></div>
      <div class="rail"><i></i></div>
      <div class="cw">
        <div class="card">
          <div class="cal">
            <b>10월</b>
            <div class="g">
              <i>8</i><i>9</i><i>10</i><i>11</i><i>12</i><i>13</i><i>14</i>
              <i class="t">15<svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" pathLength="100"/></svg><s class="cur"></s></i><i>16</i><i>17</i><i>18</i><i>19</i><i>20</i><i>21</i>
              <i>22</i><i>23</i><i>24</i><i>25</i><i>26</i><i>27</i><i>28</i>
            </div>
          </div>
        </div>
        <div class="nm">날짜 고르기</div>
      </div>
    </div>
    <div class="col">
      <div class="c c3"><span class="n">3</span><span class="k">✓</span></div>
      <div class="rail"><i></i></div>
      <div class="cw">
        <div class="card">
          <div class="sms">
            <div><div class="bar" style="width:45%"></div></div>
            <div class="msg">
              <div class="dots"><span></span><span></span><span></span></div>
              <div class="bub"><span class="ok">예약 확정 ✓</span></div>
            </div>
            <div><div class="bar" style="width:100%"></div><div class="bar" style="width:70%"></div></div>
          </div>
        </div>
        <div class="nm">확정 문자 받기</div>
      </div>
    </div>
  </div>
  <div class="foot">전화 02-000-0000 또는 QR 코드</div>
</div>
</html>
