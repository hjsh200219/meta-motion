<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F67 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#4a2f1d;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:100vmin;height:100vmin;overflow:hidden;flex:none}
.scene{position:absolute;left:0;top:0;width:100vmin;height:100vmin;background:linear-gradient(160deg,#7a4f31 0%,#4f321f 60%,#3a2418 100%)}
.scene .win{position:absolute;left:0;top:0;width:55vmin;height:45vmin;background:radial-gradient(ellipse at 20% 15%,rgba(255,230,180,.35),rgba(255,230,180,0) 70%)}
.scene .cloth{position:absolute;left:-10vmin;top:84vmin;width:130vmin;height:10vmin;background:#b84a3a;transform:rotate(-8deg);opacity:.85}
.scene .glass{position:absolute;left:12vmin;top:62vmin;width:13vmin;height:13vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(150,200,230,.25) 55%,rgba(80,120,160,.35));border:.5vmin solid rgba(255,255,255,.35);box-sizing:border-box}
.scene .bread{position:absolute;left:34vmin;top:80vmin;width:20vmin;height:9vmin;border-radius:50% 50% 40% 40%;background:linear-gradient(#d49a52,#a9692e)}
.plate{position:absolute;left:52vmin;top:50vmin;width:32vmin;height:32vmin;border-radius:50%;background:radial-gradient(circle,#fff 0 62%,#e9e6df 64% 70%,#fbfaf6 72%);box-shadow:1.2vmin 1.6vmin 2.4vmin rgba(0,0,0,.45)}
.pasta{position:absolute;left:5vmin;top:5vmin;width:22vmin;height:22vmin;border-radius:50%;background:radial-gradient(circle,rgba(210,70,40,.55) 0 30%,rgba(210,70,40,0) 62%),repeating-conic-gradient(#f4c85e 0 10deg,#dfa63a 10deg 22deg,#f0bd4c 22deg 31deg)}
.pasta i{position:absolute;border-radius:50%;background:#d23a22;width:2.4vmin;height:2.4vmin;box-shadow:inset -.3vmin -.3vmin .4vmin rgba(0,0,0,.25)}
.pasta i:nth-child(1){left:7vmin;top:6vmin}
.pasta i:nth-child(2){left:12vmin;top:10vmin;width:2vmin;height:2vmin}
.pasta i:nth-child(3){left:8vmin;top:12vmin;width:1.8vmin;height:1.8vmin}
.pasta b{position:absolute;width:3.2vmin;height:1.6vmin;border-radius:100% 0;background:#3f8f3a;left:9.5vmin;top:8.5vmin;transform:rotate(-30deg)}
.pasta b:nth-of-type(2){left:5vmin;top:10vmin;transform:rotate(40deg);background:#2f7a30}
.dim{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(10,6,4,.4);animation:dimIn .3s linear 0s 1 both}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
.lens{position:absolute;left:61vmin;top:59vmin;width:14vmin;height:14vmin;box-sizing:border-box;border:1.3vmin solid #fff;border-radius:50%;box-shadow:0 0 2vmin rgba(0,0,0,.5);animation:lensPop .5s ease-out .3s 1 both}
@keyframes lensPop{0%{transform:scale(.6);opacity:0}30%{opacity:1}70%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
.funnel{position:absolute;left:0;top:0;width:100vmin;height:100vmin}
.funnel line{stroke:#ff9f3a;stroke-width:.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s ease-out .8s 1 both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.zoom{position:absolute;left:16vmin;top:14vmin;width:24vmin;height:24vmin;box-sizing:border-box;border:1vmin solid #ff9f3a;border-radius:50%;overflow:hidden;background:#4f321f;box-shadow:0 1vmin 3vmin rgba(0,0,0,.55);animation:zoomPop .6s ease-out .8s 1 both}
@keyframes zoomPop{0%,30%{transform:scale(0);opacity:0}32%{transform:scale(.1);opacity:1}65%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
.zoom .scene{left:-57vmin;top:-55vmin;transform-origin:68vmin 66vmin;transform:scale(2.5)}
.labelwrap{position:absolute;left:4vmin;top:40.5vmin;width:48vmin;display:flex;justify-content:center}
.label{background:#2b1d14;color:#fff4e0;font-size:4vmin;font-weight:700;padding:1.3vmin 3vmin;border-radius:4vmin;white-space:nowrap;box-shadow:0 .6vmin 2vmin rgba(0,0,0,.5);animation:labelIn .3s ease-out 1.4s 1 both}
@keyframes labelIn{from{opacity:0;transform:translateY(1.5vmin)}to{opacity:1;transform:translateY(0)}}
</style>
<div class="stage">
  <div class="scene">
    <div class="win"></div><div class="cloth"></div><div class="glass"></div><div class="bread"></div>
    <div class="plate"><div class="pasta"><i></i><i></i><i></i><b></b><b></b></div></div>
  </div>
  <svg class="funnel" viewBox="0 0 100 100">
    <line x1="72.95" y1="61.05" x2="36.49" y2="17.51" pathLength="1"/>
    <line x1="63.05" y1="70.95" x2="19.51" y2="34.49" pathLength="1"/>
  </svg>
  <div class="lens"></div>
  <div class="zoom">
    <div class="scene">
      <div class="win"></div><div class="cloth"></div><div class="glass"></div><div class="bread"></div>
      <div class="plate"><div class="pasta"><i></i><i></i><i></i><b></b><b></b></div></div>
    </div>
  </div>
  <div class="labelwrap"><div class="label">면은 한 번에 삶아 둡니다</div></div>
</div>
<div class="dim"></div>
</html>
