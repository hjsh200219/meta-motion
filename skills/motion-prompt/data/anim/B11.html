<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 B11 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;
  background:linear-gradient(180deg,#2c3e5a 0%,#6d7f9c 45%,#c9a982 100%)}
/* 촬영 화면 예시: 산 실루엣 + 말하는 사람 (왼쪽·가운데에 두어 오른쪽 위를 비움) */
.hill{position:absolute;left:-10vmin;bottom:0;width:80vmin;height:38vmin;border-radius:50% 50% 0 0;background:#2a2f3d}
.hill.b{left:auto;right:-20vmin;width:90vmin;height:30vmin;background:#1f2431}
.main-head{position:absolute;left:22%;bottom:34%;width:16vmin;height:16vmin;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0c9a4,#c98f64)}
.main-body{position:absolute;left:12%;bottom:-6%;width:36vmin;height:34vmin;border-radius:45% 45% 0 0;background:linear-gradient(#35507a,#223552)}
.tag{position:absolute;left:4vmin;bottom:4vmin;font-size:3.4vmin;color:#F4F1EA;opacity:.7}

/* 창: 오른쪽 위 모서리 축으로 튀어나옴 */
.win{position:absolute;top:4vmin;right:4vmin;width:40vw;aspect-ratio:16/10;transform-origin:100% 0;
  animation:pop .4s cubic-bezier(.2,.8,.3,1) .1s 1 both}
.win-in{width:100%;height:100%;transform-origin:100% 0;animation:out .4s ease-in 4.4s 1 both}
.frame{position:relative;box-sizing:border-box;width:100%;height:100%;border:.6vmin solid #F4F1EA;border-radius:2vmin;overflow:hidden;background:#16130E;
  box-shadow:0 2.5vmin 5vmin rgba(0,0,0,.6);animation:flash .3s ease-out 1.8s 1 both}
@keyframes pop{0%{transform:scale(0);opacity:0}15%{opacity:1}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes out{0%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
@keyframes flash{0%{border-color:#F4F1EA;box-shadow:0 2.5vmin 5vmin rgba(0,0,0,.6)}
  35%{border-color:#fff;box-shadow:0 0 5vmin 1.6vmin rgba(255,255,255,.95),0 2.5vmin 5vmin rgba(0,0,0,.6)}
  100%{border-color:#F4F1EA;box-shadow:0 2.5vmin 5vmin rgba(0,0,0,.6)}}

/* 게스트 화면 (창에 꽉 차게) */
.guest{position:absolute;inset:0;overflow:hidden;background:linear-gradient(160deg,#4f86b5 0%,#e8c598 100%)}
.g-move{position:absolute;inset:0;transform-origin:50% 60%;animation:gpan 2.3s linear 2.1s 1 both}
.g-head{position:absolute;left:50%;top:22%;width:26%;aspect-ratio:1;margin-left:-13%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f4d2b0,#c58a5e);animation:bob 2.3s ease-in-out 2.1s 1 both}
.g-body{position:absolute;left:50%;top:58%;width:60%;height:70%;margin-left:-30%;border-radius:45% 45% 0 0;background:linear-gradient(#b8452e,#7a2a1c)}
.g-bar{position:absolute;left:5%;right:5%;bottom:5%;height:1.2%;background:rgba(255,255,255,.35);border-radius:1vmin}
.g-bar i{display:block;height:100%;width:100%;background:#fff;border-radius:1vmin;transform-origin:0 50%;animation:prog 2.3s linear 2.1s 1 both}
@keyframes gpan{0%{transform:scale(1)}100%{transform:scale(1.07)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes prog{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

/* LIVE 라벨 */
.live{position:absolute;left:3%;bottom:9%;background:#E8442E;color:#fff;font-weight:700;font-size:3vmin;line-height:1;padding:.9vmin 1.4vmin;border-radius:.8vmin;white-space:nowrap;
  animation:fadein .3s ease-out 1.8s 1 both}
@keyframes fadein{0%{opacity:0;transform:translateY(1vmin)}100%{opacity:1;transform:none}}

/* 연결 화면 */
.conn{position:absolute;inset:0;background:#16130E;color:#F4F1EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;
  animation:uncover .3s ease-in 1.8s 1 both}
@keyframes uncover{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
.ph{font-size:8vmin;line-height:1;animation:ring .34s ease-in-out .1s 5 both alternate}
@keyframes ring{0%{transform:rotate(-14deg)}100%{transform:rotate(14deg)}}
.txt{font-size:4.2vmin;font-weight:700;letter-spacing:.1vmin}
.d{opacity:0}
.d1{opacity:1}
.d2{animation:d2 1s steps(1,end) .1s 1.7 both}
.d3{animation:d3 1s steps(1,end) .1s 1.7 both}
@keyframes d2{0%{opacity:0}33%{opacity:1}100%{opacity:1}}
@keyframes d3{0%{opacity:0}66%{opacity:1}100%{opacity:1}}

/* 연결되는 순간 흰 번쩍임 */
.glow{position:absolute;inset:0;background:#fff;opacity:0;animation:glow .3s ease-out 1.8s 1 both}
@keyframes glow{0%{opacity:0}30%{opacity:.75}100%{opacity:0}}
</style>

<div class="stage">
  <div class="hill"></div><div class="hill b"></div>
  <div class="main-body"></div><div class="main-head"></div>
  <div class="tag">촬영 화면 예시</div>

  <div class="win"><div class="win-in"><div class="frame">
    <div class="guest">
      <div class="g-move"><div class="g-body"></div><div class="g-head"></div></div>
      <div class="g-bar"><i></i></div>
    </div>
    <div class="live">LIVE · 게스트</div>
    <div class="conn">
      <div class="ph">📞</div>
      <div class="txt">연결 중<span class="d d1">.</span><span class="d d2">.</span><span class="d d3">.</span></div>
    </div>
    <div class="glow"></div>
  </div></div></div>
</div>
</html>
