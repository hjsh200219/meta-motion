<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T19 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1430;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden}
.zoom{position:absolute;inset:0;transform-origin:78% 80%;animation:zoomio 4s 1.6s 1 both}
@keyframes zoomio{
  0%{transform:scale(1);animation-timing-function:cubic-bezier(.6,0,.25,1)}
  30%{transform:scale(2)}
  80%{transform:scale(2);animation-timing-function:cubic-bezier(.6,0,.25,1)}
  100%{transform:scale(1)}
}
.screen{position:absolute;inset:0;background:linear-gradient(180deg,#f6f8fd,#e8eef9)}
.bar{position:absolute;left:0;right:0;top:0;height:13%;background:#fff;display:flex;align-items:center;padding:0 6%;box-sizing:border-box;box-shadow:0 .4vmin 1.5vmin rgba(40,60,120,.12)}
.bar i{width:5vmin;height:5vmin;border-radius:50%;background:linear-gradient(135deg,#7aa2ff,#3b6cf6);margin-right:3vmin}
.bar b{font-size:4.5vmin;color:#1b2540}
.chat{position:absolute;left:6%;right:6%;top:17%;bottom:27%;display:flex;flex-direction:column;justify-content:center;gap:2.6vmin}
.msg{font-size:4vmin;line-height:1.3;padding:2vmin 3vmin;border-radius:3vmin;max-width:62%;color:#1b2540;background:#fff;box-shadow:0 .3vmin 1vmin rgba(40,60,120,.1)}
.msg.me{align-self:flex-end;background:#cfdcff}
.input{position:absolute;left:6%;right:6%;top:80%;height:11vmin;margin-top:-5.5vmin;background:#fff;border-radius:6vmin;box-shadow:0 .4vmin 1.6vmin rgba(40,60,120,.18);display:flex;align-items:center;padding-left:4vmin;box-sizing:border-box;font-size:4vmin;color:#9aa5bd}
.send{position:absolute;left:78%;top:80%;width:16vmin;height:8vmin;margin:-4vmin 0 0 -8vmin;border-radius:4vmin;background:#3b6cf6;color:#fff;font-size:3.8vmin;font-weight:800;display:flex;align-items:center;justify-content:center}
.spot{position:absolute;left:78%;top:80%;width:0;height:0;transform-origin:0 0;animation:spot 4.8s .8s 1 both}
@keyframes spot{
  0%{opacity:0;transform:scale(1)}
  12.5%{opacity:1;transform:scale(1)}
  16.67%{opacity:1;transform:scale(1);animation-timing-function:cubic-bezier(.6,0,.25,1)}
  41.67%{opacity:1;transform:scale(.8)}
  83.33%{opacity:1;transform:scale(.8);animation-timing-function:cubic-bezier(.6,0,.25,1)}
  100%{opacity:0;transform:scale(1)}
}
.hole{position:absolute;left:-12vmin;top:-12vmin;width:24vmin;height:24vmin;border-radius:50%;box-shadow:0 0 0 250vmax rgba(10,24,70,.8);filter:blur(.8vmin)}
.ring{position:absolute;left:-12vmin;top:-12vmin;width:24vmin;height:24vmin;box-sizing:border-box;border-radius:50%;border:.6vmin solid rgba(255,255,255,.55);box-shadow:0 0 1vmin rgba(255,208,138,.35);animation:glow .7s 2.8s 1 both}
@keyframes glow{
  0%{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 rgba(255,200,120,0)}
  40%{border-color:#ffe2ae;box-shadow:0 0 5vmin 1.5vmin rgba(255,190,100,.95)}
  100%{border-color:rgba(255,255,255,.55);box-shadow:0 0 1vmin rgba(255,208,138,.35)}
}
.pin{position:absolute;left:78%;top:80%;width:0;height:0}
.callout{position:absolute;right:11vmin;bottom:8vmin;white-space:nowrap;background:#FFB45A;color:#1a1205;font-weight:900;font-size:5.5vmin;padding:2.2vmin 4vmin;border-radius:3vmin;box-shadow:0 1vmin 3vmin rgba(0,0,0,.35);animation:call 2s 2.8s 1 both}
.callout::after{content:"";position:absolute;right:5vmin;bottom:-1.6vmin;width:3.6vmin;height:3.6vmin;background:#FFB45A;transform:rotate(45deg);border-radius:0 0 .8vmin 0}
@keyframes call{
  0%{opacity:0;transform:translateY(3vmin);animation-timing-function:ease-out}
  15%{opacity:1;transform:translateY(0)}
  85%{opacity:1;transform:translateY(0);animation-timing-function:ease-in}
  100%{opacity:0;transform:translateY(0)}
}
</style>
<div class="stage">
  <div class="zoom">
    <div class="screen">
      <div class="bar"><i></i><b>메시지</b></div>
      <div class="chat">
        <div class="msg">영상 확인했어요. 0:40 부분 좋네요.</div>
        <div class="msg me">감사합니다! 바로 보낼게요.</div>
        <div class="msg">네, 기다리고 있을게요.</div>
      </div>
      <div class="input">메시지를 입력하세요</div>
      <div class="send">보내기</div>
    </div>
    <div class="spot"><div class="hole"></div><div class="ring"></div></div>
  </div>
  <div class="pin"><div class="callout">여기를 누르세요 ↘</div></div>
</div>
</html>
