<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T07 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070B16;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#070B16}
.map{position:relative;width:62vmin;height:84vmin;margin-top:-4vmin}
.land,.jeju{position:absolute;background-image:radial-gradient(circle,#1E3358 0 36%,transparent 42%);background-size:2.2vmin 2.2vmin}
.land{inset:0;clip-path:polygon(18% 8%,40% 2%,62% 0%,80% 6%,88% 14%,92% 30%,88% 48%,87% 66%,84% 80%,70% 86%,55% 88%,42% 92%,28% 90%,18% 82%,14% 66%,20% 52%,12% 40%,14% 24%)}
.jeju{left:15%;top:93%;width:13%;height:5.5%;border-radius:50%}
.pin{position:absolute;width:0;height:0}
.pin i{position:absolute;left:-1.2vmin;top:-1.2vmin;width:2.4vmin;height:2.4vmin;border-radius:50%;background:#FFB45A;box-shadow:0 0 1.6vmin rgba(255,180,90,.7);animation:drop .5s ease-in-out var(--d) 1 both}
.pin::before{content:"";position:absolute;left:-2.4vmin;top:-2.4vmin;width:4.8vmin;height:4.8vmin;box-sizing:border-box;border-radius:50%;border:.35vmin solid #4FD6FF;animation:ring 1.2s ease-out calc(var(--d) + .5s) var(--c) both}
.last::after{content:"";position:absolute;left:-60vmin;top:-60vmin;width:120vmin;height:120vmin;box-sizing:border-box;border-radius:50%;border:.6vmin solid #4FD6FF;animation:big 1.7s ease-out 4.1s 1 both}
.count{position:absolute;left:5vmin;bottom:4vmin;color:#fff;font-weight:800;font-size:6vmin;display:flex;align-items:baseline;gap:1.2vmin;white-space:nowrap}
.nums{display:inline-grid;text-align:right}
.nums span{grid-area:1/1;opacity:0;animation:on var(--u) linear var(--d) 1 both}
.nums span.end{animation-name:on2}
@keyframes drop{0%{transform:translateY(-60vmin) scale(.8);opacity:0}12%{opacity:1}70%{transform:translateY(0) scale(1)}85%{transform:translateY(-.8vmin) scale(1.06)}100%{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes big{0%{transform:scale(.05);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes on{0%{opacity:0}1%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes on2{0%{opacity:0}1%{opacity:1}100%{opacity:1}}
</style>
<div class="stage">
  <div class="map">
    <div class="land"></div>
    <div class="jeju"></div>
    <div class="pin" style="left:48%;top:48%;--d:.3s;--c:5"><i></i></div>
    <div class="pin" style="left:38%;top:22%;--d:.6s;--c:5"><i></i></div>
    <div class="pin" style="left:78%;top:78%;--d:.9s;--c:4"><i></i></div>
    <div class="pin" style="left:32%;top:70%;--d:1.2s;--c:4"><i></i></div>
    <div class="pin" style="left:80%;top:24%;--d:1.5s;--c:4"><i></i></div>
    <div class="pin" style="left:72%;top:58%;--d:1.8s;--c:4"><i></i></div>
    <div class="pin" style="left:30%;top:26%;--d:2.1s;--c:3"><i></i></div>
    <div class="pin" style="left:38%;top:58%;--d:2.4s;--c:3"><i></i></div>
    <div class="pin" style="left:82%;top:64%;--d:2.7s;--c:3"><i></i></div>
    <div class="pin" style="left:55%;top:14%;--d:3s;--c:3"><i></i></div>
    <div class="pin" style="left:52%;top:38%;--d:3.3s;--c:2"><i></i></div>
    <div class="pin last" style="left:21%;top:96%;--d:3.6s;--c:2"><i></i></div>
  </div>
  <div class="count">매장
    <span class="nums">
      <span style="--d:0s;--u:.8s">0</span>
      <span style="--d:.8s;--u:.3s">1</span>
      <span style="--d:1.1s;--u:.3s">2</span>
      <span style="--d:1.4s;--u:.3s">3</span>
      <span style="--d:1.7s;--u:.3s">4</span>
      <span style="--d:2s;--u:.3s">5</span>
      <span style="--d:2.3s;--u:.3s">6</span>
      <span style="--d:2.6s;--u:.3s">7</span>
      <span style="--d:2.9s;--u:.3s">8</span>
      <span style="--d:3.2s;--u:.3s">9</span>
      <span style="--d:3.5s;--u:.3s">10</span>
      <span style="--d:3.8s;--u:.3s">11</span>
      <span class="end" style="--d:4.1s;--u:1.9s">12</span>
    </span>곳
  </div>
</div>
</html>
