<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F31 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;
background:
radial-gradient(ellipse at 70% 30%,rgba(255,190,120,.55),transparent 55%),
linear-gradient(170deg,#2b3a5c 0%,#4a4f7a 45%,#1d2236 100%);}
.hill{position:absolute;left:-10%;right:-10%;bottom:0;height:38%;background:linear-gradient(180deg,#232a45,#12162a);border-radius:50% 50% 0 0/80% 80% 0 0}
.face{position:absolute;left:50%;top:14%;width:26vmin;height:34vmin;transform:translateX(-50%);border-radius:48% 48% 46% 46%;background:linear-gradient(180deg,#c99a7c,#a87a62);opacity:.55}
.tag{position:absolute;top:3vmin;left:3vmin;font-size:2.4vmin;color:rgba(255,255,255,.6);letter-spacing:.2vmin}
.cap{position:relative;margin-bottom:9vmin;display:flex;gap:2.2vmin;align-items:center;justify-content:center;flex-wrap:wrap;
max-width:92%;font-size:10vmin;font-weight:900;line-height:1.2;color:#fff;
animation:capIn .15s linear 0s 1 both}
.w{position:relative;display:inline-block;padding:0 1.6vmin;-webkit-text-stroke:1.6vmin #14141c;paint-order:stroke fill;
text-shadow:0 .6vmin 1.4vmin rgba(0,0,0,.5);white-space:nowrap}
.w1{animation:none}
.w2{opacity:.35;animation:spoke .1s linear .4s 1 both}
.w3{opacity:.35;z-index:0;animation:spoke .1s linear .9s 1 both,pop .25s ease-out .9s 1 both,ink .25s linear .9s 1 both}
.w3::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:6%;bottom:2%;border-radius:2vmin;background:#ffd23f;
transform-origin:left center;transform:scaleX(0);animation:fill .25s ease-out .9s 1 both}
.w3::after{content:"";position:absolute;z-index:-1;left:1.6vmin;right:1.6vmin;bottom:3%;height:1.2vmin;border-radius:1vmin;background:#ffd23f}
@keyframes capIn{from{opacity:0;transform:translateY(3vmin)}to{opacity:1;transform:translateY(0)}}
@keyframes spoke{from{opacity:.35}to{opacity:1}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(1)}55%{transform:scale(1.28)}100%{transform:scale(1.1)}}
@keyframes ink{from{color:#fff;-webkit-text-stroke-color:#14141c}to{color:#17171f;-webkit-text-stroke-color:rgba(255,210,63,0)}}
</style>
<div class="stage">
  <div class="tag">촬영 화면 예시</div>
  <div class="face"></div>
  <div class="hill"></div>
  <div class="cap">
    <span class="w w1">묻지</span>
    <span class="w w2">말고,</span>
    <span class="w w3">맡기세요</span>
  </div>
</div>
</html>
