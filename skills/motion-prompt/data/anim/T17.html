<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T17 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#334155 0%,#1e293b 45%,#475569 100%)}
/* 촬영 화면 예시 */
.bg-sun{position:absolute;width:40vmin;height:40vmin;border-radius:50%;left:12%;top:8%;
  background:radial-gradient(circle,rgba(251,191,36,.35),rgba(251,191,36,0) 70%)}
.bg-hill{position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;border-radius:50% 50% 0 0;
  background:linear-gradient(180deg,#0f766e,#0f3d3a);opacity:.55}
.bg-hill.b{left:30%;right:-40%;height:30%;background:linear-gradient(180deg,#4338ca,#1e1b4b);opacity:.5}
.card{position:relative;width:max(56vw,78vmin);box-sizing:border-box;padding:5vmin 6vmin 5.5vmin;
  background:#fff;border-radius:4vmin;text-align:center;
  box-shadow:0 4vmin 9vmin rgba(15,23,42,.55),0 1vmin 2.5vmin rgba(15,23,42,.3);
  opacity:0;transform:scale(.5) rotate(-8deg);
  animation:card 4.6s linear 0.2s 1 both}
@keyframes card{
  0%{opacity:0;transform:scale(.5) rotate(-8deg);animation-timing-function:ease-out}
  5.4%{opacity:1;transform:scale(1.08) rotate(2deg);animation-timing-function:ease-in-out}
  8.7%{opacity:1;transform:scale(1) rotate(0)}
  91.3%{opacity:1;transform:scale(1) rotate(0);animation-timing-function:ease-in}
  100%{opacity:0;transform:scale(.6) rotate(6deg)}
}
.tag{font-size:3.4vmin;font-weight:700;color:#6366F1;letter-spacing:.5em;margin-right:-.5em}
.term{font-size:17vmin;font-weight:900;color:#1e1b4b;line-height:1.05;margin:1.5vmin 0 1vmin;letter-spacing:.02em}
.full{font-size:3vmin;color:#6b7280;white-space:nowrap;margin-bottom:3.5vmin}
.mean-wrap{display:flex;justify-content:center}
.mean{display:inline-block;white-space:nowrap;font-size:5.8vmin;font-weight:800;color:#1e1b4b;padding:0 .4vmin;
  clip-path:inset(-20% 100% -20% 0);
  background:linear-gradient(#FDE68A,#FDE68A) no-repeat 0 100%/0% 50%;
  animation:type 1s steps(10,end) .9s 1 both,
            hl .5s ease-out 2.1s 1 both,
            pulse .3s ease-in-out 2.5s 1 both}
@keyframes type{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
@keyframes hl{from{background-size:0% 50%}to{background-size:100% 50%}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
</style>
<div class="stage">
  <div class="bg-sun"></div><div class="bg-hill b"></div><div class="bg-hill"></div>
  <div class="card">
    <div class="tag">오늘의 용어</div>
    <div class="term">API</div>
    <div class="full">Application Programming Interface</div>
    <div class="mean-wrap"><span class="mean">= 식당의 주문 창구</span></div>
  </div>
</div>
</html>
