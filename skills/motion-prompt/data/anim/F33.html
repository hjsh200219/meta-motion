<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F33 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#5b7aa6 0%,#8a9fbf 45%,#c7b8a6 100%)}
.person{position:absolute;left:50%;top:50%;width:0;height:0}
.head{position:absolute;left:-9vmin;top:-34vmin;width:18vmin;height:22vmin;border-radius:50%;background:linear-gradient(#d9b79a,#c49a7c)}
.body{position:absolute;left:-26vmin;top:-10vmin;width:52vmin;height:70vmin;border-radius:26vmin 26vmin 0 0;background:linear-gradient(#34425c,#222c40)}
.tag{position:absolute;left:3vmin;top:3vmin;font-size:2.4vmin;color:#fff;opacity:.55;letter-spacing:.2vmin}
.cap{position:absolute;left:0;right:0;bottom:7vmin;display:flex;flex-direction:column;align-items:center;gap:2.4vmin}
.exp{display:flex;align-items:center;gap:1.8vmin;max-width:90vw;animation:rise .3s ease-out 0s 1 both}
.chip{flex:none;font-size:3.6vmin;font-weight:800;color:#fff;background:#1f2a44;padding:.6vmin 1.8vmin;border-radius:1vmin}
.exp .chip{animation:chipfade .4s linear 1.3s 1 both}
.sent{position:relative;display:inline-block;font-size:6.4vmin;font-weight:900;color:#fff;-webkit-text-stroke:1.2vmin #141a28;paint-order:stroke fill;animation:gray .4s linear 1.3s 1 both}
.line{position:absolute;left:-1vmin;right:-1vmin;top:50%;height:1.3vmin;margin-top:-.65vmin;background:#ffc400;border-radius:1vmin;transform-origin:left center;animation:strike .4s ease-in-out 1.3s 1 both}
.plate{display:flex;align-items:center;gap:2vmin;max-width:88vw;box-sizing:border-box;padding:2vmin 3.2vmin;background:#ffc400;border-radius:2.4vmin;box-shadow:0 1.2vmin 3vmin rgba(0,0,0,.35);transform-origin:left center;animation:pop .3s ease-out 1.7s 1 both}
.plate .chip{font-size:3.8vmin}
.real{font-size:8vmin;font-weight:900;color:#1a1a1a;line-height:1.15}
@keyframes rise{from{opacity:0;transform:translateY(3vmin)}to{opacity:1;transform:translateY(0)}}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gray{from{color:#fff;opacity:1}to{color:#a8adb5;opacity:.55}}
@keyframes chipfade{from{opacity:1}to{opacity:.55}}
@keyframes pop{
0%{opacity:0;transform:rotate(-3deg) scale(.4)}
15%{opacity:1}
70%{opacity:1;transform:rotate(-3deg) scale(1.05)}
100%{opacity:1;transform:rotate(-3deg) scale(1)}}
</style>
<div class="stage">
  <div class="tag">촬영 화면 예시</div>
  <div class="person"><div class="body"></div><div class="head"></div></div>
  <div class="cap">
    <div class="exp">
      <span class="chip">기대</span>
      <span class="sent">AI가 알아서 다 해 준다<span class="line"></span></span>
    </div>
    <div class="plate">
      <span class="chip">현실</span>
      <span class="real">잘 물어봐야 해 준다</span>
    </div>
  </div>
</div>
</html>
