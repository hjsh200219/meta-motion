<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 E04 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#161A28;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;--w:min(92vw,62vh)}
.glow{position:absolute;left:50%;top:50%;width:120vmax;height:120vmax;
  background:radial-gradient(circle at 30% 50%,rgba(255,122,69,.38) 0,transparent 20%),radial-gradient(circle at 70% 50%,rgba(31,168,138,.38) 0,transparent 20%);
  transform:translate(-50%,-50%);animation:spin 5.4s linear 0s 1 both}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(110deg)}}

.poster{position:relative;width:var(--w);height:calc(var(--w)*1.4);background:#FFF3DE;border-radius:calc(var(--w)*.04);
  box-shadow:0 3vmin 9vmin rgba(0,0,0,.6);overflow:hidden;color:#111;
  animation:rise .45s cubic-bezier(.2,.8,.3,1) .1s 1 both}
@keyframes rise{from{opacity:0;transform:translateY(6%) scale(.86)}to{opacity:1;transform:none}}

.shape{position:absolute;border-radius:50%;z-index:1}
.orange{background:#FF7A45;width:62%;aspect-ratio:1;right:-14%;top:-6%;animation:pop .5s cubic-bezier(.3,1.5,.5,1) .45s 1 both}
.teal{background:#1FA88A;width:30%;aspect-ratio:1;right:-9%;top:40%;animation:pop .5s cubic-bezier(.3,1.5,.5,1) .7s 1 both}
.dot{background:#FFD23F;border:calc(var(--w)*.012) solid #111;box-sizing:border-box;width:8%;aspect-ratio:1;right:24%;top:35%;animation:pop .3s cubic-bezier(.3,1.6,.5,1) 1s 1 both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

.title{position:absolute;left:8%;top:10%;z-index:2;font-size:calc(var(--w)*.155);font-weight:900;line-height:1.12;letter-spacing:-.02em}
.title .ln{display:block;overflow:hidden;padding-bottom:.04em}
.title .ln span{display:block;animation:up .5s cubic-bezier(.2,.8,.3,1) 1.15s 1 both}
.title .ln:nth-child(2) span{animation-delay:1.3s}
@keyframes up{from{transform:translateY(115%)}to{transform:none}}

.date{position:absolute;left:0;top:41%;width:80%;z-index:3;background:#161A28;color:#fff;box-sizing:border-box;
  padding:calc(var(--w)*.035) calc(var(--w)*.06);border-radius:0 calc(var(--w)*.03) calc(var(--w)*.03) 0;
  font-size:calc(var(--w)*.1);font-weight:900;white-space:nowrap;animation:slide .45s cubic-bezier(.2,.8,.3,1) 1.95s 1 both}
.date b{color:#FFD23F;font-weight:900}
@keyframes slide{from{transform:translateX(-110%)}to{transform:none}}

.time{position:absolute;left:8%;top:60%;z-index:3;font-size:calc(var(--w)*.07);font-weight:900;animation:float .4s ease-out 2.35s 1 both}
@keyframes float{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:none}}
.place{position:absolute;left:8%;top:69%;z-index:3;display:flex;align-items:center;gap:calc(var(--w)*.03);
  font-size:calc(var(--w)*.075);font-weight:900;transform-origin:left center;animation:pop2 .45s cubic-bezier(.3,1.5,.5,1) 2.5s 1 both}
@keyframes pop2{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.pin{width:calc(var(--w)*.065);height:calc(var(--w)*.065);background:#E5322D;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  display:flex;align-items:center;justify-content:center;margin-right:calc(var(--w)*.01)}
.pin::after{content:"";width:34%;height:34%;border-radius:50%;background:#fff}

.foot{position:absolute;left:0;right:0;bottom:0;height:14%;z-index:3;background:#161A28;color:#fff;display:flex;align-items:center;
  padding:0 8%;font-size:calc(var(--w)*.06);font-weight:800;animation:foot .5s cubic-bezier(.2,.8,.3,1) 2.9s 1 both}
.foot b{color:#FFD23F;margin-left:.4em;font-weight:900}
@keyframes foot{from{transform:translateY(105%)}to{transform:none}}

.sweep{position:absolute;top:-10%;bottom:-10%;left:0;width:35%;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-200%) skewX(-20deg);
  animation:sweep .9s ease-in-out 3.4s 1 both}
@keyframes sweep{from{transform:translateX(-200%) skewX(-20deg)}to{transform:translateX(420%) skewX(-20deg)}}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="poster">
    <div class="shape orange"></div>
    <div class="shape teal"></div>
    <div class="shape dot"></div>
    <div class="title"><span class="ln"><span>가을 나눔</span></span><span class="ln"><span>장터</span></span></div>
    <div class="date">10월 17일<b>(토)</b></div>
    <div class="time">10:00~16:00</div>
    <div class="place"><span class="pin"></span>○○시청 광장</div>
    <div class="foot">문의<b>02-000-0000</b></div>
    <div class="sweep"></div>
  </div>
</div>
</html>
