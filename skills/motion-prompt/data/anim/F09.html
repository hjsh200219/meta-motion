<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F09 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#080b14;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;background:radial-gradient(ellipse at center,#0e1424 0%,#080b14 70%)}
.line{position:absolute;left:50%;top:50%;height:.8vmin;margin-top:-.4vmin;border-radius:1vmin;background:#ffd23f;
  transform-origin:0 50%;transform:rotate(var(--a)) scaleX(0);width:calc(var(--l) * 1vmin);
  animation:draw .4s linear both;animation-delay:calc(.5s + var(--i) * .15s)}
@keyframes draw{from{transform:rotate(var(--a)) scaleX(0)}to{transform:rotate(var(--a)) scaleX(1)}}
.box{position:absolute;left:calc(50% + var(--x) * 1vmin);top:calc(50% + var(--y) * 1vmin);
  width:26vmin;height:9vmin;margin-left:-13vmin;margin-top:-4.5vmin;border-radius:3vmin;background:#fff;color:#111;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:4.4vmin;white-space:nowrap;
  z-index:2;transform:scale(0);animation:pop .45s both;animation-delay:calc(.8s + var(--i) * .15s)}
@keyframes pop{0%{transform:scale(0)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
.hub{position:absolute;left:50%;top:50%;width:0;height:0;display:flex;align-items:center;justify-content:center;z-index:3;
  animation:bump .25s both;animation-delay:1.6s}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.pill{flex:none;padding:2.4vmin 6vmin;border-radius:20vmin;background:#ffd23f;color:#1a1530;font-weight:900;font-size:9vmin;
  white-space:nowrap;transform:scale(0);animation:hubpop .5s both;animation-delay:.1s;box-shadow:0 0 4vmin rgba(255,210,63,.35)}
@keyframes hubpop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
</style>
<div class="stage">
  <div class="line" style="--i:0;--a:-90deg;--l:30"></div>
  <div class="line" style="--i:1;--a:-16deg;--l:33.6"></div>
  <div class="line" style="--i:2;--a:50.5deg;--l:31.4"></div>
  <div class="line" style="--i:3;--a:129.5deg;--l:31.4"></div>
  <div class="line" style="--i:4;--a:196deg;--l:33.6"></div>
  <div class="box" style="--i:0;--x:0;--y:-30">메일 분류</div>
  <div class="box" style="--i:1;--x:32.3;--y:-9.3">일정 정리</div>
  <div class="box" style="--i:2;--x:20;--y:24.3">문서 초안</div>
  <div class="box" style="--i:3;--x:-20;--y:24.3">자료 찾기</div>
  <div class="box" style="--i:4;--x:-32.3;--y:-9.3">알림 보내기</div>
  <div class="hub"><div class="pill">AI 비서</div></div>
</div>
</html>
