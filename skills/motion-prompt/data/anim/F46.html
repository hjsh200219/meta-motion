<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F46 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{display:flex;align-items:center;justify-content:center}
.stage{--u:min(1vw,1.7778vh);position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);overflow:hidden;background:#000}
.cam{position:absolute;inset:0;transform-origin:61.7% 38.6%;animation:push 1.2s cubic-bezier(.7,0,.25,1) .5s 1 both}
@keyframes push{from{transform:translate(0,0) scale(1)}to{transform:translate(-11.7%,11.4%) scale(2.24)}}

/* 촬영 화면 예시: 강의실 */
.wall{position:absolute;inset:0;background:linear-gradient(180deg,#8d99a8 0%,#a9b3bf 55%,#7b8592 100%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#4a4036,#2c251f)}
.lamp{position:absolute;top:0;left:0;right:0;height:30%;background:radial-gradient(ellipse at 60% 0,rgba(255,255,255,.35),transparent 70%)}
.prof{position:absolute;left:23%;top:30%;width:11%;height:60%}
.head{position:absolute;left:30%;top:0;width:40%;height:19%;border-radius:50%;background:#c79a7a}
.hair{position:absolute;left:28%;top:-2%;width:44%;height:11%;border-radius:50% 50% 30% 30%;background:#2a2320}
.body{position:absolute;left:8%;top:20%;width:84%;height:80%;border-radius:25% 25% 5% 5%;background:linear-gradient(180deg,#2f3f5c,#222d44)}
.desk{position:absolute;left:6%;bottom:0;width:30%;height:12%;background:#5b4a3a;border-radius:.6vmin .6vmin 0 0}

/* 스크린 */
.scr{position:absolute;left:40.83%;top:16.3%;width:41.77%;height:44.63%;
 box-shadow:0 0 0 calc(var(--u)*.55) #0a0e18,0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.4);
 background:#e9edf2;transform:perspective(calc(var(--u)*90)) rotateY(-14deg);transform-origin:50% 50%;
 animation:flat 1.2s cubic-bezier(.7,0,.25,1) .5s 1 both}
@keyframes flat{from{transform:perspective(calc(var(--u)*90)) rotateY(-14deg)}to{transform:perspective(calc(var(--u)*90)) rotateY(0deg)}}
.slide{position:absolute;inset:0;overflow:hidden;background:#17264a;display:flex;flex-direction:column;justify-content:center;padding:0 7%;box-sizing:border-box;
 box-shadow:inset 0 0 calc(var(--u)*.9) calc(var(--u)*.35) rgba(255,255,255,.22);animation:appear .5s linear 0s 1 both}
@keyframes appear{from{opacity:0}to{opacity:1}}
.t{color:#fff;font-weight:800;font-size:calc(var(--u)*3.2);margin-bottom:calc(var(--u)*.4)}
.f{color:#9fb4e6;font-size:calc(var(--u)*1.5);margin-bottom:calc(var(--u)*1.6)}
.bars{display:flex;align-items:flex-end;gap:4%;height:38%}
.bars i{flex:1;border-radius:calc(var(--u)*.3) calc(var(--u)*.3) 0 0;background:linear-gradient(180deg,#5b8cff,#3558c8)}
.bars i:nth-child(1){height:45%}.bars i:nth-child(2){height:70%}.bars i:nth-child(3){height:55%}.bars i:nth-child(4){height:95%;background:linear-gradient(180deg,#ffd166,#e0902f)}
.sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.55) 46%,transparent 62%);opacity:.35;animation:sh 1.2s ease-out .5s 1 both}
@keyframes sh{from{opacity:.35}to{opacity:.12}}

/* 확대 때 주변을 슬라이드 바탕색으로 덮음 */
.dim{position:absolute;left:-150%;right:-150%;top:-150%;bottom:-150%;background:#17264a;opacity:0;animation:dimin .8s ease-in .9s 1 both}
@keyframes dimin{from{opacity:0}to{opacity:1}}
.scr{z-index:3}.dim{z-index:2}

/* 이름표 */
.chip{position:absolute;left:calc(var(--u)*2.5);top:calc(var(--u)*2.5);z-index:5;padding:calc(var(--u)*.7) calc(var(--u)*1.8);border-radius:calc(var(--u)*3);background:rgba(14,22,42,.88);color:#fff;font-size:calc(var(--u)*2.4);font-weight:700;animation:chip .3s ease-out 1.7s 1 both}
@keyframes chip{from{opacity:0;transform:translateY(calc(var(--u)*-1))}to{opacity:1;transform:translateY(0)}}
</style>
<div class="stage">
  <div class="cam">
    <div class="wall"></div><div class="lamp"></div><div class="floor"></div>
    <div class="prof"><div class="body"></div><div class="head"></div><div class="hair"></div></div>
    <div class="desk"></div>
    <div class="dim"></div>
    <div class="scr">
      <div class="slide">
        <div class="t">슬라이드 12</div>
        <div class="f">slide_12.png</div>
        <div class="bars"><i></i><i></i><i></i><i></i></div>
        <div class="sheen"></div>
      </div>
    </div>
  </div>
  <div class="chip">스크린 화면</div>
</div>
</html>
