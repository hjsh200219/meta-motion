<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F17 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#f6f1e7;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111;display:flex;align-items:center;justify-content:center}
.stage{width:100%;height:100%;box-sizing:border-box;padding:5vmin 6vmin;display:flex;flex-direction:column;align-items:center}
.head{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.title{font-size:8vmin;font-weight:900;line-height:1.15;letter-spacing:-0.02em;animation:slide 0.5s 0.05s cubic-bezier(.2,.8,.2,1) 1 both}
.src{font-size:3.2vmin;color:#8a8a8a;white-space:nowrap;margin-top:1vmin;animation:fade 0.5s 0.05s ease-out 1 both}
.chart{position:relative;margin-top:auto;margin-bottom:9vmin;width:88vmin;max-width:100%;height:50vmin;display:flex;justify-content:space-around;align-items:flex-end;border-bottom:0.8vmin solid #111}
.col{position:relative;width:18vmin;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{position:relative;width:15vmin;height:0;background:#2b3340;border-radius:2.5vmin 2.5vmin 0 0;animation:grow 0.7s var(--d) cubic-bezier(.2,.8,.2,1) 1 both}
.bar.max{background:#e8452c}
.num{position:absolute;left:50%;bottom:100%;margin-bottom:1vmin;transform:translateX(-50%);font-size:7vmin;font-weight:900;white-space:nowrap;transform-origin:50% 100%;--n:0;counter-reset:c var(--n);animation:count 0.7s var(--d) cubic-bezier(.2,.8,.2,1) 1 both}
.num::after{content:counter(c)}
.max .num{color:#e8452c;animation:count 0.7s var(--d) cubic-bezier(.2,.8,.2,1) 1 both,pop 0.3s 1.5s ease-in-out 1 both}
.lab{position:absolute;top:100%;margin-top:2vmin;font-size:3.4vmin;font-weight:700;white-space:nowrap;left:50%;transform:translateX(-50%)}
.c1{--d:0.4s;--h:37.5vmin;--v:90}
.c2{--d:0.6s;--h:25vmin;--v:60}
.c3{--d:0.8s;--h:50vmin;--v:120}
.c4{--d:1s;--h:18.75vmin;--v:45}
.c1 .num{--t:90}.c2 .num{--t:60}.c3 .num{--t:120}.c4 .num{--t:45}
@keyframes slide{from{transform:translateX(-30vmin);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{height:0}to{height:var(--h)}}
@keyframes pop{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
.c1 .num{animation-name:count1}
.c2 .num{animation-name:count2}
.c3 .num{animation-name:count3,pop}
.c4 .num{animation-name:count4}
@keyframes count1{0%{--n:0;opacity:0}3%{opacity:1}100%{--n:90;opacity:1}}
@keyframes count2{0%{--n:0;opacity:0}3%{opacity:1}100%{--n:60;opacity:1}}
@keyframes count3{0%{--n:0;opacity:0}3%{opacity:1}100%{--n:120;opacity:1}}
@keyframes count4{0%{--n:0;opacity:0}3%{opacity:1}100%{--n:45;opacity:1}}
.c3 .num{animation-duration:0.7s,0.3s;animation-delay:0.8s,1.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1),ease-in-out;animation-iteration-count:1,1;animation-fill-mode:both,both}
</style>
<div class="stage">
  <div class="head">
    <div class="title">업무별 걸린<br>시간 (분)</div>
    <div class="src">자료: ○○센터 설문</div>
  </div>
  <div class="chart">
    <div class="col c1"><div class="bar"><div class="num"></div></div><div class="lab">메일 정리</div></div>
    <div class="col c2"><div class="bar" style="--d:0.6s"><div class="num"></div></div><div class="lab">일정 조율</div></div>
    <div class="col c3"><div class="bar max" style="--d:0.8s"><div class="num"></div></div><div class="lab">보고서 초안</div></div>
    <div class="col c4"><div class="bar" style="--d:1s"><div class="num"></div></div><div class="lab">자료 찾기</div></div>
  </div>
</div>
</html>
