<!-- 생성 파일(build_card_anim.py) — 카드 M07 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fd3f5;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.view{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(#5aaeea,#cfeaff 70%,#eaf6ff)}
.stage{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);margin-left:calc(max(100vw,177.78vh) / -2);margin-top:calc(max(56.25vw,100vh) / -2);transform-origin:0 0;background:linear-gradient(#5aaeea,#cfeaff 60%,#eaf6ff);animation:cam 7.9s linear 0s 1 both}
.stage{left:0;top:0;margin:0;transform-origin:0 0}
.stagewrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
@keyframes cam{
0%{transform:translate(0,0) scale(1);animation-timing-function:ease-in-out}
19%{transform:translate(0%,-106.4%) scale(2.2);animation-timing-function:linear}
44.3%{transform:translate(-47.5%,-52.2%) scale(2)}
79.7%{transform:translate(-100%,0%) scale(2)}
84.8%{transform:translate(-100%,0%) scale(2);animation-timing-function:ease-in-out}
100%{transform:translate(0,0) scale(1)}}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fo{transform-box:fill-box;transform-origin:50% 100%}
.sflag{animation:rise 1.4s ease-out .1s 1 both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bounce{animation:bnc .7s ease-out 6.3s 1 both}
@keyframes bnc{0%{transform:scale(1)}30%{transform:scale(1.7)}55%{transform:scale(.9)}78%{transform:scale(1.2)}100%{transform:scale(1)}}
.draw{stroke-dasharray:100;animation:dr 5.6s linear .7s 1 both}
@keyframes dr{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.dot{opacity:0;animation:mv 5.6s linear .7s 1 both,show .01s linear .69s 1 both}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes mv{
0%{transform:translate(22px,70px)}
16.6%{transform:translate(40px,58px)}
31.2%{transform:translate(58px,63px)}
50.5%{transform:translate(78px,46px)}
65.1%{transform:translate(96px,52px)}
84.7%{transform:translate(114px,34px)}
100%{transform:translate(130px,22px)}}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:pl 1.4s ease-out .7s 4 both}
@keyframes pl{from{transform:scale(.8);opacity:1}to{transform:scale(1.8);opacity:.1}}
.burst{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:bs .9s ease-out 6.3s 1 both}
@keyframes bs{0%{opacity:0;transform:scale(1)}8%{opacity:.95}100%{opacity:0;transform:scale(8)}}
.title{position:absolute;left:3vmin;top:3vmin;background:#14213d;color:#fff;padding:2vmin 3vmin;border-radius:1.5vmin;box-shadow:0 1vmin 3vmin rgba(0,0,0,.3)}
.title b{display:block;font-size:5.4vmin;line-height:1.2}
.title span{display:block;font-size:3.6vmin;margin-top:.8vmin;color:#c9d6ee}
.dist{position:absolute;right:3vmin;top:3vmin;background:rgba(20,33,61,.85);color:#fff;border-radius:1.5vmin;padding:0 3vmin;height:8vmin;overflow:hidden;font-size:5.4vmin;font-weight:800}
.dist div{height:8vmin;line-height:8vmin;white-space:nowrap}
.dist .col{animation:cnt 5.6s steps(9,end) .7s 1 both}
@keyframes cnt{from{transform:translateY(0)}to{transform:translateY(-72vmin)}}
.dist{--h:8vmin}
.graph{position:absolute;left:50%;bottom:3vmin;width:70vmin;height:14vmin;margin-left:-35vmin;background:rgba(20,33,61,.8);border-radius:1.5vmin;overflow:hidden}
.graph svg{position:absolute;left:0;top:0;width:70vmin;height:14vmin}
.fill{position:absolute;left:0;top:0;height:100%;width:0;overflow:hidden;animation:fw 5.6s linear .7s 1 both}
@keyframes fw{from{width:0}to{width:70vmin}}
.pt{position:absolute;top:0;left:0;width:0;height:100%;animation:pp 5.6s linear .7s 1 both}
.pt i{position:absolute;left:-1.2vmin;top:3vmin;width:2.4vmin;height:2.4vmin;border-radius:50%;background:#fff;border:.5vmin solid #ff8a2e}
@keyframes pp{from{left:0}to{left:70vmin}}
</style>

<path d="M22,70L40,58L58,63L78,46L96,52L114,34L130,22" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width=".8" stroke-linejoin="round"/>
<path class="draw" pathLength="100" d="M22,70L40,58L58,63L78,46L96,52L114,34L130,22" fill="none" stroke="#FF4D2E" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(22,70)"><g class="fo"><rect x="-6" y="-8" width="12" height="5" rx="1" fill="#2fa84f"/><text x="0" y="-4.2" font-size="3.4" fill="#fff" text-anchor="middle" font-weight="700">출발</text><path d="M-1.5-3h3l-1.5 3z" fill="#2fa84f"/></g></g>

</svg></div>
