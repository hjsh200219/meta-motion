<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 M11 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.map{position:relative;width:100%;height:100%;overflow:hidden;background:
 linear-gradient(#fff,#fff) 50% 62%/100% 2.4vmin no-repeat,
 linear-gradient(#fff,#fff) 40% 50%/2.4vmin 100% no-repeat,
 repeating-linear-gradient(90deg,transparent 0 9vmin,#fff 9vmin 9.8vmin),
 repeating-linear-gradient(0deg,transparent 0 12vmin,#fff 12vmin 12.8vmin),
 #E4E8ED}
.river{position:absolute;left:-25vmax;width:150vmax;top:80%;height:6vmin;background:#BFE0F2;transform:rotate(-12deg)}
.park{position:absolute;background:#CFE6C8;border-radius:1.5vmin}
.p1{left:12%;top:58%;width:14vmin;height:10vmin}
.p2{right:10%;top:14%;width:16vmin;height:11vmin}
.c{position:absolute;left:50%;top:50%;width:0;height:0}

.ring{position:absolute;border-radius:50%;animation:grow .9s cubic-bezier(.2,.8,.2,1) .5s 1 both}
.ring i{position:absolute;inset:0;box-sizing:border-box;border-radius:50%;border:.7vmin dashed #E8442E;background:rgba(232,68,46,.07);animation:wob .6s ease-out 2.75s 1 both}
.r1{width:26.67vmin;height:26.67vmin;left:-13.33vmin;top:-13.33vmin}
.r2{width:53.33vmin;height:53.33vmin;left:-26.67vmin;top:-26.67vmin;animation-delay:1.1s}
.r3{width:80vmin;height:80vmin;left:-40vmin;top:-40vmin;animation-delay:1.7s;animation-duration:1.05s}

.wave{position:absolute;box-sizing:border-box;width:80vmin;height:80vmin;left:-40vmin;top:-40vmin;border-radius:50%;border:.5vmin solid rgba(232,68,46,.7);animation:wave 1.3s ease-out 2.6s 1 both}
.w2{animation-delay:3.7s}

.sh{position:absolute;left:-2vmin;top:-.6vmin;width:4vmin;height:1.2vmin;border-radius:50%;background:rgba(0,0,0,.28);animation:sh .6s ease-out 0s 1 both}
.pinw{position:absolute;left:-2.5vmin;top:-6.04vmin;width:5vmin;height:5vmin;animation:drop .6s linear 0s 1 both}
.pin{position:relative;width:100%;height:100%;background:#E8442E;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 .5vmin 1vmin rgba(0,0,0,.25)}
.pin::after{content:"";position:absolute;width:40%;height:40%;left:30%;top:30%;border-radius:50%;background:#fff}
.lab{position:absolute;left:0;top:1.6vmin;white-space:nowrap;text-align:center;background:#1F2933;color:#fff;padding:1vmin 2vmin;border-radius:1.2vmin;animation:labin .3s ease-out .3s 1 both}
.lab b{display:block;font-size:4vmin}
.lab span{font-size:3vmin;opacity:.85}

.chip,.pl{position:absolute;white-space:nowrap;font-weight:700;animation:pop .3s cubic-bezier(.3,1.4,.5,1) 1 both}
.chip{background:#E8442E;color:#fff;font-size:3.6vmin;padding:.7vmin 1.6vmin;border-radius:5vmin;box-shadow:0 .4vmin 1vmin rgba(232,68,46,.4)}
.k1{left:9.43vmin;top:-9.43vmin;animation-delay:1.2s}
.k2{left:18.86vmin;top:-18.86vmin;animation-delay:1.8s}
.k3{left:28.28vmin;top:-28.28vmin;animation-delay:2.45s}
.pl{background:#fff;color:#1F2933;font-size:3.6vmin;padding:.8vmin 1.8vmin .8vmin 1.4vmin;border-radius:5vmin;box-shadow:0 .4vmin 1vmin rgba(0,0,0,.2)}
.pl::before{content:"";display:inline-block;width:2vmin;height:2vmin;border-radius:50%;margin-right:1vmin;vertical-align:-.2vmin;background:var(--d)}
.s1{left:-17vmin;top:-14vmin;--d:#2D6CDF;animation-delay:1.55s}
.s2{left:24vmin;top:16vmin;--d:#F2A33A;animation-delay:2.1s}
.s3{left:-22vmin;top:24vmin;--d:#2F8F5B;animation-delay:2.4s}

.card{position:absolute;left:3vmin;top:3vmin;background:#fff;border-radius:2vmin;padding:1.4vmin 2.6vmin;box-shadow:0 .6vmin 2vmin rgba(0,0,0,.18);animation:cardin .4s ease-out 0s 1 both}
.card b{display:block;font-size:4vmin;color:#1F2933}
.card strong{font-size:7vmin;color:#E8442E;line-height:1.1}
.src{position:absolute;right:2vmin;bottom:1.6vmin;font-size:2.4vmin;color:#6B7684}

@keyframes drop{
 0%{transform:translateY(-48vmin);opacity:0;animation-timing-function:ease-in}
 8%{opacity:1}
 55%{transform:translateY(0);animation-timing-function:ease-out}
 72%{transform:translateY(-4vmin);animation-timing-function:ease-in}
 88%{transform:translateY(0);animation-timing-function:ease-out}
 94%{transform:translateY(-.8vmin);animation-timing-function:ease-in}
 100%{transform:translateY(0)}}
@keyframes sh{0%{transform:scale(.2);opacity:0}55%{transform:scale(1);opacity:1}72%{transform:scale(.7)}88%,100%{transform:scale(1);opacity:1}}
@keyframes labin{0%{transform:translate(-50%,-1.5vmin);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
@keyframes grow{0%{transform:scale(.15);opacity:0}25%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}60%{transform:translate(-50%,-50%) scale(1.12);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes wob{
 0%{transform:scale(1)}
 35%{transform:scale(1.05);background:rgba(232,68,46,.22);border-color:#FF6A4F;box-shadow:0 0 3vmin rgba(232,68,46,.6)}
 65%{transform:scale(.985)}
 100%{transform:scale(1)}}
@keyframes wave{0%{transform:scale(.05);opacity:0}10%{opacity:.85}100%{transform:scale(1);opacity:0}}
@keyframes cardin{0%{transform:translateY(-2vmin);opacity:0}100%{transform:translateY(0);opacity:1}}
</style>
<div class="map">
  <div class="river"></div>
  <div class="park p1"></div>
  <div class="park p2"></div>
  <div class="c">
    <div class="ring r3"><i></i></div>
    <div class="ring r2"><i></i></div>
    <div class="ring r1"><i></i></div>
    <div class="wave"></div>
    <div class="wave w2"></div>
    <div class="sh"></div>
    <div class="lab"><b>우리 가게</b><span>(○○시 ○○동)</span></div>
    <div class="pinw"><div class="pin"></div></div>
    <div class="chip k1">도보 5분</div>
    <div class="chip k2">도보 10분</div>
    <div class="chip k3">도보 15분</div>
    <div class="pl s1">○○역</div>
    <div class="pl s2">○○초등학교</div>
    <div class="pl s3">○○공원</div>
  </div>
  <div class="card"><b>걸어서</b><strong>5·10·15분</strong></div>
  <div class="src">지도 출처 ○○시 공간정보 · 도보 80m/분 기준</div>
</div>
</html>
