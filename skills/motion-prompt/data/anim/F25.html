<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F25 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;box-sizing:border-box;padding:0 9vmin;background:linear-gradient(135deg,#2a1748 0%,#13203a 55%,#090d18 100%);font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff}
.stage::before{content:"";position:absolute;left:-20vmin;top:-20vmin;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,138,61,.14),transparent 70%)}
.box{position:relative;display:flex;flex-direction:column;align-items:flex-start;max-width:100%}
.part{font-size:4.6vmin;font-weight:800;letter-spacing:.6em;color:#ff8a3d;margin-bottom:2.4vmin;white-space:nowrap;animation:partIn .5s cubic-bezier(.2,.8,.2,1) .1s 1 both}
@keyframes partIn{from{opacity:0;transform:translateX(-12vmin)}to{opacity:1;transform:translateX(0)}}
.title{font-size:8.5vmin;font-weight:900;letter-spacing:-.02em;white-space:nowrap;line-height:1.25;
animation:reveal .7s cubic-bezier(.3,.7,.2,1) .35s 1 both,glow .4s ease-in-out 1.5s 1 both}
@keyframes reveal{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -10% -20% 0)}}
@keyframes glow{0%{text-shadow:0 0 0 rgba(255,255,255,0)}50%{text-shadow:0 0 3vmin rgba(255,255,255,.95),0 0 6vmin rgba(255,200,150,.6)}100%{text-shadow:0 0 0 rgba(255,255,255,0)}}
.line{height:1.3vmin;width:34vmin;border-radius:1vmin;background:#ff8a3d;margin-top:2vmin;transform-origin:left center;animation:grow .5s cubic-bezier(.6,0,.2,1) 1s 1 both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.prog{display:flex;align-items:center;gap:1.6vmin;margin-top:4vmin;animation:fade 3.2s ease-out 1.3s 1 both}
@keyframes fade{0%{opacity:0;transform:translateY(2vmin)}30%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
.dot{width:1.8vmin;height:1.8vmin;border-radius:1vmin;background:rgba(255,255,255,.25)}
.dot.done{background:#ff8a3d}
.dot.now{width:6vmin;background:#ff8a3d}
.num{margin-left:2vmin;font-size:4vmin;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.75);white-space:nowrap}
</style>
<div class="stage">
  <div class="box">
    <div class="part">PART 2</div>
    <div class="title">맡길 일을 고르는 법</div>
    <div class="line"></div>
    <div class="prog">
      <span class="dot done"></span><span class="dot now"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="num">2 / 5</span>
    </div>
  </div>
</div>
</html>
