<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F64 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#222}
.foot{position:absolute;inset:-3vmin;background:linear-gradient(160deg,#6aa7d8 0%,#a9c9a4 45%,#d8b078 100%);animation:blur .45s 0s 1 both}
.foot::before{content:"";position:absolute;left:8%;top:30%;width:40%;height:50%;background:#3d5a7a;border-radius:2vmin;opacity:.6}
.foot::after{content:"";position:absolute;right:10%;top:20%;width:25%;height:60%;background:#5b7b4f;border-radius:2vmin;opacity:.6}
@keyframes blur{from{filter:blur(0)}to{filter:blur(1.4vmin)}}
.plate{position:absolute;inset:0;background:#16212e;animation:plate .45s 0s 1 both}
@keyframes plate{from{opacity:0}to{opacity:.93}}
.wrap{position:absolute;inset:0;padding:4vmin 5vmin;display:flex;flex-direction:column;gap:2.4vmin}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:1.2vmin}
.chip{display:inline-block;background:#ffb020;color:#1a1200;font-weight:800;font-size:3.6vmin;padding:.7vmin 2.4vmin;border-radius:5vmin;animation:drop .45s 0s 1 both}
h1{margin:0;color:#fff;font-size:7vmin;line-height:1.1;animation:drop .4s .08s 1 both}
@keyframes drop{from{opacity:0;transform:translateY(-6vmin)}to{opacity:1;transform:none}}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1.7fr 1fr;gap:4vmin}
.col{display:flex;flex-direction:column;gap:1.6vmin;min-height:0;min-width:0}
.pw{position:relative;flex:1;min-height:0}
.big{animation:rise .5s .4s 1 both}
.small{animation:rise .5s 1.5s 1 both}
@keyframes rise{from{opacity:0;transform:translateY(8vmin)}to{opacity:1;transform:none}}
.scr{position:absolute;inset:0;background:#f4f6f9;border-radius:1.6vmin;overflow:hidden;border:.5vmin solid #fff;display:flex;flex-direction:column}
.bar{height:16%;background:#e1e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 3%}
.bar i{display:block;width:30%;height:34%;background:#9aa7b8;border-radius:1vmin}
.btn{background:#2f6fe4;color:#fff;font-size:2.4vmin;font-weight:700;padding:.8vmin 1.6vmin;border-radius:1vmin;white-space:nowrap}
.btn.off{background:#c9ced6;color:#8a93a0}
.row{display:flex;align-items:center;gap:3%;padding:0 4%;flex:1;border-bottom:.3vmin solid #dde2ea}
.row b{width:3.2vmin;height:3.2vmin;border-radius:50%;background:#2fb457;flex:none}
.row b.r{background:#e5322d}
.row span{flex:1;height:28%;background:#c5cdd9;border-radius:.8vmin}
.err{background:#fde3e1;color:#b3201b;font-size:2.4vmin;font-weight:700;padding:1vmin 4%}
.tag{position:absolute;z-index:3;top:-2vmin;right:-1.4vmin;font-size:3.4vmin;font-weight:800;color:#fff;padding:.7vmin 2vmin;border-radius:5vmin;white-space:nowrap}
.tag.ok{background:#1f9d4c;animation:pop .2s .6s 1 both}
.tag.bad{background:#d92d27;animation:pop .2s 1.7s 1 both}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.dot{position:absolute;z-index:3;width:6.6vmin;height:6.6vmin;margin:-3.3vmin 0 0 -3.3vmin;border-radius:50%;border:.9vmin solid #ffb020;background:rgba(255,176,32,.18);display:flex;align-items:flex-start;justify-content:flex-end}
.dot em{font-style:normal;transform:translate(45%,-55%);background:#ffb020;color:#1a1200;font-weight:800;font-size:3vmin;width:4vmin;height:4vmin;border-radius:50%;display:flex;align-items:center;justify-content:center}
.d1{left:88%;top:8%;animation:bump .2s .9s 1 both}
.d2{left:7%;top:31%;animation:bump .2s 1.1s 1 both}
@keyframes bump{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
.labels{display:flex;flex-wrap:wrap;gap:1.2vmin 2.4vmin}
.lb{color:#fff;font-size:3.6vmin;font-weight:700;display:flex;align-items:center;gap:1vmin}
.lb em{font-style:normal;background:#ffb020;color:#1a1200;width:4.4vmin;height:4.4vmin;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3vmin;flex:none}
.l1{animation:fade .3s .9s 1 both}
.l2{animation:fade .3s 1.1s 1 both}
@keyframes fade{from{opacity:0;transform:translateX(-3vmin)}to{opacity:1;transform:none}}
.note{color:#aeb7c4;font-size:3vmin;animation:fade .3s 2.2s 1 both}
.fix{color:#fff;font-weight:800;font-size:4.2vmin;line-height:1.4;animation:fade .5s 2s 1 both}
@media (orientation:portrait){
 .body{grid-template-columns:1fr;grid-template-rows:1.3fr 1fr}
 h1{font-size:8.5vmin}
}
</style>
<div class="stage">
 <div class="foot"></div>
 <div class="plate"></div>
 <div class="wrap">
  <div class="head">
   <span class="chip">중간 점검 2/4</span>
   <h1>정상 vs 흔한 오류</h1>
  </div>
  <div class="body">
   <div class="col">
    <div class="pw big">
     <div class="scr">
      <div class="bar"><i></i><span class="btn">자동 분류</span></div>
      <div class="row"><b></b><span></span></div>
      <div class="row"><b></b><span></span></div>
      <div class="row"><b></b><span></span></div>
     </div>
     <span class="tag ok">✓ 이러면 정상</span>
     <div class="dot d1"><em>1</em></div>
     <div class="dot d2"><em>2</em></div>
    </div>
    <div class="labels">
     <div class="lb l1"><em>1</em>오른쪽 위 «자동 분류» 버튼</div>
     <div class="lb l2"><em>2</em>첫 줄 빨간 점</div>
    </div>
    <div class="note">기준: 노트북 · 웹 브라우저 · 무료 요금제 · 2026.10 녹화</div>
   </div>
   <div class="col">
    <div class="pw small">
     <div class="scr">
      <div class="bar"><i></i><span class="btn off">자동 분류</span></div>
      <div class="err">! 연결이 끊겼습니다</div>
      <div class="row"><b class="r"></b><span></span></div>
      <div class="row"><b></b><span></span></div>
     </div>
     <span class="tag bad">✕ 이렇게 보이면</span>
    </div>
    <div class="fix">→ 로그아웃 후 다시 로그인<br>→ 03:10 다시 보기</div>
   </div>
  </div>
 </div>
</div>
</html>
