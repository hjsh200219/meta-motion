<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T10 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#F5F7FB;display:flex;align-items:center;justify-content:center;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.flow{display:flex;align-items:center;justify-content:center}
.box{width:22vmin;height:22vmin;border-radius:4vmin;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:6vmin;letter-spacing:-0.02em;box-shadow:0 1vmin 2.5vmin rgba(30,58,138,.12)}
.b1{background:#DDD6FE;color:#1E3A8A;animation:pop .4s .2s 1 both}
.b2{background:#1E3A8A;color:#fff;animation:pop .4s 1.1s 1 both}
.b3{background:#FDE68A;color:#78350F;animation:pop3 .4s 2s 1 both,glow .4s 2s 1 both}
.arrow{width:12vmin;margin:0 1.5vmin;display:flex;align-items:center;clip-path:inset(0 100% 0 0)}
.a1{animation:draw .5s .6s 1 both}
.a2{animation:draw .5s 1.5s 1 both}
.line{flex:1;height:1.3vmin;background:#1E3A8A;border-radius:1vmin 0 0 1vmin}
.head{width:0;height:0;border-top:2.4vmin solid transparent;border-bottom:2.4vmin solid transparent;border-left:3.6vmin solid #1E3A8A}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pop3{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.32);opacity:1}75%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(253,224,71,0)}50%{box-shadow:0 0 6vmin 3vmin rgba(253,224,71,.8)}100%{box-shadow:0 0 4vmin 1vmin rgba(253,224,71,.4)}}
@keyframes draw{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}
</style>
<div class="flow">
  <div class="box b1">자료</div>
  <div class="arrow a1"><div class="line"></div><div class="head"></div></div>
  <div class="box b2">AI</div>
  <div class="arrow a2"><div class="line"></div><div class="head"></div></div>
  <div class="box b3">보고서</div>
</div>
</html>
