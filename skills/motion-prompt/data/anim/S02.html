<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 S02 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
*{box-sizing:border-box}
.stage{width:100%;height:100%;background:#F4F1EA;color:#1d1b18;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4vmin 5vmin 5vmin;gap:3vmin}
.hd{align-self:flex-start;display:flex;align-items:center;gap:3vmin;animation:pop .4s 0s 1 both}
.clock{position:relative;width:11vmin;height:11vmin;border:1.2vmin solid #1d1b18;border-radius:50%;background:#fff;flex:none}
.clock i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:1vmin}
.hh{width:1vmin;height:2.6vmin;margin-left:-.5vmin;background:#1d1b18;transform:rotate(60deg)}
.mh{width:.8vmin;height:3.8vmin;margin-left:-.4vmin;background:#E8442E;animation:spin .5s 0s 9 linear both}
.clock b{position:absolute;left:50%;top:50%;width:1.6vmin;height:1.6vmin;margin:-.8vmin;border-radius:50%;background:#1d1b18}
h1{margin:0;font-size:6.4vmin;font-weight:900;letter-spacing:-.02em}
.grid{width:100%;flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2.4vmin;align-content:center;padding-top:4vmin}
@media (min-aspect-ratio:3/2){.grid{grid-template-columns:repeat(7,1fr)}}
.d{position:relative;opacity:0;animation:rise .42s 1 both}
.d:nth-child(1){animation-delay:.3s}.d:nth-child(2){animation-delay:.43s}.d:nth-child(3){animation-delay:.56s}
.d:nth-child(4){animation-delay:.69s}.d:nth-child(5){animation-delay:.82s}.d:nth-child(6){animation-delay:.95s}
.d:nth-child(7){animation-delay:1.08s}
.c{position:relative;height:100%}
.f{height:100%;min-height:22vmin;border-radius:3vmin;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vmin;box-shadow:0 .6vmin 0 rgba(29,27,24,.08)}
.f em{font-style:normal;font-size:6vmin;font-weight:900}
.f span{font-size:4.2vmin;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0;line-height:1.15}
.f u{text-decoration:none;font-size:3.4vmin;font-weight:800;opacity:.6;line-height:.8}
.off .f{background:#d9d6cf;color:#E8442E}
.off .f u{opacity:1}
.today .f{background:#1d1b18;color:#F4F1EA;animation:beat .7s 2.25s 3 both}
.today .c{animation:big .7s 1.55s 1 both}
.today .c::before,.today .c::after{content:"";position:absolute;inset:0;border:.7vmin solid #E8442E;border-radius:3vmin;opacity:0;pointer-events:none}
.today .c::before{animation:wave1 .7s 1.55s 1 both}
.today .c::after{animation:wave2 .7s 2.25s 3 both}
.tag{position:absolute;left:50%;top:-3.6vmin;z-index:3;background:#E8442E;color:#fff;font-size:4vmin;font-weight:900;padding:.6vmin 2.6vmin;border-radius:5vmin;white-space:nowrap;opacity:0;animation:tagpop .35s 1.45s 1 both}
.chip{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4vmin 3.2vmin;background:#fff;border-radius:6vmin;padding:2.4vmin 5vmin;font-size:4vmin;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 .8vmin 3vmin rgba(29,27,24,.15);opacity:0;animation:up .9s 1.9s 1 both}
.chip p{margin:0;display:flex;align-items:center;gap:1.2vmin;white-space:nowrap}
.chip p:before{content:"";width:2.4vmin;height:2.4vmin;border-radius:50%;background:var(--k)}
@keyframes pop{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(9vmin)}60%{opacity:1;transform:translateY(-1.6vmin)}100%{opacity:1;transform:translateY(0)}}
@keyframes tagpop{0%{opacity:0;transform:translateX(-50%) scale(.3)}70%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes big{0%{scale:1}40%{scale:1.2}100%{scale:1}}
@keyframes beat{0%{scale:1}40%{scale:1.06}100%{scale:1}}
@keyframes wave1{0%{opacity:0;transform:scale(1)}1%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes wave2{0%{opacity:0;transform:scale(1)}1%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
@keyframes up{0%{opacity:0;transform:translateY(14vmin)}70%{opacity:1;transform:translateY(-1vmin)}100%{opacity:1;transform:translateY(0)}}
</style>
<div class="stage">
  <div class="hd">
    <div class="clock"><i class="hh"></i><i class="mh"></i><b></b></div>
    <h1>○○의원 진료 시간 안내</h1>
  </div>
  <div class="grid">
    <div class="d"><div class="c"><div class="f"><em>월</em><span>09:00</span><u>~</u><span>18:00</span></div></div></div>
    <div class="d"><div class="c"><div class="f"><em>화</em><span>09:00</span><u>~</u><span>18:00</span></div></div></div>
    <div class="d today"><div class="tag">오늘</div><div class="c"><div class="f"><em>수</em><span>09:00</span><u>~</u><span>18:00</span></div></div></div>
    <div class="d"><div class="c"><div class="f"><em>목</em><span>09:00</span><u>~</u><span>18:00</span></div></div></div>
    <div class="d"><div class="c"><div class="f"><em>금</em><span>09:00</span><u>~</u><span>18:00</span></div></div></div>
    <div class="d"><div class="c"><div class="f"><em>토</em><span>09:00</span><u>~</u><span>13:00</span></div></div></div>
    <div class="d off"><div class="c"><div class="f"><em>일</em><span>휴무</span></div></div></div>
  </div>
  <div class="chip">
    <p style="--k:#2FB35A">영업 평일 09:00~18:00 · 토 09:00~13:00</p>
    <p style="--k:#F5933A">점심 12:30~13:30</p>
    <p style="--k:#E8442E">휴무 일요일·공휴일</p>
  </div>
</div>
</html>
