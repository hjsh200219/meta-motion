<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 B12 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080E;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:absolute;inset:0;perspective:150vw;background:#06080E;overflow:hidden}
.cube{position:absolute;inset:0;transform-style:preserve-3d;
  transform:translateZ(-50vw) translateZ(0vw) rotateY(0deg);
  animation:cube 0.9s linear 0s 1 both}
.face{position:absolute;left:0;top:0;width:100vw;height:100vh;backface-visibility:hidden;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
.front{transform:translateZ(50vw)}
.right{transform:rotateY(90deg) translateZ(50vw)}
.left{transform:rotateY(-90deg) translateZ(50vw);background:#111418}
.back{transform:rotateY(180deg) translateZ(50vw);background:#111418}

.a{background:linear-gradient(180deg,#ff9a5a 0%,#ffcf8a 55%,#ffe9b8 100%)}
.a .sun{position:absolute;width:22vmin;height:22vmin;border-radius:50%;background:#fff4d6;left:62%;top:20%}
.a .m1{position:absolute;left:-10%;bottom:0;width:70%;height:42%;background:#8a3d3a;clip-path:polygon(0 100%,35% 5%,70% 100%)}
.a .m2{position:absolute;left:30%;bottom:0;width:80%;height:34%;background:#5c2a35;clip-path:polygon(0 100%,45% 0,100% 100%)}

.b{background:linear-gradient(180deg,#0b3a5c 0%,#1b7a95 60%,#6fd0d0 100%)}
.b .moon{position:absolute;width:14vmin;height:14vmin;border-radius:50%;background:#e8fbff;left:18%;top:14%}
.b .city{position:absolute;left:0;right:0;bottom:0;height:46%;display:flex;align-items:flex-end;justify-content:space-around}
.b .city i{display:block;width:11%;background:#082033}
.b .city i:nth-child(1){height:60%}
.b .city i:nth-child(2){height:95%}
.b .city i:nth-child(3){height:45%}
.b .city i:nth-child(4){height:80%}
.b .city i:nth-child(5){height:65%}
.b .city i:nth-child(6){height:100%}

.tag{position:relative;z-index:2;font-size:12vmin;font-weight:800;color:#fff;letter-spacing:.02em;text-shadow:none}
.sub{position:relative;z-index:2;margin-top:2vmin;font-size:5vmin;font-weight:600;color:rgba(255,255,255,.92)}
.a .tag,.a .sub{color:#4a1f2a}

@keyframes cube{
  0%{transform:translateZ(-50vw) translateZ(0vw) rotateY(0deg);animation-timing-function:cubic-bezier(.55,0,.85,.6)}
  50%{transform:translateZ(-50vw) translateZ(-70vw) rotateY(-45deg);animation-timing-function:cubic-bezier(.15,.5,.35,1)}
  100%{transform:translateZ(-50vw) translateZ(0vw) rotateY(-90deg)}
}
</style>
<div class="stage">
  <div class="cube">
    <div class="face front a">
      <div class="sun"></div><div class="m1"></div><div class="m2"></div>
      <div class="tag">a.mp4</div>
      <div class="sub">앞 장면 · 전환 시점 1:20</div>
    </div>
    <div class="face right b">
      <div class="moon"></div>
      <div class="city"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="tag">b.mp4</div>
      <div class="sub">다음 장면 · 전환 길이 1초</div>
    </div>
    <div class="face left"></div>
    <div class="face back"></div>
  </div>
</div>
</html>
