<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F52 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#141a30;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,#27325c 0%,#171d38 55%,#0d1124 100%)}
.pos{position:relative;transform:translateY(-9vmin)}
.cam{display:grid;grid-template-columns:repeat(8,10vmin);grid-template-rows:repeat(5,8vmin);gap:1.2vmin;
  transform-origin:50% 50%;
  animation:pull 1.5s cubic-bezier(.65,0,.35,1) 0.5s 1 both}
@keyframes pull{
  from{transform:scale(8.5) translate(28vmin,10.3vmin)}
  to{transform:scale(1) translate(0,0)}
}
.c{box-sizing:border-box;position:relative;background:#fff;border-radius:1vmin;border:.4vmin solid transparent;
  box-shadow:0 .6vmin 1.4vmin rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7vmin}
.c::before{content:"";width:3.6vmin;height:2.5vmin;border-radius:.4vmin;background:
  linear-gradient(155deg,transparent 48%,#9aa5c4 49%,#9aa5c4 52%,transparent 53%) left/50% 100% no-repeat,
  linear-gradient(25deg,transparent 48%,#9aa5c4 49%,#9aa5c4 52%,transparent 53%) right/50% 100% no-repeat,
  #dfe5f5}
.c::after{content:"문의 메일 한 통";font-size:1.45vmin;font-weight:700;color:#1b2140;white-space:nowrap}
.c:not(:nth-child(10)){animation:dim .4s ease 2.5s 1 both}
@keyframes dim{from{opacity:1}to{opacity:.35}}
.c:nth-child(10){z-index:2;animation:hl 1.05s ease-in-out 1.85s 1 both}
@keyframes hl{
  0%{border-color:transparent;transform:scale(1)}
  22%{border-color:#ffb020;transform:scale(1)}
  62%{border-color:#ffb020;transform:scale(1)}
  71%{border-color:#ffb020;transform:scale(1.12)}
  86%,100%{border-color:#ffb020;transform:scale(1)}
}
.src{position:absolute;right:0;top:100%;margin-top:1vmin;font-size:2.2vmin;color:rgba(255,255,255,.7);white-space:nowrap;
  animation:in .4s ease-out 2.6s 1 both}
.chip{position:absolute;left:50%;top:100%;margin-top:6vmin;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:1vmin;padding:2.6vmin 6vmin;border-radius:3vmin;
  background:#141a30;border:.3vmin solid rgba(255,255,255,.18);box-shadow:0 1vmin 3vmin rgba(0,0,0,.5);white-space:nowrap;
  animation:pop .4s cubic-bezier(.3,1.5,.5,1) 2.6s 1 both}
.chip b{font-size:9vmin;line-height:1;color:#ffb020}
.chip span{font-size:4vmin;color:#fff}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;margin-top:9vmin}to{opacity:1;margin-top:6vmin}}
</style>
<div class="stage">
  <div class="pos">
    <div class="cam">
      <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
      <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
    </div>
    <div class="src">○○센터 9월 접수 기록</div>
    <div class="chip"><b>하루 40건</b><span>손으로 처리하던 양</span></div>
  </div>
</div>
</html>
