<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F43 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;
  background:linear-gradient(180deg,#2b4a6b 0%,#3d6a85 38%,#8aa08f 62%,#4a5a4a 100%);overflow:hidden}
.sun{position:absolute;left:68%;top:14%;width:16vmin;height:16vmin;border-radius:50%;background:radial-gradient(circle,#ffe9b0 0,#ffd27a 55%,rgba(255,210,122,0) 72%)}
.hill{position:absolute;bottom:0;left:-10%;width:120%;height:42%;background:linear-gradient(180deg,#3f5a45,#26382c);border-radius:50% 50% 0 0/30% 30% 0 0}
.hill.b{left:30%;width:90%;height:34%;background:linear-gradient(180deg,#355040,#22332a)}
.sub{position:absolute;left:50%;bottom:5vmin;transform:translateX(-50%);width:56%;height:5.2vmin;border-radius:1.2vmin;background:rgba(255,255,255,.18)}
.sub::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:1vmin;margin-top:-.5vmin;border-radius:1vmin;background:rgba(255,255,255,.35)}

.bar{position:absolute;left:50%;bottom:12.5vmin;width:92%;transform:translateX(-50%);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1.8vmin 1.4vmin;
  padding:3vmin 3vmin 5.2vmin;border-radius:4vmin;background:rgba(18,24,36,.72);
  box-shadow:0 1vmin 3vmin rgba(0,0,0,.35);
  animation:rise .3s 0s 1 both}
@keyframes rise{0%{opacity:0;transform:translateX(-50%) translateY(9vmin)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}

.head{font-size:3.8vmin;font-weight:800;color:#10202e;background:#ffc93c;padding:1.4vmin 2.4vmin;border-radius:3vmin;white-space:nowrap}
.it{display:inline-block;animation:pop .3s var(--d) 1 both}
@keyframes pop{0%{opacity:0;transform:translateY(2vmin) scale(.55)}60%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:1;transform:none}}
.arr{font-size:4.4vmin;font-weight:700;color:#a7adb5;animation:fade .25s var(--d) 1 both}
@keyframes fade{0%{opacity:0}100%{opacity:1}}

.chip{position:relative;display:inline-block;font-size:4.2vmin;font-weight:900;color:#111;background:#f6f1e4;
  padding:1.4vmin 2.8vmin;border-radius:2.2vmin;white-space:nowrap}
.chip::after{content:"";position:absolute;inset:-.7vmin;border:.7vmin solid #ffc93c;border-radius:2.8vmin;opacity:0}
.ck{position:absolute;right:-2vmin;top:-2.4vmin;width:4.4vmin;height:4.4vmin;border-radius:50%;background:#ffc93c;color:#10202e;
  font-style:normal;font-size:3vmin;font-weight:900;display:flex;align-items:center;justify-content:center;opacity:0}
@keyframes dim{0%{background:#f6f1e4;color:#111}100%{background:#8d8b84;color:#43423e}}
@keyframes ckpop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}

/* 칩1: 1.21초 테두리+커짐 → 1.6초 ✓ 후 테두리 이동 */
.k1{animation:f1 .49s 1.21s 1 both,dim .25s 1.6s 1 both}
.k1 .ck{animation:ckpop .25s 1.6s 1 both}
@keyframes f1{0%{transform:scale(1)}59%{transform:scale(1.1)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.k1::after{animation:b1 .49s 1.21s 1 both}
@keyframes b1{0%{opacity:0}59%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* 칩2·3: 앞 칩을 누르는 순간 테두리가 옮겨 옴 */
.k2{animation:f2 .6s 1.6s 1 both,dim .25s 2.1s 1 both}
.k2 .ck{animation:ckpop .25s 2.1s 1 both}
.k3{animation:f2 .6s 2.1s 1 both,dim .25s 2.6s 1 both}
.k3 .ck{animation:ckpop .25s 2.6s 1 both}
@keyframes f2{0%{transform:scale(1)}25%{transform:scale(1.08)}83%{transform:scale(1.08)}100%{transform:scale(1)}}
.k2::after{animation:b2 .6s 1.6s 1 both}
.k3::after{animation:b2 .6s 2.1s 1 both}
@keyframes b2{0%{opacity:0}25%{opacity:1}83%{opacity:1}100%{opacity:0}}

/* 칩4: 마지막으로 옮겨 가며 한 번 도드라지고 끝까지 머묾 */
.k4{animation:f4 .25s 2.6s 1 both}
@keyframes f4{0%{transform:scale(1)}50%{transform:scale(1.16)}100%{transform:scale(1.07)}}
.k4::after{animation:b4 .25s 2.6s 1 both}
@keyframes b4{0%{opacity:0}50%{opacity:1}100%{opacity:1}}

.note{position:absolute;right:3.6vmin;bottom:1.4vmin;font-size:2.6vmin;font-weight:600;color:#c9ced6;animation:fade .29s 1.21s 1 both}
</style>
<div class="stage">
  <div class="sun"></div><div class="hill"></div><div class="hill b"></div>
  <div class="sub"></div>
  <div class="bar">
    <span class="head">누르는 순서</span>
    <span class="it" style="--d:.35s"><b class="chip k1">설정<i class="ck">✓</i></b></span>
    <span class="arr" style="--d:.44s">›</span>
    <span class="it" style="--d:.53s"><b class="chip k2">개인정보<i class="ck">✓</i></b></span>
    <span class="arr" style="--d:.62s">›</span>
    <span class="it" style="--d:.71s"><b class="chip k3">대화 기록<i class="ck">✓</i></b></span>
    <span class="arr" style="--d:.8s">›</span>
    <span class="it" style="--d:.89s"><b class="chip k4">끄기</b></span>
    <span class="note">2026.10 기준</span>
  </div>
</div>
</html>
