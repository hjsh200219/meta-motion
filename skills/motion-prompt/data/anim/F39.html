<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F39 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#2b3a55 0%,#4a5f7e 45%,#1d2433 100%)}
.hint{position:absolute;top:2vmin;left:2vmin;font-size:2.4vmin;color:rgba(255,255,255,.45);letter-spacing:.1vmin}
.window{position:absolute;left:8%;top:12%;width:26%;height:30%;border-radius:1.5vmin;background:linear-gradient(135deg,#f3c98b,#c9825a);opacity:.35}
.person{position:absolute;left:50%;top:14%;width:0;height:0;transform:translateX(-50%)}
.head{position:absolute;left:-8vmin;top:0;width:16vmin;height:16vmin;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e8b996,#b9805f)}
.body{position:absolute;left:-18vmin;top:17vmin;width:36vmin;height:30vmin;border-radius:18vmin 18vmin 0 0;background:linear-gradient(180deg,#34507a,#22304a)}
.cap{position:absolute;left:0;right:0;bottom:9vmin;display:flex;flex-direction:column;align-items:center;gap:1.2vmin}
.row{display:flex;flex-direction:column;align-items:center;gap:.8vmin}
.chip{font-size:2.6vmin;font-weight:800;padding:.4vmin 1.6vmin;border-radius:5vmin;white-space:nowrap}
.chip.a{background:#8a9099;color:#fff}
.chip.b{background:#ffd23f;color:#2a2200}
.orig{font-size:3.4vmin;font-weight:500;color:#d4d8de;white-space:nowrap;
  -webkit-text-stroke:.6vmin rgba(15,20,30,.75);paint-order:stroke fill;text-shadow:0 .2vmin .8vmin rgba(0,0,0,.5)}
.arrow{font-size:3.4vmin;font-weight:900;color:#e5e8ec;line-height:1;text-shadow:0 0 .8vmin rgba(0,0,0,.6)}
.easy{font-size:5.4vmin;font-weight:900;color:#fff;white-space:nowrap;padding:.4vmin 1vmin;
  -webkit-text-stroke:1.3vmin #151a24;paint-order:stroke fill;text-shadow:0 .3vmin 1vmin rgba(0,0,0,.55)}
.key{position:relative;display:inline-block}
.key::after{content:"";position:absolute;left:0;right:0;bottom:-.5vmin;height:.9vmin;border-radius:1vmin;background:#ffd23f;transform-origin:left center}

.r1{animation:fade .2s 0s 1 both}
.ar{animation:fade .2s .2s 1 both}
.r2{animation:fade .4s .2s 1 both}
.easy{animation:wipe .4s .2s 1 both linear}
.key::after{animation:line .3s .6s 1 both ease-out}
.key{animation:pop .3s .9s 1 both ease-in-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes wipe{from{clip-path:inset(-20% 105% -20% -5%)}to{clip-path:inset(-20% -5% -20% -5%)}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1)}}
</style>
<div class="stage">
  <div class="hint">촬영 화면 예시</div>
  <div class="window"></div>
  <div class="person"><div class="head"></div><div class="body"></div></div>
  <div class="cap">
    <div class="row r1">
      <span class="chip a">원래 말</span>
      <span class="orig">API 키를 발급받으세요</span>
    </div>
    <div class="arrow ar">↓</div>
    <div class="row">
      <span class="chip b r2">쉬운 말</span>
      <span class="easy">프로그램 <span class="key">출입증 번호</span>를 받으세요</span>
    </div>
  </div>
</div>
</html>
