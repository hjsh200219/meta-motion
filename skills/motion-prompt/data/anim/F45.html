<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F45 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;
  background:linear-gradient(180deg,#5b8fc7 0%,#9cc3e0 45%,#e6d3b0 70%,#6b7f5a 100%)}
.hill{position:absolute;bottom:0;border-radius:50% 50% 0 0}
.h1{left:-15vmin;width:80vmin;height:34vmin;background:#4e6a47}
.h2{right:-20vmin;width:90vmin;height:28vmin;background:#3d5a3c}
.bld{position:absolute;bottom:20vmin;background:#46546b}
.b1{left:12vmin;width:12vmin;height:26vmin}
.b2{left:26vmin;width:9vmin;height:18vmin;background:#566680}
.b3{left:37vmin;width:14vmin;height:30vmin}
.tag{position:absolute;left:3vmin;bottom:3vmin;font-size:2.4vmin;color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.3);padding:.8vmin 1.6vmin;border-radius:1vmin}

.wrap{position:absolute;top:4vmin;right:4vmin}
.panel{display:flex;align-items:center;gap:3.5vmin;padding:2.2vmin 3.2vmin;border-radius:2vmin;
  background:rgba(12,18,32,.72);border:.5vmin solid transparent;box-sizing:border-box;
  animation:panelIn .3s ease-out 0s 1 both,frame .35s ease-out 2.45s 1 both}
@keyframes panelIn{0%{opacity:0;transform:translateX(30vmin)}100%{opacity:1;transform:translateX(0)}}
@keyframes frame{0%{border-color:transparent;box-shadow:0 0 0 rgba(255,204,51,0)}
  100%{border-color:#ffcc33;box-shadow:0 0 3vmin rgba(255,204,51,.55)}}

.left{display:flex;flex-direction:column;gap:1.6vmin}
.label{font-size:3.6vmin;font-weight:700;color:#fff;white-space:nowrap}
.cells{display:flex;gap:1.2vmin}
.cell{width:3vmin;height:3vmin;border-radius:.7vmin;background:#c9ccd2;opacity:.55}
.cell:first-child{background:#ffcc33;opacity:1}
.cell:nth-child(2){animation:fill .6s ease-out 1.1s 1 both}
.cell:nth-child(3){animation:fill .6s ease-out 1.9s 1 both}
@keyframes fill{0%{background:#c9ccd2;opacity:.55;transform:scale(1)}
  50%{transform:scale(1.35)}100%{background:#ffcc33;opacity:1;transform:scale(1)}}

.right{display:flex;align-items:flex-end;gap:1vmin}
.num{position:relative}
.win{height:10vmin;overflow:hidden}
.col{height:30vmin;animation:roll 1.4s linear 1.1s 1 both}
.col span{display:block;height:10vmin;line-height:10vmin;font-size:9.5vmin;font-weight:800;color:#ffcc33;text-align:center;min-width:6vmin}
@keyframes roll{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.3,1.4,.5,1)}
  42.86%{transform:translateY(-33.333%)}
  57.14%{transform:translateY(-33.333%);animation-timing-function:cubic-bezier(.3,1.4,.5,1)}
  100%{transform:translateY(-66.667%)}}
.unit{font-size:3.6vmin;font-weight:700;color:#fff;padding-bottom:1.2vmin;white-space:nowrap}

.plus{position:absolute;left:50%;top:-1vmin;margin-left:-3vmin;font-size:5vmin;font-weight:800;color:#ffcc33;opacity:0;
  text-shadow:0 .3vmin 1vmin rgba(0,0,0,.5)}
.p1{animation:plus .6s ease-out 1.1s 1 both}
.p2{animation:plus .6s ease-out 1.9s 1 both}
@keyframes plus{0%{opacity:0;transform:translateY(30%) scale(.6)}
  30%{opacity:1;transform:translateY(-70%) scale(1.25)}
  100%{opacity:0;transform:translateY(-150%) scale(1)}}

.pill{position:absolute;right:0;top:100%;margin-top:2vmin;white-space:nowrap;
  background:#ffcc33;color:#1a1a1a;font-size:3.8vmin;font-weight:800;padding:1.2vmin 2.8vmin;border-radius:5vmin;
  transform-origin:right top;animation:pill .35s cubic-bezier(.3,1.6,.5,1) 2.45s 1 both}
@keyframes pill{0%{opacity:0;transform:scale(.4) translateY(-2vmin)}100%{opacity:1;transform:scale(1) translateY(0)}}
</style>

<div class="stage">
  <div class="hill h1"></div><div class="hill h2"></div>
  <div class="bld b1"></div><div class="bld b2"></div><div class="bld b3"></div>
  <div class="tag">촬영 화면 예시</div>

  <div class="wrap">
    <div class="panel">
      <div class="left">
        <div class="label">다시 요청</div>
        <div class="cells"><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i></div>
      </div>
      <div class="right">
        <div class="num">
          <div class="plus p1">+1</div>
          <div class="plus p2">+1</div>
          <div class="win"><div class="col"><span>1</span><span>2</span><span>3</span></div></div>
        </div>
        <div class="unit">회째</div>
      </div>
    </div>
    <div class="pill">✓ 3번 만에 성공</div>
  </div>
</div>
</html>
