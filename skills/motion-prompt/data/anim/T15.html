<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T15 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1633}
.stage{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#0a1633}
.swell{position:absolute;inset:0;transform-origin:50% 50%;animation:swell 2s 0s 4 both ease-in-out}
.layer{position:absolute;inset:-30%;animation:drift 8s 0s 1 both ease-in-out}
.wave{background:repeating-linear-gradient(115deg,#0a1633 0,#12296b 5vmin,#2563d6 9.5vmin,#4a8cf0 11vmin,#2a5fc4 13vmin,#0f2257 16vmin)}
.crest{background:repeating-linear-gradient(115deg,transparent 0 9vmin,rgba(255,150,70,.5) 10.7vmin,transparent 12.8vmin 16vmin);
  animation:drift 8s 0s 1 both ease-in-out,crest 8s 0s 1 both linear}
.sparks{background:radial-gradient(circle,#ffe2bd 0 .3vw,transparent .42vw) 0 0/2vw 2vw;
  -webkit-mask-image:repeating-linear-gradient(115deg,transparent 0 9vmin,#000 10.7vmin,transparent 12.8vmin 16vmin);
  mask-image:repeating-linear-gradient(115deg,transparent 0 9vmin,#000 10.7vmin,transparent 12.8vmin 16vmin);
  animation:drift 8s 0s 1 both ease-in-out,spark 8s 0s 1 both linear}
.dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.26) 0 .22vw,transparent .27vw) 0 0/2vw 2vw}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 55% 40% at 50% 50%,rgba(6,14,38,.6),rgba(6,14,38,0) 100%)}
.title{position:relative;color:#fff;font-weight:900;font-size:11vmin;letter-spacing:.04em;white-space:nowrap;text-shadow:0 .6vmin 2vmin rgba(0,0,0,.35)}
@keyframes drift{
  0%{transform:translate(0,0)}
  25%{transform:translate(-12vmin,12vmin)}
  50%{transform:translate(0,24vmin)}
  75%{transform:translate(12vmin,12vmin)}
  100%{transform:translate(0,0)}}
@keyframes swell{0%,100%{transform:rotate(0) scale(1.06)}50%{transform:rotate(1.6deg) scale(1.06)}}
@keyframes crest{0%,50%{opacity:.5}62%{opacity:1}75%,100%{opacity:.5}}
@keyframes spark{0%{opacity:.35}12%{opacity:.7}25%{opacity:.35}37%{opacity:.65}50%{opacity:.35}62%{opacity:1}75%{opacity:.35}87%{opacity:.6}100%{opacity:.35}}
</style>
<div class="stage">
  <div class="swell">
    <div class="layer wave"></div>
    <div class="layer crest"></div>
    <div class="layer sparks"></div>
  </div>
  <div class="dots"></div>
  <div class="vig"></div>
  <div class="title">CHAPTER 03</div>
</div>
</html>
