<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F55 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#1b2240}
.video{position:absolute;inset:-10%;filter:blur(2vmin);background:
 radial-gradient(circle at 25% 30%,#e8a46a 0,transparent 35%),
 radial-gradient(circle at 75% 65%,#5d8fd6 0,transparent 40%),
 linear-gradient(160deg,#6a7fb8,#c98a77 60%,#3d4c78)}
.shade{position:absolute;inset:0;background:rgba(14,18,38,.78)}
.slot{position:absolute;left:50%;top:10vmin;width:0;height:0}
.card{position:absolute;left:-45vmin;top:0;width:90vmin;box-sizing:border-box;display:flex;gap:3vmin;align-items:flex-start;
 padding:3.4vmin;background:#fff;border-radius:5vmin;box-shadow:0 2vmin 5vmin rgba(0,0,0,.35);
 transform-origin:50% 0}
.c1{z-index:1}.c2{z-index:2}.c3{z-index:3}
.ic{flex:none;width:12vmin;height:12vmin;border-radius:3.2vmin;position:relative;overflow:hidden}
.mail{background:#ff6b3d}
.mail::before{content:"";position:absolute;left:2.4vmin;top:3.4vmin;width:7.2vmin;height:5.2vmin;background:#fff;border-radius:.8vmin}
.mail::after{content:"";position:absolute;left:3.6vmin;top:3.2vmin;width:4.8vmin;height:4.8vmin;border-right:.7vmin solid #ff6b3d;border-bottom:.7vmin solid #ff6b3d;transform:rotate(45deg) scale(.75);transform-origin:50% 50%;margin-top:-1.4vmin}
.cal{background:#ff6b3d}
.cal::before{content:"";position:absolute;left:2.4vmin;top:2.8vmin;width:7.2vmin;height:7.2vmin;background:#fff;border-radius:1vmin}
.cal::after{content:"";position:absolute;left:3.6vmin;top:5.2vmin;width:4.8vmin;height:.9vmin;background:#ff6b3d;box-shadow:0 1.6vmin 0 #ff6b3d}
.bell{background:#ff6b3d}
.bell::before{content:"";position:absolute;left:3.4vmin;top:2.6vmin;width:5.2vmin;height:5.4vmin;background:#fff;border-radius:2.6vmin 2.6vmin .8vmin .8vmin}
.bell::after{content:"";position:absolute;left:5vmin;top:8.6vmin;width:2vmin;height:1.4vmin;background:#fff;border-radius:0 0 1vmin 1vmin}
.tx{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;font-size:3.2vmin;color:#8a8f99;margin-bottom:.6vmin}
.ti{font-size:4.8vmin;font-weight:800;color:#15181f;margin-bottom:.6vmin}
.bd{font-size:3.8vmin;color:#4a4f5a;line-height:1.3}
.chip{position:absolute;left:4vmin;bottom:4vmin;padding:1.6vmin 3.2vmin;font-size:3.6vmin;font-weight:700;color:#fff;
 background:#2c3568;border:.3vmin solid rgba(255,255,255,.35);border-radius:5vmin;
 animation:chipIn .3s ease-out .3s 1 both}

.c1{animation:drop .42s linear 0s 1 both,push1 1s linear .6s 1 both}
.c2{animation:drop .42s linear .6s 1 both,push2 .4s ease-in-out 1.2s 1 both}
.c3{animation:drop .42s linear 1.2s 1 both}

@keyframes drop{
 0%{transform:translateY(-60vmin)}
 55%{transform:translateY(2.2vmin);animation-timing-function:ease-out}
 80%{transform:translateY(-.6vmin)}
 100%{transform:translateY(0)}}
@keyframes push1{
 0%{translate:0 0;scale:1;opacity:1}
 40%{translate:0 9vmin;scale:.94;opacity:.7}
 60%{translate:0 9vmin;scale:.94;opacity:.7}
 100%{translate:0 18vmin;scale:.88;opacity:.45}}
@keyframes push2{
 0%{translate:0 0;scale:1;opacity:1}
 100%{translate:0 9vmin;scale:.94;opacity:.7}}
@keyframes chipIn{
 0%{opacity:0;transform:translateY(3vmin)}
 100%{opacity:1;transform:translateY(0)}}
</style>
<div class="stage">
 <div class="video"></div>
 <div class="shade"></div>
 <div class="slot">
  <div class="card c1"><div class="ic mail"></div><div class="tx"><div class="top"><span>메일 분류</span><span>지금</span></div><div class="ti">급함 3건 도착</div><div class="bd">답장이 필요한 메일만 골라 두었어요</div></div></div>
  <div class="card c2"><div class="ic cal"></div><div class="tx"><div class="top"><span>일정</span><span>지금</span></div><div class="ti">내일 10시 강의</div><div class="bd">준비물 확인: 노트북·충전기·자료 20부</div></div></div>
  <div class="card c3"><div class="ic bell"></div><div class="tx"><div class="top"><span>실습 알림</span><span>지금</span></div><div class="ti">첫 자동 발송 성공!</div><div class="bd">안내 문자가 예약한 시각에 나갔어요</div></div></div>
 </div>
 <div class="chip">재구성 화면</div>
</div>
</html>
