<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F66 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#6f8fb5 0%,#a9bfd3 45%,#d9d2c3 100%)}
.shot{position:absolute;inset:0}
.wall{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,#8d7f6e,#5d5347)}
.person{position:absolute;left:50%;bottom:0;width:30vmin;height:48vmin;transform:translateX(-50%)}
.person i{position:absolute;left:50%;top:0;width:15vmin;height:15vmin;margin-left:-7.5vmin;border-radius:50%;background:#e2b99a}
.person b{position:absolute;left:0;right:0;bottom:0;height:30vmin;border-radius:14vmin 14vmin 0 0;background:#2f3b52}
.sub{position:absolute;left:50%;bottom:4vmin;transform:translateX(-50%);width:60%;height:5vmin;border-radius:1.2vmin;background:rgba(0,0,0,.45)}

.band{position:absolute;top:3vmin;left:50%;width:94vw;max-width:none;box-sizing:border-box;margin-left:-47vw;
  display:flex;align-items:center;gap:2.5vmin;padding:2vmin 3vmin;background:rgba(255,255,255,.96);
  border-radius:2.4vmin;box-shadow:0 1.2vmin 3.5vmin rgba(0,0,0,.3);
  animation:drop .3s ease-out 0s 1 both}
@keyframes drop{from{transform:translateY(-6vmin);opacity:0}to{transform:translateY(0);opacity:1}}

.qc{flex:none;width:11vmin;height:11vmin;border-radius:50%;background:#ff5a36;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:7vmin;
  animation:pop .3s ease-out .3s 1 both}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.28);opacity:1}100%{transform:scale(1);opacity:1}}

.q{flex:1;min-width:0;font-weight:900;font-size:5vmin;line-height:1.25;color:#1f2a44;word-break:keep-all;
  max-height:2.5em;overflow:hidden;
  animation:txt .5s ease-out .6s 1 both}
.q em{font-style:normal;color:#ff5a36;margin-right:1.2vmin}
@keyframes txt{from{transform:translateX(-3vmin);opacity:0}to{transform:translateX(0);opacity:1}}

.chip{flex:none;background:#1f2a44;color:#fff;font-weight:700;font-size:3.4vmin;padding:1.4vmin 3vmin;border-radius:5vmin;white-space:nowrap;
  animation:chip .3s ease-out .8s 1 both}
@keyframes chip{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.a{position:absolute;left:4vmin;bottom:13vmin;width:9vmin;height:9vmin;border-radius:1.6vmin;background:#1f2a44;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:6vmin;box-shadow:0 .8vmin 2vmin rgba(0,0,0,.3);
  animation:apop .3s ease-out 1.6s 1 both}
@keyframes apop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
</style>
<div class="stage">
  <div class="shot"><div class="wall"></div><div class="person"><i></i><b></b></div><div class="sub"></div></div>
  <div class="band">
    <div class="qc">Q</div>
    <div class="q"><em>Q3</em>무료 버전으로도 이 실습이 되나요?</div>
    <div class="chip">수강생 질문</div>
  </div>
  <div class="a">A</div>
</div>
</html>
