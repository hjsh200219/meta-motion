<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F27 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#2b3a4a 0%,#4a5d70 45%,#7a6a5a 100%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,#3a3430,#1f1b19)}
.shelf{position:absolute;right:0;top:12%;width:34%;height:40%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 2%,transparent 2% 22%);opacity:.8}
.person{position:absolute;right:14%;bottom:0;width:30vmin;height:62vmin}
.head{position:absolute;left:50%;top:0;width:15vmin;height:18vmin;margin-left:-7.5vmin;border-radius:50%;background:linear-gradient(180deg,#d9b49a,#b98e74)}
.body{position:absolute;left:0;right:0;top:19vmin;bottom:0;border-radius:15vmin 15vmin 0 0;background:linear-gradient(180deg,#1f2a36,#121820)}
.tag{position:absolute;left:3vmin;bottom:3vmin;font-size:3vmin;color:rgba(255,255,255,.45)}
.win{position:absolute;left:4vmin;top:4vmin;width:max(30vw,48vmin);border-radius:1.6vmin;overflow:hidden;box-shadow:0 2.4vmin 5vmin rgba(0,0,0,.6),0 0.6vmin 1.4vmin rgba(0,0,0,.4);transform:translateX(-130%);animation:slide .55s cubic-bezier(.2,.8,.25,1) .1s 1 both}
.photo{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:1.6vmin 1.6vmin 0 0;background:linear-gradient(180deg,#9fc3df 0%,#d9e6ee 45%,#b89870 46%,#8a6a48 100%);animation:flash .5s ease-in-out .65s 1 both}
.box{position:absolute;bottom:12%;background:linear-gradient(135deg,#d2a36a,#a97a45);border:.3vmin solid rgba(70,45,20,.5);box-sizing:border-box}
.b1{left:10%;width:30%;height:34%}
.b2{left:42%;width:24%;height:26%}
.b3{left:68%;width:22%;height:40%}
.b4{left:18%;bottom:46%;width:20%;height:20%}
.box::after{content:"";position:absolute;left:0;right:0;top:44%;height:12%;background:rgba(255,255,255,.35)}
.band{position:relative;display:flex;align-items:center;padding:2.2vmin 3vmin 2.2vmin 4vmin;background:#1d2733;border-radius:0 0 1.6vmin 1.6vmin}
.band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1vmin;background:#ffb020}
.band span{color:#fff;font-weight:900;font-size:4.4vmin;line-height:1.2;white-space:nowrap}
@keyframes slide{from{transform:translateX(-130%)}to{transform:translateX(0)}}
@keyframes flash{0%{filter:brightness(1)}50%{filter:brightness(1.22)}100%{filter:brightness(1)}}
</style>
<div class="stage">
  <div class="shelf"></div>
  <div class="floor"></div>
  <div class="person"><div class="head"></div><div class="body"></div></div>
  <div class="tag">촬영 화면 예시</div>
  <div class="win">
    <div class="photo">
      <div class="box b1"></div><div class="box b2"></div><div class="box b3"></div><div class="box b4"></div>
    </div>
    <div class="band"><span>택배 묶음 출고</span></div>
  </div>
</div>
</html>
