<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F06 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;background:linear-gradient(160deg,#27405e 0%,#3f6b86 45%,#d79a6a 100%);overflow:hidden}
.person{position:absolute;left:10vmin;bottom:-8vmin;width:34vmin;height:62vmin;display:flex;flex-direction:column;align-items:center}
.head{width:20vmin;height:24vmin;border-radius:50%;background:#e2b896;opacity:.55}
.body{margin-top:2vmin;width:34vmin;height:40vmin;border-radius:17vmin 17vmin 0 0;background:#1d2b3d;opacity:.6}
.card{position:absolute;top:6vmin;right:6vmin;width:max(33vw,66vmin);max-width:88vw;box-sizing:border-box;background:#fff;border-radius:3vmin;box-shadow:0 3vmin 8vmin rgba(0,0,0,.45);overflow:hidden;opacity:0;animation:rise .55s cubic-bezier(.3,.7,.3,1) .1s 1 both}
@keyframes rise{0%{opacity:0;transform:translateY(45vmin)}60%{opacity:1;transform:translateY(-2.2vmin)}100%{opacity:1;transform:translateY(0)}}
.pic{position:relative;height:22vmin;background:linear-gradient(180deg,#8fd0f0 0%,#d9f0fa 60%,#f4d9a0 100%);overflow:hidden}
.sun{position:absolute;right:8%;top:14%;width:6vmin;height:6vmin;border-radius:50%;background:#ffd45c}
.m1,.m2{position:absolute;bottom:0;width:0;height:0;border-style:solid;border-color:transparent}
.m1{left:-4%;border-width:0 18vmin 14vmin 18vmin;border-bottom-color:#4f7a8f}
.m2{left:28%;border-width:0 20vmin 10vmin 20vmin;border-bottom-color:#2f5568}
.tag{position:absolute;left:2vmin;top:2vmin;padding:.7vmin 2vmin;border-radius:5vmin;background:#1f2f4a;color:#fff;font-size:3vmin;font-weight:800}
.body-txt{padding:2.4vmin 3vmin 3vmin}
.term{font-size:13vmin;font-weight:900;line-height:1.05;color:#111;letter-spacing:-.02em}
.mean{margin-top:1.4vmin;font-size:4.4vmin;font-weight:800;line-height:1.4;color:#111}
.mean span{background-image:linear-gradient(#ffd23f,#ffd23f);background-repeat:no-repeat;background-position:0 100%;background-size:0% 50%;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:paint .5s linear 1.1s 1 both}
@keyframes paint{from{background-size:0% 50%}to{background-size:100% 50%}}
.note{margin-top:1.8vmin;font-size:3.4vmin;color:#888;font-weight:500;opacity:0;animation:note .4s ease-out 1.5s 1 both}
@keyframes note{from{opacity:0;transform:translateY(1.5vmin)}to{opacity:1;transform:translateY(0)}}
</style>
<div class="stage">
  <div class="person"><div class="head"></div><div class="body"></div></div>
  <div class="card">
    <div class="pic"><div class="sun"></div><div class="m1"></div><div class="m2"></div><div class="tag">용어</div></div>
    <div class="body-txt">
      <div class="term">API</div>
      <div class="mean"><span>= 프로그램끼리 주고받는 창구</span></div>
      <div class="note">식당으로 치면 주문서</div>
    </div>
  </div>
</div>
</html>
