<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F03 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 40%,#16243b 0%,#0b1322 70%);font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff}
.stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7vmin}
.row{position:relative;display:flex;gap:8vmin}
.photo{position:relative;width:42vmin;height:46vmin;border-radius:3vmin;overflow:hidden;box-shadow:0 2vmin 5vmin rgba(0,0,0,.45);background:linear-gradient(180deg,#7fb6e6 0%,#cfe6f5 45%,#d9c9a8 45.5%,#b99d73 100%)}
.scene{position:absolute;inset:0}
.before .scene{filter:saturate(.5) brightness(.92)}
.wall{position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,#8fbde4,#d4e8f6)}
.win{position:absolute;top:8%;left:12%;width:22%;height:18%;border-radius:1vmin;background:linear-gradient(135deg,#fff7d6,#ffd27a)}
.win.w2{left:66%}
.floor{position:absolute;left:0;right:0;bottom:0;height:54%;background:linear-gradient(180deg,#c9ad82,#a98a5d)}
.bx{position:absolute;width:20%;height:17%;border-radius:.6vmin;background:linear-gradient(135deg,#e0a35a,#b9763a);box-shadow:inset 0 0 0 .4vmin rgba(90,50,15,.35),0 .8vmin 1vmin rgba(0,0,0,.25)}
.bx::after{content:"";position:absolute;left:0;right:0;top:42%;height:16%;background:rgba(255,235,190,.7)}
.before .bx:nth-child(4){left:8%;top:56%;transform:rotate(-12deg)}
.before .bx:nth-child(5){left:42%;top:66%;transform:rotate(9deg);width:24%}
.before .bx:nth-child(6){left:70%;top:54%;transform:rotate(-5deg)}
.before .bx:nth-child(7){left:22%;top:78%;transform:rotate(16deg);width:17%}
.before .bx:nth-child(8){left:60%;top:82%;transform:rotate(-18deg)}
.belt{position:absolute;left:0;right:0;top:66%;height:9%;background:linear-gradient(180deg,#4a5566,#2b3442)}
.after .bx{top:55.5%;width:18%;height:20%}
.after .bx:nth-child(5){left:6%}
.after .bx:nth-child(6){left:28%}
.after .bx:nth-child(7){left:50%}
.after .bx:nth-child(8){left:72%}
.after .bx:nth-child(4){left:50%;top:34%;width:14%;height:14%;opacity:0}
.tag{position:absolute;left:2vmin;top:2vmin;max-width:80%;padding:1.1vmin 2vmin;border-radius:1.2vmin;font-size:3.2vmin;font-weight:800;line-height:1.25}
.t-before{background:#0e1726;color:#e8eefb;border:.3vmin solid rgba(255,255,255,.28)}
.t-after{background:#ffb703;color:#1a1200;box-shadow:0 1vmin 2.4vmin rgba(255,183,3,.5)}
.line{position:absolute;left:50%;top:-3vmin;bottom:-3vmin;width:1vmin;margin-left:-.5vmin;border-radius:1vmin;background:#ffb703;box-shadow:0 0 2.4vmin rgba(255,183,3,.7);transform-origin:50% 0}
.cap{font-size:5.6vmin;font-weight:900;color:#fff;text-align:center;letter-spacing:-.02em;white-space:nowrap}

.before{animation:inL .55s cubic-bezier(.2,.8,.25,1) .1s 1 both}
.after{animation:inR .55s cubic-bezier(.2,.8,.25,1) .5s 1 both}
.t-before{animation:tagIn .55s ease-out .5s 1 both}
.line{animation:grow .4s ease-in-out .9s 1 both}
.t-after{animation:pop .4s cubic-bezier(.3,1.5,.5,1) .9s 1 both}
.cap{animation:up .5s cubic-bezier(.2,.8,.25,1) 1.4s 1 both}

@keyframes inL{from{opacity:0;transform:translateX(-24vmin)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(24vmin)}to{opacity:1;transform:none}}
@keyframes tagIn{from{opacity:0;transform:translateY(-1.5vmin)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:translateY(2vmin) scale(.6)}55%{opacity:1;transform:translateY(-1.6vmin) scale(1.15)}100%{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(7vmin)}to{opacity:1;transform:none}}
</style>
<div class="stage">
  <div class="row">
    <div class="photo before">
      <div class="scene"><div class="wall"></div><div class="win"></div><div class="win w2"></div><div class="floor"></div>
        <span class="bx"></span><span class="bx"></span><span class="bx"></span><span class="bx"></span><span class="bx"></span></div>
      <div class="tag t-before">이전 · 손으로 하나씩 포장</div>
    </div>
    <div class="photo after">
      <div class="scene"><div class="wall"></div><div class="win"></div><div class="win w2"></div><div class="floor"></div><div class="belt"></div>
        <span class="bx"></span><span class="bx"></span><span class="bx"></span><span class="bx"></span><span class="bx"></span></div>
      <div class="tag t-after">이후 · 순서대로 묶음 출고</div>
    </div>
    <div class="line"></div>
  </div>
  <div class="cap">같은 일, 순서만 바꿨습니다</div>
</div>
</html>
