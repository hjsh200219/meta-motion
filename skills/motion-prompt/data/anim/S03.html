<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 S03 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
@property --n{syntax:"<integer>";inherits:false;initial-value:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{--u:min(1.45vmin,1vw);position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7u;gap:calc(var(--u)*6);background:linear-gradient(160deg,#0A1233 0%,#16296B 55%,#1E3A8A 100%)}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(96,140,255,.25),transparent 60%)}
h1{position:relative;margin:0;font-size:calc(var(--u)*8);color:#fff;letter-spacing:-.02em;animation:title .4s ease-out 0s 1 both}
@keyframes title{from{opacity:0;transform:translateY(calc(var(--u)*-4))}to{opacity:1;transform:none}}
.row{position:relative;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3.5)}
.col{--c:0;position:relative;width:calc(var(--u)*29);animation:rise .63s cubic-bezier(.2,.9,.3,1.15) calc(.15s + var(--c)*.16s) 1 both}
.col:nth-child(2){--c:1}.col:nth-child(3){--c:2}
.col.mid{animation-name:riseMid;z-index:2}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*16))}to{opacity:1;transform:none}}
@keyframes riseMid{from{opacity:0;transform:translateY(calc(var(--u)*16)) scale(1)}to{opacity:1;transform:translateY(calc(var(--u)*-2)) scale(1.08)}}
.pop{animation:bounce .35s ease-out 2.2s 1 both}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.12)}70%{transform:scale(.98)}100%{transform:scale(1)}}
.card{position:relative;box-sizing:border-box;padding:calc(var(--u)*3) calc(var(--u)*2.4);border-radius:calc(var(--u)*3);background:#1E3FA0;color:#fff;box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*4) rgba(0,0,0,.35);text-align:center}
.mid .card{background:#fff;color:#0F1B4D;animation:beat 2.2s ease-in-out 2.3s 1 both}
@keyframes beat{0%,25%,50%,75%,100%{transform:scale(1)}12%,62%{transform:scale(1.04)}37%,87%{transform:scale(1.035)}}
.ring{position:absolute;inset:calc(var(--u)*-.8);border:calc(var(--u)*.6) solid #FACC15;border-radius:calc(var(--u)*3.8);pointer-events:none;opacity:0;animation:flash .35s ease-out 2.2s 1 both,breathe 1.1s ease-in-out 2.3s 2 both}
@keyframes flash{0%{opacity:0;box-shadow:0 0 0 rgba(250,204,21,0)}40%{opacity:1;box-shadow:0 0 calc(var(--u)*8) calc(var(--u)*2) rgba(250,204,21,.9)}100%{opacity:1;box-shadow:0 0 calc(var(--u)*3) rgba(250,204,21,.6)}}
@keyframes breathe{0%,100%{border-width:calc(var(--u)*.4)}50%{border-width:calc(var(--u)*1.2)}}
.badgewrap{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;transform:translateY(-50%);z-index:3}
.badge{background:#E8442E;color:#fff;font-weight:800;font-size:calc(var(--u)*3.4);padding:calc(var(--u)*.8) calc(var(--u)*2.6);border-radius:calc(var(--u)*5);white-space:nowrap;animation:badge .35s cubic-bezier(.3,1.6,.5,1) 2.2s 1 both}
@keyframes badge{from{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.25)}to{opacity:1;transform:scale(1)}}
.name{font-size:calc(var(--u)*4.4);font-weight:700;margin-top:calc(var(--u)*1)}
.price{display:flex;align-items:baseline;justify-content:center;gap:calc(var(--u)*.6);margin-top:calc(var(--u)*1);font-weight:800;line-height:1.1}
.price b{font-size:calc(var(--u)*10);font-weight:800;counter-reset:n var(--n);min-width:1ch}
.price b:after{content:counter(n)}
.price i{font-style:normal;font-size:calc(var(--u)*3.6)}
.mid .price{color:#1D4ED8}
.col:nth-child(1) b{animation:n3 1.5s linear .7s 1 both}
.col:nth-child(2) b{animation:n5 1.4s linear .8s 1 both}
.col:nth-child(3) b{animation:n8 1.3s linear .9s 1 both}
@keyframes n3{from{--n:0}to{--n:3}}
@keyframes n5{from{--n:0}to{--n:5}}
@keyframes n8{from{--n:0}to{--n:8}}
.per{font-size:calc(var(--u)*3);opacity:.7;margin-bottom:calc(var(--u)*2)}
ul{list-style:none;margin:0;padding:calc(var(--u)*2) 0 0;border-top:calc(var(--u)*.3) solid rgba(255,255,255,.2);display:flex;flex-direction:column;gap:calc(var(--u)*1.4);text-align:left}
.mid ul{border-top-color:rgba(15,27,77,.15)}
li{display:flex;align-items:center;gap:calc(var(--u)*1.1);font-size:calc(var(--u)*3.4);white-space:nowrap}
li:nth-child(2){--r:1}li:nth-child(3){--r:2}li:nth-child(1){--r:0}
li s{opacity:.5}
.ic{flex:none;width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.8);font-weight:800;line-height:1;animation:tick .45s cubic-bezier(.3,1.6,.5,1) calc(1.35s + var(--c,0)*.1s + var(--r)*.2s) 1 both}
.col:nth-child(2) li{--c:1}.col:nth-child(3) li{--c:2}
.ok{background:#22C55E;color:#fff}
.no{background:rgba(150,160,185,.35);color:#9AA3B8}
@keyframes tick{from{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.3)}to{opacity:1;transform:scale(1)}}
</style>
<div class="stage">
  <h1>수강료 안내</h1>
  <div class="row">
    <div class="col"><div class="pop"><div class="card">
      <div class="name">기본</div>
      <div class="price"><b></b><i>만 원</i></div>
      <div class="per">월</div>
      <ul>
        <li><span class="ic ok">✓</span>주 2회 수업</li>
        <li><span class="ic no">–</span><s>개인 상담</s></li>
        <li><span class="ic no">–</span><s>1:1 코칭</s></li>
      </ul>
    </div></div></div>
    <div class="col mid"><div class="pop"><div class="card">
      <div class="ring"></div>
      <div class="badgewrap"><div class="badge">★ 추천</div></div>
      <div class="name">표준</div>
      <div class="price"><b></b><i>만 원</i></div>
      <div class="per">월</div>
      <ul>
        <li><span class="ic ok">✓</span>주 3회 수업</li>
        <li><span class="ic ok">✓</span>개인 상담</li>
        <li><span class="ic no">–</span><s>1:1 코칭</s></li>
      </ul>
    </div></div></div>
    <div class="col"><div class="pop"><div class="card">
      <div class="name">프리미엄</div>
      <div class="price"><b></b><i>만 원</i></div>
      <div class="per">월</div>
      <ul>
        <li><span class="ic ok">✓</span>매일 수업</li>
        <li><span class="ic ok">✓</span>개인 상담</li>
        <li><span class="ic ok">✓</span>1:1 코칭</li>
      </ul>
    </div></div></div>
  </div>
</div>
</html>
