<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F10 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#3b4a6b 0%,#6b5b7b 45%,#c98f7a 100%)}
.shot-tag{position:absolute;left:3vmin;bottom:3vmin;font-size:2.4vmin;color:rgba(255,255,255,.55);letter-spacing:.2vmin}
.person{position:absolute;left:12vw;bottom:0;width:30vmin;height:62vmin;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.head{width:16vmin;height:19vmin;border-radius:50%;background:#e8c4a8;box-shadow:inset -2vmin -2vmin 4vmin rgba(120,70,50,.35);position:relative}
.head::before{content:"";position:absolute;left:-1vmin;top:-2vmin;width:18vmin;height:11vmin;border-radius:9vmin 9vmin 3vmin 3vmin;background:#3a2a26}
.body{width:30vmin;height:38vmin;margin-top:1.5vmin;border-radius:14vmin 14vmin 0 0;background:linear-gradient(180deg,#2f3c5a,#1f2a44)}
.slide{position:absolute;top:7vmin;right:5vmin;width:max(34vw,56vmin);animation:slideIn .5s cubic-bezier(.2,.8,.25,1) .1s 1 both}
.card{background:#fff;border-radius:3vmin;padding:4vmin 4vmin 3.4vmin;box-shadow:0 2.4vmin 6vmin rgba(0,0,0,.35);transform-origin:50% 50%;animation:pulse .35s ease-in-out 1.9s 1 both}
h1{margin:0;font-size:5.4vmin;font-weight:900;color:#1b2233;letter-spacing:-.1vmin}
.bar{width:12vmin;height:1vmin;border-radius:.5vmin;background:#ff6b35;margin:1.6vmin 0 3vmin}
.row{display:flex;align-items:center;gap:2.4vmin;margin-top:2.2vmin;font-size:4vmin;font-weight:800;color:#1b2233}
.row:first-of-type{margin-top:0}
.bx{position:relative;flex:none;width:6vmin;height:6vmin;box-sizing:border-box;border:.5vmin solid #d3d8e2;border-radius:1.4vmin;background:#fff}
.bx::after{content:"";position:absolute;left:1.7vmin;top:.4vmin;width:1.7vmin;height:3.4vmin;border:solid #22b35a;border-width:0 .9vmin .9vmin 0;transform:rotate(45deg) scale(.2);opacity:0;animation:tick .35s ease-out 1 both}
.row:nth-of-type(1) .bx::after{animation-delay:.7s}
.row:nth-of-type(2) .bx::after{animation-delay:1.1s}
.row:nth-of-type(3) .bx::after{animation-delay:1.5s}
.row:nth-of-type(4) .bx::after{animation-delay:1.9s}
@keyframes slideIn{from{transform:translateX(60vw);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes tick{0%{transform:rotate(45deg) scale(.2);opacity:0}60%{transform:rotate(45deg) scale(1.4);opacity:1}100%{transform:rotate(45deg) scale(1);opacity:1}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
</style>
<div class="stage">
  <div class="person"><div class="head"></div><div class="body"></div></div>
  <div class="shot-tag">촬영 화면 예시</div>
  <div class="slide">
    <div class="card">
      <h1>보내기 전 확인</h1>
      <div class="bar"></div>
      <div class="row"><span class="bx"></span>받는 사람 이름</div>
      <div class="row"><span class="bx"></span>날짜·시간</div>
      <div class="row"><span class="bx"></span>금액 숫자</div>
      <div class="row"><span class="bx"></span>첨부 파일</div>
    </div>
  </div>
</div>
</html>
