<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 S07 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#0F172A;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;background:#0F172A;overflow:hidden}
.photo{position:absolute;left:0;top:0;width:60%;height:100%;overflow:hidden}
.photo::after{content:"";position:absolute;inset:0;z-index:5;background:linear-gradient(90deg,rgba(15,23,42,0) 45%,rgba(15,23,42,.75) 100%)}
.slide{position:absolute;inset:0;transform-origin:50% 50%}
.s1{background:
 linear-gradient(180deg,rgba(255,255,255,.0) 60%,rgba(80,50,20,.35) 100%),
 radial-gradient(circle at 28% 30%,#fff7da 0 9%,rgba(255,240,190,0) 22%),
 linear-gradient(90deg,#e9d3ad 0 18%,#bfe1f2 18% 46%,#e9d3ad 46% 50%,#d9b888 50% 100%);
 animation:z 2.4s linear 0s 1 both}
.s2{background:
 linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(20,40,70,.4) 100%),
 radial-gradient(ellipse at 70% 35%,#fff 0 6%,rgba(255,255,255,0) 28%),
 linear-gradient(110deg,#9db7d1 0 40%,#cfdbe8 40% 62%,#7f98b4 62% 100%);
 opacity:0;animation:fade .4s linear 2s 1 both,z 2.4s linear 2s 1 both}
.s3{background:
 linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(20,60,40,.4) 100%),
 radial-gradient(circle at 35% 30%,#fffbe0 0 8%,rgba(255,255,200,0) 25%),
 linear-gradient(80deg,#a9cfa0 0 30%,#e8efd8 30% 58%,#78a276 58% 100%);
 opacity:0;animation:fade .4s linear 4s 1 both,z 1.4s linear 4s 1 both}
.slide::before{content:"";position:absolute;left:16%;right:34%;top:46%;height:20%;background:rgba(255,255,255,.35);border-radius:1vmin}
@keyframes z{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dots{position:absolute;left:4%;bottom:5%;z-index:8;display:flex;gap:1.2vmin;align-items:center}
.dot{height:1.2vmin;width:1.2vmin;border-radius:1vmin;background:rgba(255,255,255,.55)}
.d1{width:4vmin;background:#fff;animation:d1 .4s linear 2s 1 both}
.d2{animation:d2 2.4s linear 2s 1 both}
.d3{animation:d3 .4s linear 4s 1 both}
@keyframes d1{from{width:4vmin;background:#fff}to{width:1.2vmin;background:rgba(255,255,255,.55)}}
@keyframes d2{0%{width:1.2vmin;background:rgba(255,255,255,.55)}16.6%{width:4vmin;background:#fff}83.3%{width:4vmin;background:#fff}100%{width:1.2vmin;background:rgba(255,255,255,.55)}}
@keyframes d3{from{width:1.2vmin;background:rgba(255,255,255,.55)}to{width:4vmin;background:#fff}}
.cardwrap{position:absolute;left:57%;right:3%;top:6%;bottom:6%;z-index:10;animation:slidein .9s cubic-bezier(.2,.8,.2,1) 0s 1 both}
@keyframes slidein{from{transform:translateX(130%)}to{transform:translateX(0)}}
.card{width:100%;height:100%;box-sizing:border-box;background:#fff;border-radius:3vmin;box-shadow:0 3vmin 9vmin rgba(0,0,0,.65);padding:3.5vmin;display:flex;flex-direction:column;justify-content:center;gap:2.4vmin;color:#111827}
.row{opacity:0;animation:rise .5s ease-out 1 both}
.r1{animation-delay:.6s}.r2{animation-delay:.7s}.r3{animation-delay:.8s}.r4{animation-delay:.9s}.r5{animation-delay:1s}
@keyframes rise{from{opacity:0;transform:translateY(3vmin)}to{opacity:1;transform:translateY(0)}}
.chip{align-self:flex-start;background:#2563EB;color:#fff;font-weight:800;font-size:3.4vmin;padding:.8vmin 2.4vmin;border-radius:5vmin}
.title{font-weight:900;font-size:4.4vmin;line-height:1.2;color:#111827;white-space:nowrap}
.stats{display:flex;gap:1.5vmin}
.stat{flex:1;text-align:center;background:#F1F5F9;border-radius:1.6vmin;padding:1.4vmin 0;font-weight:800;font-size:3.6vmin;color:#111827;white-space:nowrap}
.price{font-weight:900;font-size:7vmin;color:#E8442E;line-height:1}
.map{position:relative;height:17vmin;border-radius:2vmin;overflow:hidden;
 background:
 linear-gradient(90deg,transparent 0 30%,#fff 30% 34%,transparent 34% 100%),
 linear-gradient(0deg,transparent 0 55%,#fff 55% 60%,transparent 60% 100%),
 linear-gradient(35deg,transparent 0 48%,#f7e3a1 48% 52%,transparent 52% 100%),
 radial-gradient(circle at 85% 20%,#bfe3b4 0 16%,transparent 17%),
 #dfe9ef}
.label{position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.82);color:#fff;font-weight:800;font-size:3.2vmin;padding:.8vmin 2vmin;white-space:nowrap}
.pinpos{position:absolute;left:58%;top:50%;width:0;height:0}
.pin{position:absolute;left:-1.6vmin;bottom:0;width:3.2vmin;height:5vmin;transform-origin:50% 100%;opacity:0;animation:drop .65s linear 1.35s 1 both}
.pin i{position:absolute;left:0;top:0;width:3.2vmin;height:3.2vmin;background:#E8442E;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 0 .6vmin rgba(255,255,255,.9)}
.pin i::after{content:"";position:absolute;left:30%;top:30%;width:40%;height:40%;background:#fff;border-radius:50%}
.ring{position:absolute;left:-3vmin;top:-1.5vmin;width:6vmin;height:3vmin;border-radius:50%;background:rgba(232,68,46,.55);box-shadow:0 0 3vmin 1vmin rgba(232,68,46,.8);opacity:0;animation:glow .28s ease-out 1.72s 1 both}
@keyframes drop{
 0%{opacity:0;transform:translateY(-16vmin) scale(1,1)}
 6%{opacity:1;transform:translateY(-15vmin) scale(1,1)}
 30%{opacity:1;transform:translateY(0) scale(1.25,.7)}
 42%{opacity:1;transform:translateY(0) scale(1,1)}
 52%{opacity:1;transform:translateY(-9vmin) scale(.95,1.08)}
 60%{opacity:1;transform:translateY(0) scale(1.4,.5)}
 100%{opacity:1;transform:translateY(0) scale(1,1)}}
@keyframes glow{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}
@media (min-aspect-ratio:3/2){
 .title{font-size:5.4vmin}.chip{font-size:3.8vmin}.stat{font-size:4.2vmin}.label{font-size:3.8vmin}.price{font-size:8.5vmin}.map{height:20vmin}
}
@media (max-aspect-ratio:9/10){
 .photo{width:100%;height:54%}
 .photo::after{background:linear-gradient(180deg,rgba(15,23,42,0) 50%,rgba(15,23,42,.75) 100%)}
 .cardwrap{left:5%;right:5%;top:48%;bottom:4%}
 .title{font-size:6.4vmin}.chip{font-size:4.2vmin}.stat{font-size:5vmin}.price{font-size:10vmin}.map{height:24vmin}.label{font-size:4.4vmin}
 .card{padding:5vmin;gap:3vmin}
 .dots{bottom:auto;top:49%;left:5%}
}
</style>
<div class="stage">
 <div class="photo">
  <div class="slide s1"></div>
  <div class="slide s2"></div>
  <div class="slide s3"></div>
 </div>
 <div class="dots"><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div></div>
 <div class="cardwrap">
  <div class="card">
   <div class="chip row r1">매매</div>
   <div class="title row r2">○○동 ○○아파트</div>
   <div class="stats row r3"><div class="stat">84㎡</div><div class="stat">방 3</div><div class="stat">욕실 2</div></div>
   <div class="price row r4">○억 원</div>
   <div class="map row r5">
    <div class="pinpos"><div class="ring"></div><div class="pin"><i></i></div></div>
    <div class="label">○○역 도보 7분</div>
   </div>
  </div>
 </div>
</div>
</html>
