<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 I05 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.scene{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6vmin;box-sizing:border-box;padding-bottom:8vmin;background:radial-gradient(ellipse at 50% 0%,#1E293B 0%,#020617 78%);font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;perspective:140vmin}
.float{width:56vmin;height:42vmin;transform-style:preserve-3d;animation:float 4s linear 0s 1 both}
.card{position:relative;width:100%;height:100%;border-radius:3vmin;overflow:hidden;box-shadow:0 4vmin 7vmin rgba(0,0,0,.65);transform-style:preserve-3d;animation:tilt 4s linear 0s 1 both}
.photo{position:absolute;inset:0;background:
radial-gradient(circle at 70% 28%,#FDE68A 0 6vmin,transparent 6.5vmin),
radial-gradient(ellipse at 50% 100%,#F97316 0,transparent 70%),
linear-gradient(180deg,#38BDF8 0%,#FBBF24 62%,#F97316 100%);
animation:bright 4s linear 0s 1 both}
.hill{position:absolute;bottom:0;width:70%;height:48%;border-radius:50% 50% 0 0}
.h1{left:-10%;background:#14532D}
.h2{right:-12%;height:38%;background:#166534}
.plate{position:absolute;left:50%;bottom:7%;width:22vmin;height:22vmin;margin-left:-11vmin;border-radius:50%;background:radial-gradient(circle,#FEF3C7 0 30%,#F8FAFC 32% 100%);box-shadow:0 1.5vmin 3vmin rgba(0,0,0,.35)}
.plate::after{content:"";position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#EF4444,#7F1D1D)}
.streak{position:absolute;top:-20%;height:140%;width:18%;left:41%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:streak 4s linear 0s 1 both}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 4s linear 0s 1 both}
.title{font-size:6.5vmin;font-weight:800;color:#CBD5E1;letter-spacing:.2vmin;white-space:nowrap}
@keyframes float{
0%{transform:translateY(0) rotateX(0) scale(1)}
25%{transform:translateY(-1vmin) rotateX(3deg) scale(1.02)}
50%{transform:translateY(0) rotateX(-2deg) scale(1.035)}
75%{transform:translateY(-1vmin) rotateX(2deg) scale(1.015)}
100%{transform:translateY(0) rotateX(0) scale(1)}}
@keyframes tilt{
0%{transform:rotateY(0);animation-timing-function:ease-in-out}
25%{transform:rotateY(18deg);animation-timing-function:ease-in-out}
75%{transform:rotateY(-18deg);animation-timing-function:ease-in-out}
100%{transform:rotateY(0)}}
@keyframes streak{
0%{left:41%;animation-timing-function:ease-in-out}
25%{left:88%;animation-timing-function:ease-in-out}
75%{left:-6%;animation-timing-function:ease-in-out}
100%{left:41%}}
@keyframes flash{
0%,42%{opacity:0}
50%{opacity:.4}
58%,100%{opacity:0}}
@keyframes bright{
0%,40%{filter:brightness(1)}
50%{filter:brightness(1.3)}
60%,100%{filter:brightness(1)}}
</style>
<div class="scene">
  <div class="float">
    <div class="card">
      <div class="photo"><div class="hill h1"></div><div class="hill h2"></div><div class="plate"></div></div>
      <div class="streak"></div>
      <div class="flash"></div>
    </div>
  </div>
  <div class="title">신메뉴 출시</div>
</div>
</html>
