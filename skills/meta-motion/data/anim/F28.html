<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F28 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;
  background:
    radial-gradient(60vmin 40vmin at 70% 30%,rgba(255,214,170,.55),transparent 70%),
    linear-gradient(180deg,#46607f 0%,#6d86a3 45%,#2c3a4e 100%)}
.hill{position:absolute;left:-10%;right:-10%;bottom:0;height:38%;background:linear-gradient(180deg,#23303f,#141b26);border-radius:50% 50% 0 0/40% 40% 0 0}
.person{position:absolute;left:50%;top:22%;width:22vmin;height:22vmin;margin-left:-11vmin;border-radius:50%;background:linear-gradient(180deg,#d9b9a0,#b89279);opacity:.55}
.body{position:absolute;left:50%;top:44%;width:38vmin;height:30vmin;margin-left:-19vmin;border-radius:40% 40% 0 0;background:linear-gradient(180deg,#3d4a5f,#2a3546);opacity:.6}
.caption{position:absolute;left:0;right:0;bottom:5vmin;text-align:center;color:rgba(255,255,255,.35);font-size:4vmin}
.strap{position:absolute;left:3vmin;bottom:16vmin;display:flex;align-items:stretch;height:9vmin;max-width:94vw;
  filter:drop-shadow(0 1.4vmin 1.6vmin rgba(0,0,0,.45))}
.tag{display:flex;align-items:center;justify-content:center;padding:0 3vmin;background:#ffcc1a;color:#1a1a1a;
  font-weight:900;font-size:min(5vmin,3.9vw);white-space:nowrap;position:relative;z-index:2;
  animation:tagIn .35s cubic-bezier(.2,.9,.3,1) .1s 1 both,tagFlash .4s ease-in-out .95s 1 both}
.main{display:flex;align-items:center;padding:0 3vmin;background:#fff;color:#111;font-weight:900;
  font-size:min(5vmin,3.9vw);white-space:nowrap;
  animation:wipe .6s cubic-bezier(.3,.7,.2,1) .35s 1 both}
@keyframes tagIn{from{transform:translateX(-60vmin);opacity:0}15%{opacity:1}to{transform:translateX(0);opacity:1}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes tagFlash{0%{filter:brightness(1)}50%{filter:brightness(1.45) saturate(1.1)}100%{filter:brightness(1)}}
</style>
<div class="stage">
  <div class="hill"></div>
  <div class="person"></div>
  <div class="body"></div>
  <div class="caption">촬영 화면 예시</div>
  <div class="strap">
    <div class="tag">핵심</div>
    <div class="main">묻지 말고, 맡기세요 — 확인은 사람이</div>
  </div>
</div>
</html>
