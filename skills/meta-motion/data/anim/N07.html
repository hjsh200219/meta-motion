<!-- 생성 파일(build_card_anim.py) — 카드 N07 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>

html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#F4F6F8;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1E232B}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:6vmin;--g:62vmin}
.g{width:var(--g);height:var(--g);display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);flex:none}
.g>div{display:flex;align-items:center;justify-content:center;animation:pin .2s calc(var(--i)*.005s) 1 both}
.g b{display:block;width:62%;height:86%}
.g i{display:block;position:relative;width:100%;height:100%;color:#CBD5E1}
.g i::before{content:"";position:absolute;left:25%;top:0;width:50%;height:36%;border-radius:50%;background:currentColor}
.g i::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:58%;border-radius:42% 42% 14% 14%/30% 30% 14% 14%;background:currentColor}
.g>div:nth-child(-n+23) i{animation:fill .15s calc(.6s + var(--i)*.0682s) 1 both}
.g>div:nth-child(-n+23) b{animation:wow .4s 2.25s 1 both}
.info{display:flex;flex-direction:column;align-items:flex-start;gap:1.5vmin}
.desc{font-size:5.4vmin;font-weight:700;color:#4B5563;animation:rise .7s 0s 1 both}
.big{display:flex;align-items:baseline;color:#E8442E;font-weight:900;font-size:24vmin;line-height:1;animation:show .05s .6s 1 both}
.win{height:1em;width:1.2em;overflow:hidden;font-variant-numeric:tabular-nums}
.st{animation:count 1.65s .6s 1 both}
.st span{display:block;height:1em;line-height:1}
.pct{font-size:.4em;margin-left:.1em}
.t10{font-size:7vmin;font-weight:900;color:#1E232B;animation:rise .4s 2.1s 1 both}
.t100{font-size:4.4vmin;font-weight:600;color:#7B8794;animation:hold 2.25s 2.25s 1 both}
.src{font-size:3.2vmin;color:#94A3B8;margin-top:3vmin;animation:hold2 2.25s 2.25s 1 both}
@media (max-aspect-ratio:12/10){
.stage{flex-direction:column;gap:3vmin;--g:min(78vw,36vh)}
.info{align-items:center;text-align:center;gap:1vmin}
.big{font-size:20vmin}
.src{margin-top:1.5vmin}
}
@keyframes pin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes fill{0%{color:#CBD5E1;transform:scale(1)}40%{color:#E8442E;transform:scale(1.5)}100%{color:#E8442E;transform:scale(1)}}
@keyframes wow{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(2vmin)}to{opacity:1;transform:translateY(0)}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes count{0%{transform:translateY(0);animation-timing-function:steps(22,end)}90.9%{transform:translateY(-22em)}100%{transform:translateY(-22em)}}
@keyframes hold{0%{opacity:0;transform:translateY(1.5vmin)}12%{opacity:1;transform:none}100%{opacity:1;transform:none}}
@keyframes hold2{0%,10%{opacity:0;transform:translateY(1.5vmin)}24%{opacity:1;transform:none}100%{opacity:1;transform:none}}
