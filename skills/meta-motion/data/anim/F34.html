<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F34 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#111}
.scene{position:absolute;inset:0;background:linear-gradient(180deg,#3aa6c9 0%,#2f7fa6 45%,#e8a352 100%);animation:freeze .3s linear 0s 1 both}
.scene:before{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,#6b4a2f,#3a2616)}
.scene .win{position:absolute;right:8%;top:10%;width:22vmin;height:16vmin;border-radius:1.5vmin;background:linear-gradient(135deg,#ffe29a,#ff9d5c)}
.scene .win.b{right:34%;top:6%;width:12vmin;height:12vmin;background:linear-gradient(135deg,#9fe3ff,#5bb5ff)}
@keyframes freeze{0%{filter:saturate(1) brightness(1)}60%{filter:saturate(.1) brightness(.62)}100%{filter:saturate(.12) brightness(.74)}}
.person{position:absolute;left:32%;top:64%;width:0;height:0}
.person i{position:absolute;display:block;background:#2b2f45}
.person .body{left:-25vmin;top:-18vmin;width:50vmin;height:60vmin;border-radius:50% 50% 0 0;background:#2b3a67}
.person .neck{left:-4vmin;top:-38vmin;width:8vmin;height:22vmin;background:#d9a27c;border-radius:2vmin}
.person .head{left:-10vmin;top:-56vmin;width:20vmin;height:22vmin;border-radius:50%;background:#e8b48e}
.person .hair{left:-10.5vmin;top:-57vmin;width:21vmin;height:11vmin;border-radius:50% 50% 30% 30%;background:#2a1f1a}
.person .mic{left:-1vmin;top:-1.6vmin;width:2vmin;height:3.2vmin;border-radius:.6vmin;background:#111;box-shadow:0 0 0 .4vmin #888}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);animation:vig .3s ease-out 0s 1 both}
@keyframes vig{0%{opacity:0}60%{opacity:1}100%{opacity:.75}}
.chip{position:absolute;left:4%;top:5%;padding:1.6vmin 3.4vmin;border-radius:5vmin;background:#1b1f2a;color:#fff;font-weight:800;font-size:4.6vmin;letter-spacing:.2vmin;animation:pop .3s ease-out .3s 1 both}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.card{position:absolute;left:46%;right:4%;bottom:6%;box-sizing:border-box;padding:3vmin 3.4vmin;border-radius:3vmin;background:#fff;box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.45);animation:slide .5s cubic-bezier(.2,.8,.2,1) .6s 1 both}
@keyframes slide{0%{transform:translateX(120vw);opacity:0}15%{opacity:1}100%{transform:translateX(0);opacity:1}}
.card b{display:block;color:#e8431f;font-size:5.4vmin;font-weight:900;margin-bottom:1vmin}
.card p{margin:0;color:#14171f;font-weight:800;font-size:4.4vmin;line-height:1.35;word-break:keep-all}
.ring{position:absolute;left:32%;top:64%;width:14vmin;height:14vmin;margin:-7vmin 0 0 -7vmin;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:#e8431f;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-in-out 1.1s 1 both}
.lines{position:absolute;inset:0;width:100%;height:100%}
.lines line{stroke:#e8431f;stroke-width:.9vmin;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .4s ease-out 2.1s 1 both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
</style>
<div class="stage">
  <div class="scene">
    <div class="win"></div><div class="win b"></div>
    <div class="person"><i class="body"></i><i class="neck"></i><i class="head"></i><i class="hair"></i><i class="mic"></i></div>
  </div>
  <div class="vig"></div>
  <div class="chip">❚❚ 잠깐</div>
  <div class="card"><b>잠깐!</b><p>작은 핀 마이크 하나로 소리가 확 달라집니다</p></div>
  <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" pathLength="1"/></svg>
  <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="46" y1="72" x2="40" y2="67" pathLength="1"/></svg>
</div>
</html>
