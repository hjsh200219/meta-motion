<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T20 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
.stage{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%,#2A2118 0%,#241b13 45%,#0a0705 85%,#000 100%);
  font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:84vw;gap:3vmin}
.mark{font-family:Georgia,"Times New Roman",serif;font-size:24vmin;line-height:.6;height:12vmin;color:#FFB45A;
  animation:markIn .4s 0s 1 both}
@keyframes markIn{from{opacity:.35;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.quote{margin:0;font-size:9vmin;font-weight:900;line-height:1.3;color:#F5E9D7;word-break:keep-all;letter-spacing:-.02em;
  text-shadow:0 .4vmin 2vmin rgba(0,0,0,.6)}
.w{display:inline-block;margin:0 .14em;opacity:0;animation:rise .5s 1 both}
.w:nth-child(1){animation-delay:.4s}
.w:nth-child(2){animation-delay:.85s}
.w:nth-child(3){animation-delay:1.3s}
.w:nth-child(4){animation-delay:1.75s}
.w:nth-child(5){animation-delay:2.2s}
@keyframes rise{from{opacity:0;transform:translateY(3vmin);filter:blur(1.2vmin)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.src{font-size:4.6vmin;color:#BFAE93;opacity:0;letter-spacing:.04em;animation:srcIn .6s 3.2s 1 both}
@keyframes srcIn{from{opacity:0;transform:translateY(1vmin)}to{opacity:1;transform:translateY(0)}}
.grain{position:absolute;inset:-6%;z-index:3;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background-image:
   radial-gradient(circle at 20% 30%,rgba(255,235,200,.9) 0 18%,transparent 22%),
   radial-gradient(circle at 70% 60%,rgba(255,220,170,.8) 0 18%,transparent 22%),
   radial-gradient(circle at 45% 85%,rgba(255,245,225,.8) 0 15%,transparent 20%);
  background-size:1.1vmin 1.4vmin,1.7vmin 1.3vmin,2.3vmin 2.9vmin;
  animation:jit .2s 0s 32 both}
.grain.b{mix-blend-mode:multiply;opacity:.6;
  background-image:
   radial-gradient(circle at 30% 40%,rgba(0,0,0,.9) 0 20%,transparent 25%),
   radial-gradient(circle at 75% 25%,rgba(0,0,0,.8) 0 18%,transparent 24%);
  background-size:1.5vmin 1.2vmin,2.1vmin 2.6vmin;animation-duration:.25s;animation-iteration-count:26}
@keyframes jit{0%{transform:translate(0,0)}20%{transform:translate(-1.3%,.9%)}40%{transform:translate(1.1%,-1.4%)}60%{transform:translate(-.6%,-.8%)}80%{transform:translate(1.5%,1.2%)}100%{transform:translate(0,0)}}
.vig{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
.leak{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse at 80% 20%,rgba(255,190,110,.75),rgba(255,150,70,.25) 50%,transparent 80%);
  animation:leak .7s 2.2s 1 both}
@keyframes leak{0%{opacity:0}30%{opacity:.55}100%{opacity:0}}
</style>
<div class="stage">
  <div class="card">
    <div class="mark">“</div>
    <p class="quote"><span class="w">좋은</span><span class="w">질문이</span><span class="w">좋은</span><span class="w">답을</span><span class="w">만든다</span></p>
    <div class="src">— 출처 이름</div>
  </div>
  <div class="grain"></div>
  <div class="grain b"></div>
  <div class="vig"></div>
  <div class="leak"></div>
</div>
</html>
