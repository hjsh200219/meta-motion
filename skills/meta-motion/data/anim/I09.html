<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 I09 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0B10;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0B0B10;
  --photo:
    radial-gradient(circle at 22% 42%,#fff3b0 0 5%,rgba(255,200,90,.8) 12%,transparent 30%),
    radial-gradient(circle at 78% 58%,#ffd0e0 0 4%,rgba(255,120,150,.7) 14%,transparent 32%),
    linear-gradient(180deg,rgba(0,0,0,0) 62%,rgba(10,60,90,.55) 62%,rgba(5,30,60,.9) 100%),
    linear-gradient(90deg,#0aa5c8,#2ec4b6,#ffd166,#ff8a4c,#ef476f,#7b5cff,#0aa5c8)}
.photo{position:absolute;inset:-10%;background:var(--photo);background-size:100% 100%;opacity:0;transform:scale(1.15);
  animation:reveal .8s 3.4s 1 both linear,settle .8s 4.2s 1 both ease-out}
.txt{position:relative;display:inline-block;white-space:nowrap;font-size:21vw;font-weight:900;letter-spacing:-.05em;line-height:1;
  color:transparent;-webkit-text-fill-color:transparent;background:var(--photo);background-size:250% 100%;background-position:0% 50%;
  -webkit-background-clip:text;background-clip:text;transform-origin:50% 50%;
  animation:drift 3s 0s 1 both linear,zoom 1.4s 2.8s 1 both cubic-bezier(.5,0,.9,.4),fade 1.4s 2.8s 1 both linear}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 1s 3.2s 1 both linear}
@keyframes drift{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(6)}}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes settle{from{transform:scale(1.15)}to{transform:scale(1.05)}}
@keyframes flash{0%{opacity:0}40%{opacity:.6}100%{opacity:0}}
</style>
<div class="stage">
  <div class="photo"></div>
  <div class="txt">SUMMER</div>
  <div class="flash"></div>
</div>
</html>
