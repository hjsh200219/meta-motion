<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F47 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#0a0b0f;display:flex;align-items:center;justify-content:center;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{position:relative;width:64vw;height:72vmin;animation:winIn .6s 0s 1 both cubic-bezier(.2,.8,.2,1)}
.win{position:absolute;inset:0;background:#fff;border-radius:2vmin;overflow:hidden;box-shadow:0 2vmin 6vmin rgba(0,0,0,.6)}
.bar{position:relative;height:7vmin;background:#d6d9df;display:flex;align-items:center;justify-content:center;color:#3a3f4a;font-size:3.6vmin;font-weight:700}
.dots{position:absolute;left:2.5vmin;top:0;height:100%;display:flex;align-items:center;gap:1.2vmin}
.dots i{width:1.8vmin;height:1.8vmin;border-radius:50%;background:#9aa0ab}
.view{position:absolute;left:0;right:0;top:7vmin;bottom:0;overflow:hidden;background:#fff}
.page{padding-top:3vmin;animation:scroll 1.3s .6s 1 both cubic-bezier(.5,0,.1,1)}
.blk{position:relative;height:13vmin;margin:0 4vmin 3vmin;
background:
linear-gradient(#c3c9d2,#c3c9d2) 0 0/38% 2vmin no-repeat,
linear-gradient(#e4e7ec,#e4e7ec) 0 4.5vmin/100% 1.6vmin no-repeat,
linear-gradient(#e4e7ec,#e4e7ec) 0 7.5vmin/92% 1.6vmin no-repeat,
linear-gradient(#e4e7ec,#e4e7ec) 0 10.5vmin/68% 1.6vmin no-repeat}
.blk:nth-child(3n){background-size:52% 2vmin,100% 1.6vmin,84% 1.6vmin,76% 1.6vmin}
.blk:nth-child(4n){background-size:30% 2vmin,96% 1.6vmin,100% 1.6vmin,55% 1.6vmin}
.blk.tg{background:none;display:flex;align-items:center}
.tg p{position:relative;z-index:1;margin:0;padding:0 1vmin;font-size:4.4vmin;line-height:1.35;font-weight:800;color:#15171c;word-break:keep-all}
.band{position:absolute;left:-2vmin;right:-2vmin;top:-1vmin;bottom:-1vmin;background:rgba(255,179,0,.24);border-left:1.4vmin solid #ffb300;animation:paint .4s 1.9s 1 both cubic-bezier(.3,.7,.2,1)}
.dim{position:absolute;left:0;right:0;background:rgba(6,7,10,.62);opacity:0;animation:dimIn .4s 1.9s 1 both ease-out}
.dim.t{top:0;height:21vmin}
.dim.b{top:36vmin;bottom:0}
.track{position:absolute;right:.6vmin;top:.8vmin;bottom:.8vmin;width:1.2vmin;border-radius:1vmin;background:rgba(0,0,0,.08);z-index:3}
.thumb{position:absolute;left:0;right:0;top:0;height:12vmin;border-radius:1vmin;background:#ffb300;animation:thumb 1.3s .6s 1 both cubic-bezier(.5,0,.1,1)}
.noterow{position:absolute;left:100%;top:29vmin;height:13vmin;margin-left:1.6vmin;display:flex;align-items:center}
.note{position:relative;background:#1d2130;color:#fff;font-size:3.6vmin;font-weight:700;padding:1.6vmin 2vmin;border-radius:1.2vmin;width:max-content;max-width:min(24vmin,14vw);line-height:1.3;word-break:keep-all;transform-origin:left center;box-shadow:0 1vmin 3vmin rgba(0,0,0,.5);animation:pop .3s 2.3s 1 both cubic-bezier(.3,1.5,.5,1)}
.note::before{content:"";position:absolute;left:-1.2vmin;top:50%;margin-top:-1vmin;border:1vmin solid transparent;border-right:1.2vmin solid #1d2130;border-left:0}
@keyframes winIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-109vmin)}}
@keyframes thumb{from{transform:translateY(0)}to{transform:translateY(44vmin)}}
@keyframes paint{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
</style>
<div class="wrap">
  <div class="win">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div>AI 답변</div>
    <div class="view">
      <div class="page">
        <div class="blk"></div><div class="blk"></div><div class="blk"></div><div class="blk"></div>
        <div class="blk"></div><div class="blk"></div><div class="blk"></div><div class="blk"></div>
        <div class="blk tg"><div class="band"></div><p>핵심: 반복 업무부터 맡기세요</p></div>
        <div class="blk"></div><div class="blk"></div><div class="blk"></div>
      </div>
      <div class="dim t"></div>
      <div class="dim b"></div>
      <div class="track"><div class="thumb"></div></div>
    </div>
  </div>
  <div class="noterow"><div class="note">여기가 핵심</div></div>
</div>
</html>
