<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 B20 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden}
.shot{position:absolute;inset:-6%;background:
 radial-gradient(60% 50% at 25% 30%,#4a7fb5 0%,transparent 70%),
 radial-gradient(50% 45% at 78% 65%,#c98a4b 0%,transparent 70%),
 linear-gradient(160deg,#2c4a6b,#6b4b73 55%,#2a2f44);
 filter:blur(2.2vmin)}
.shot i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.16)}
.shot i:nth-child(1){left:12%;top:58%;width:30%;height:30%}
.shot i:nth-child(2){left:62%;top:14%;width:22%;height:22%;background:rgba(255,220,160,.22)}
.shot i:nth-child(3){left:44%;top:70%;width:18%;height:18%}
.dim{position:absolute;inset:0;background:rgba(10,10,18,.5)}
.layout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:4vmin 0}
.greet{margin:0;max-width:90vw;text-align:center;color:#F4F1EA;font-weight:800;font-size:7vmin;line-height:1.25;text-shadow:0 .4vmin 1.5vmin rgba(0,0,0,.45);
 animation:greetIn .4s ease-out .2s 1 both}
@keyframes greetIn{from{opacity:0;transform:translateY(-2vmin)}to{opacity:1;transform:translateY(0)}}
.slots{display:flex;gap:3vw;justify-content:center;width:100%}
.slot{width:38vw;aspect-ratio:16/9;box-sizing:border-box;border:.6vmin dashed #F4F1EA;border-radius:2vmin;background:rgba(0,0,0,.28);
 display:flex;align-items:center;justify-content:center;color:#F4F1EA;font-size:4vmin;font-weight:600;opacity:.95}
.slot.l{animation:inL .55s cubic-bezier(.2,.8,.25,1) .4s 1 both}
.slot.r{animation:inR .55s cubic-bezier(.2,.8,.25,1) .5s 1 both}
@keyframes inL{from{opacity:0;transform:translateX(-60vw)}to{opacity:.95;transform:translateX(0)}}
@keyframes inR{from{opacity:0;transform:translateX(60vw)}to{opacity:.95;transform:translateX(0)}}
.pop{animation:pop .4s linear 1s 1 both}
@keyframes pop{0%{opacity:0;transform:scale(0)}
 45%{opacity:1;transform:scale(1.3)}
 75%{transform:scale(.94)}
 100%{opacity:1;transform:scale(1)}}
.sub{width:18vmin;height:18vmin;border-radius:50%;box-sizing:border-box;background:#E8442E;border:.8vmin solid #F4F1EA;color:#fff;font-weight:900;font-size:5vmin;
 display:flex;align-items:center;justify-content:center;box-shadow:0 1vmin 3vmin rgba(0,0,0,.4);
 animation:breathe 1.2s ease-in-out 1.4s 3 both}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
<div class="stage">
 <div class="shot"><i></i><i></i><i></i></div>
 <div class="dim"></div>
 <div class="layout">
  <h1 class="greet">시청해 주셔서 감사합니다</h1>
  <div class="slots">
   <div class="slot l">다음 영상</div>
   <div class="slot r">추천 영상</div>
  </div>
  <div class="pop"><div class="sub">구독</div></div>
 </div>
</div>
</html>
