<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F16 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
@property --n{syntax:"<integer>";inherits:false;initial-value:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#6e7f95 0%,#3e4a5e 55%,#2a2f3b 100%)}
/* 촬영 화면 예시: 왼쪽에 사람 실루엣 */
.person{position:absolute;left:12vmin;bottom:0;width:30vmin;height:60vmin}
.person i{position:absolute;display:block;background:linear-gradient(#1d222c,#12151c)}
.person .head{left:7vmin;top:0;width:16vmin;height:16vmin;border-radius:50%}
.person .body{left:0;top:17vmin;width:30vmin;height:43vmin;border-radius:14vmin 14vmin 0 0}
.glow{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(ellipse at 25% 40%,rgba(255,255,255,.14),transparent 60%)}
.card{position:absolute;top:6vmin;right:5vmin;width:max(34vw,52vmin);box-sizing:border-box;padding:3.2vmin 3.6vmin 3.4vmin;border-radius:3.5vmin;background:#1b2433;box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:1.4vmin;
animation:slide .5s cubic-bezier(.2,.8,.25,1) .05s 1 both}
@keyframes slide{from{transform:translateX(130%);opacity:0}to{transform:translateX(0);opacity:1}}
.top{font-size:4vmin;color:#9fb0c8;font-weight:500;letter-spacing:.02em}
.row{display:flex;align-items:baseline;justify-content:center;gap:1.6vmin}
.num{display:inline-block;font-size:17vmin;font-weight:900;line-height:1;color:#ffc933;transform-origin:50% 80%;font-variant-numeric:tabular-nums;
animation:count 1.2s cubic-bezier(.15,.7,.25,1) .5s 1 both,pop .4s ease-out 1.7s 1 both}
.num::after{content:counter(n);counter-reset:n var(--n)}
@keyframes count{from{--n:0}to{--n:6}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.unit{font-size:7vmin;font-weight:800;color:#fff;animation:fade .3s ease-out .5s 1 both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bars{display:flex;align-items:flex-end;gap:1.6vmin;height:7vmin;margin-top:.8vmin}
.bars b{display:block;width:3.2vmin;border-radius:.8vmin .8vmin .3vmin .3vmin;background:#5d6f8c;transform-origin:50% 100%;
animation:rise .4s cubic-bezier(.2,.9,.3,1) 1 both}
.bars b:nth-child(1){height:2.4vmin;animation-delay:.7s}
.bars b:nth-child(2){height:3.8vmin;animation-delay:.85s}
.bars b:nth-child(3){height:5.2vmin;animation-delay:1s}
.bars b:nth-child(4){height:7vmin;background:#ffc933;animation-delay:1.15s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.src{font-size:3vmin;color:#8393ad;margin-top:.6vmin}
</style>
<div class="stage">
  <div class="glow"></div>
  <div class="person"><i class="body"></i><i class="head"></i></div>
  <div class="card">
    <div class="top">매주 아낀 시간</div>
    <div class="row"><span class="num"></span><span class="unit">시간</span></div>
    <div class="bars"><b></b><b></b><b></b><b></b></div>
    <div class="src">반복 업무 3가지 기준</div>
  </div>
</div>
</html>
