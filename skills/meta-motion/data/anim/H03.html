<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 H03 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.h03{width:100vw;height:100vh;box-sizing:border-box;padding:4vmin 4vmin 3vmin;background:#F5F7FB;display:flex;flex-direction:column;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#0F172A;position:relative;overflow:hidden}
.h03 .head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:1.5vmin 3vmin;animation:h03fade .4s ease-out 0s 1 both}
.h03 .ttl{font-size:5.4vmin;font-weight:900;white-space:nowrap;line-height:1.2;color:#0B1020}
.h03 .legend{display:flex;flex-wrap:wrap;align-items:center;gap:1vmin 2.4vmin;margin-top:1.6vmin;font-size:3.6vmin;color:#334155}
.h03 .legend span{display:inline-flex;align-items:center;gap:1vmin;white-space:nowrap}
.h03 .legend i{display:inline-block;width:3vmin;height:3vmin;border-radius:.6vmin}
.h03 .legend .lb{background:#93C5FD}
.h03 .legend .lo{background:#FDBA74}
.h03 .legend .lr{height:.9vmin;background:#E8442E;border-radius:1vmin}
.h03 .legend .note{color:#64748B}
.h03 .total{margin-left:auto;text-align:right;color:#E8442E;font-weight:900;line-height:1;transform-origin:right center;animation:h03pulse .3s ease-out 3.3s 1 both}
.h03 .total small{display:block;font-size:3.6vmin;color:#64748B;font-weight:700;margin-bottom:.8vmin}
.h03 .num{display:inline-block;min-width:4ch;text-align:right;font-size:12vmin;font-variant-numeric:tabular-nums;animation:h03count 2.9s linear .4s 1 both}
.h03 .num::before{counter-reset:n var(--n);content:counter(n)}
.h03 .unit{font-size:5vmin;margin-left:.8vmin}
.h03 .chart{flex:1;min-height:0;position:relative;margin:2vmin 1vmin 0}
.h03 .plot{position:absolute;left:0;right:0;top:0;bottom:5vmin}
.h03 .grid{position:absolute;inset:0;border-bottom:.5vmin solid #94A3B8;background:
 repeating-linear-gradient(to right,rgba(148,163,184,.22) 0 .25vmin,transparent .25vmin 10%),
 repeating-linear-gradient(to top,rgba(148,163,184,.35) 0 .3vmin,transparent .3vmin 20%);animation:h03fade .4s ease-out 0s 1 both}
.h03 .labels{position:absolute;left:0;right:0;bottom:0;height:5vmin;display:flex;font-size:3.4vmin;color:#64748B;animation:h03fade .4s ease-out 0s 1 both}
.h03 .labels b{flex:1;text-align:center;font-weight:600;padding-top:1vmin}
.h03 .bar{position:absolute;bottom:0;left:calc(var(--i)*10% + 2%);width:6%;height:var(--h);background:#93C5FD;border-radius:.8vmin .8vmin 0 0;transform-origin:bottom;animation:h03rise .25s cubic-bezier(.2,.8,.3,1) calc(.4s + var(--i)*.29s) 1 both}
.h03 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:h03reveal 2.9s linear .4s 1 both}
.h03 svg *{vector-effect:non-scaling-stroke}
.h03 .fill{fill:#FDBA74;fill-opacity:.55;stroke:none}
.h03 .dep{fill:none;stroke:#2563EB;stroke-width:.8vmin;stroke-dasharray:1.8vmin 1.4vmin}
.h03 .cur{fill:none;stroke:#E8442E;stroke-width:1.2vmin;stroke-linecap:round;stroke-linejoin:round}
.h03 .dot{position:absolute;width:3vmin;height:3vmin;margin:-1.5vmin 0 0 -1.5vmin;border-radius:50%;background:#E8442E;border:.6vmin solid #fff;box-sizing:border-box;box-shadow:0 0 1.4vmin rgba(232,68,46,.55);animation:h03dot 2.9s linear .4s 1 both}
.h03 .ring{position:absolute;left:95%;top:6.8%;width:6vmin;height:6vmin;margin:-3vmin 0 0 -3vmin;border-radius:50%;border:.9vmin solid #E8442E;box-sizing:border-box;box-shadow:0 0 3vmin rgba(232,68,46,.6);animation:h03ring .7s ease-out 3.3s 1 both}
.h03 .chip{position:absolute;left:1%;top:2%;z-index:3;background:#fff;border-radius:5vmin;padding:1.6vmin 3vmin;font-size:4vmin;font-weight:800;white-space:nowrap;box-shadow:0 1vmin 3vmin rgba(15,23,42,.18);transform-origin:left center;animation:h03chip .3s cubic-bezier(.3,1.6,.5,1) 3.3s 1 both}
.h03 .chip em{font-style:normal;color:#2563EB}
.h03 .chip u{text-decoration:none;color:#EA7A1A}
.h03 .chip s{text-decoration:none;color:#94A3B8;margin:0 .6vmin}
@keyframes h03fade{from{opacity:0;transform:translateY(-1vmin)}to{opacity:1;transform:none}}
@keyframes h03rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes h03reveal{from{clip-path:inset(-3vmin 100% -3vmin -2vmin)}to{clip-path:inset(-3vmin 4.5% -3vmin -2vmin)}}
@keyframes h03dot{
0%{left:0%;top:100%;opacity:0}
1%{opacity:1}
5.26%{left:5%;top:91.9%}
15.79%{left:15%;top:83.5%}
26.32%{left:25%;top:74.9%}
36.84%{left:35%;top:66.1%}
47.37%{left:45%;top:56.9%}
57.89%{left:55%;top:47.5%}
68.42%{left:65%;top:37.8%}
78.95%{left:75%;top:27.8%}
89.47%{left:85%;top:17.5%}
100%{left:95%;top:6.8%;opacity:1}}
@keyframes h03count{
0%{--n:0}
5.26%{--n:122}
15.79%{--n:247}
26.32%{--n:376}
36.84%{--n:509}
47.37%{--n:647}
57.89%{--n:788}
68.42%{--n:933}
78.95%{--n:1083}
89.47%{--n:1238}
100%{--n:1397}}
@keyframes h03pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes h03ring{0%{opacity:0;transform:scale(.3)}15%{opacity:.9}100%{opacity:0;transform:scale(3.4)}}
@keyframes h03chip{from{opacity:0;transform:scale(.5) translateY(1.5vmin)}to{opacity:1;transform:none}}
</style>
<div class="h03">
  <div class="head">
    <div>
      <div class="ttl">매달 10만 원 · 연 3% · 10년</div>
      <div class="legend">
        <span><i class="lb"></i>넣은 돈</span>
        <span><i class="lo"></i>이자</span>
        <span><i class="lr"></i>합계</span>
        <span class="note">세전 · 예시 계산</span>
      </div>
    </div>
    <div class="total"><small>합계</small><span class="num"></span><span class="unit">만 원</span></div>
  </div>
  <div class="chart">
    <div class="plot">
      <div class="grid"></div>
      <div class="bar" style="--i:0;--h:8%"></div>
      <div class="bar" style="--i:1;--h:16%"></div>
      <div class="bar" style="--i:2;--h:24%"></div>
      <div class="bar" style="--i:3;--h:32%"></div>
      <div class="bar" style="--i:4;--h:40%"></div>
      <div class="bar" style="--i:5;--h:48%"></div>
      <div class="bar" style="--i:6;--h:56%"></div>
      <div class="bar" style="--i:7;--h:64%"></div>
      <div class="bar" style="--i:8;--h:72%"></div>
      <div class="bar" style="--i:9;--h:80%"></div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon class="fill" points="0,100 5,91.9 15,83.5 25,74.9 35,66.1 45,56.9 55,47.5 65,37.8 75,27.8 85,17.5 95,6.8 95,20 85,28 75,36 65,44 55,52 45,60 35,68 25,76 15,84 5,92"/>
        <polyline class="dep" points="0,100 5,92 15,84 25,76 35,68 45,60 55,52 65,44 75,36 85,28 95,20"/>
        <polyline class="cur" points="0,100 5,91.9 15,83.5 25,74.9 35,66.1 45,56.9 55,47.5 65,37.8 75,27.8 85,17.5 95,6.8"/>
      </svg>
      <div class="dot"></div>
      <div class="ring"></div>
      <div class="chip"><em>넣은 돈 1,200만</em><s>+</s><u>이자 197만</u></div>
    </div>
    <div class="labels"><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b><b>10년</b></div>
  </div>
</div>
</html>
