<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 N04 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
*{box-sizing:border-box}
.stage{position:relative;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(160deg,#EEF2F7 0%,#DCE5EE 100%)}
.light{position:absolute;left:-10%;top:-20%;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 70%);animation:drift 5.5s 0s 1 both ease-in-out}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(30%,18%)}}
.title{position:absolute;left:4vmin;top:3.5vmin;font-size:4vmin;font-weight:800;color:#1E293B;letter-spacing:-.02em;animation:fadein .6s 0s 1 both ease-out}
.title::before{content:"";display:inline-block;width:1vmin;height:3.6vmin;background:#0F766E;margin-right:1.4vmin;vertical-align:-.6vmin;border-radius:.4vmin}
@keyframes fadein{from{opacity:0;transform:translateY(-1vmin)}to{opacity:1;transform:none}}
.zoom{position:absolute;left:3%;right:3%;top:16%;bottom:4%;transform-origin:50% 40%;animation:zoom 3s 0s 1 both ease-out}
@keyframes zoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.box{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;border-radius:1.2vmin;box-shadow:0 .8vmin 2vmin rgba(30,41,59,.18);animation:pop .22s var(--d) 1 both cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}
.root{left:50%;width:26%;margin-left:-13%;top:2%;height:16%;background:#1E293B;color:#fff;font-size:5vmin;font-weight:800;animation-duration:.35s}
.team{left:var(--x);width:24%;margin-left:-12%;top:40%;height:16%;background:var(--c);color:#fff;font-size:4vmin;font-weight:800}
.leaf{left:var(--x);width:15%;margin-left:-7.5%;top:74%;height:22%;background:#fff;border-top:1vmin solid var(--c);color:#1E293B;font-size:3vmin;font-weight:700;border-radius:.8vmin}
.leaf small{font-size:2.4vmin;font-weight:500;color:#8591A3;margin-top:.8vmin}
.v,.h{position:absolute;background:#94A3B8;border-radius:.3vmin}
.v{left:var(--x);width:.5vmin;margin-left:-.25vmin;top:var(--y);height:var(--len);transform-origin:50% 0;animation:growy .2s var(--d) 1 both ease-out,glow .5s var(--g) 1 both ease-in-out}
.h{top:var(--y);height:.5vmin;margin-top:-.25vmin;left:var(--x);width:var(--len);transform-origin:50% 50%;animation:growx .2s var(--d) 1 both ease-out,glow .5s var(--g) 1 both ease-in-out}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%{background:#94A3B8;box-shadow:0 0 0 rgba(0,0,0,0)}50%{background:var(--c);box-shadow:0 0 1.8vmin .4vmin var(--c)}100%{background:#94A3B8;box-shadow:0 0 0 rgba(0,0,0,0)}}
</style>
<div class="stage">
  <div class="light"></div>
  <div class="title">○○센터 조직도</div>
  <div class="zoom">
    <!-- 맨 위 -->
    <div class="box root" style="--d:.15s">센터장</div>
    <div class="v" style="--x:50%;--y:18%;--len:11%;--d:.5s;--g:2.6s;--c:#38BDF8"></div>
    <div class="h" style="--x:16.67%;--y:29%;--len:66.66%;--d:.7s;--g:2.7s;--c:#38BDF8"></div>
    <div class="v" style="--x:16.67%;--y:29%;--len:11%;--d:.9s;--g:2.8s;--c:#0F766E"></div>
    <div class="v" style="--x:50%;--y:29%;--len:11%;--d:.9s;--g:2.8s;--c:#4338CA"></div>
    <div class="v" style="--x:83.33%;--y:29%;--len:11%;--d:.9s;--g:2.8s;--c:#B45309"></div>
    <!-- 팀 -->
    <div class="box team" style="--x:16.67%;--c:#0F766E;--d:1.05s">사업팀</div>
    <div class="box team" style="--x:50%;--c:#4338CA;--d:1.22s">교육팀</div>
    <div class="box team" style="--x:83.33%;--c:#B45309;--d:1.4s">행정팀</div>
    <!-- 팀별 가지 -->
    <div class="v" style="--x:16.67%;--y:56%;--len:9%;--d:1.55s;--g:2.9s;--c:#0F766E"></div>
    <div class="v" style="--x:50%;--y:56%;--len:9%;--d:1.55s;--g:2.9s;--c:#4338CA"></div>
    <div class="v" style="--x:83.33%;--y:56%;--len:9%;--d:1.55s;--g:2.9s;--c:#B45309"></div>
    <div class="h" style="--x:8.33%;--y:65%;--len:16.67%;--d:1.7s;--g:3s;--c:#0F766E"></div>
    <div class="h" style="--x:41.67%;--y:65%;--len:16.67%;--d:1.7s;--g:3s;--c:#4338CA"></div>
    <div class="h" style="--x:75%;--y:65%;--len:16.67%;--d:1.7s;--g:3s;--c:#B45309"></div>
    <div class="v" style="--x:8.33%;--y:65%;--len:9%;--d:1.9s;--g:3.1s;--c:#0F766E"></div>
    <div class="v" style="--x:25%;--y:65%;--len:9%;--d:1.9s;--g:3.1s;--c:#0F766E"></div>
    <div class="v" style="--x:41.67%;--y:65%;--len:9%;--d:1.9s;--g:3.1s;--c:#4338CA"></div>
    <div class="v" style="--x:58.33%;--y:65%;--len:9%;--d:1.9s;--g:3.1s;--c:#4338CA"></div>
    <div class="v" style="--x:75%;--y:65%;--len:9%;--d:1.9s;--g:3.1s;--c:#B45309"></div>
    <div class="v" style="--x:91.67%;--y:65%;--len:9%;--d:1.9s;--g:3.1s;--c:#B45309"></div>
    <!-- 담당 -->
    <div class="box leaf" style="--x:8.33%;--c:#0F766E;--d:2.05s">사례관리<small>담당</small></div>
    <div class="box leaf" style="--x:25%;--c:#0F766E;--d:2.16s">일자리<small>담당</small></div>
    <div class="box leaf" style="--x:41.67%;--c:#4338CA;--d:2.27s">직업교육<small>담당</small></div>
    <div class="box leaf" style="--x:58.33%;--c:#4338CA;--d:2.38s">상담<small>담당</small></div>
    <div class="box leaf" style="--x:75%;--c:#B45309;--d:2.49s">회계<small>담당</small></div>
    <div class="box leaf" style="--x:91.67%;--c:#B45309;--d:2.6s">시설<small>담당</small></div>
  </div>
</div>
</html>
