<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 I04 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111827}
.zoom{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%;animation:zoom 3.2s linear 1.8s 1 both}
.pulse{width:calc(100% - 5vmin);height:calc(100% - 5vmin);transform-origin:50% 50%;animation:pulse .4s ease-in-out 1.72s 1 both}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.6vmin}
.cell{position:relative;overflow:hidden;border-radius:2.4vmin;box-shadow:0 1vmin 3vmin rgba(0,0,0,.45);background:
radial-gradient(circle at 72% 28%,var(--s) 0 9%,transparent 9.5%),
linear-gradient(160deg,var(--a),var(--b));
animation:pop .4s cubic-bezier(.3,1.4,.5,1) var(--d) 1 both}
.cell::before,.cell::after{content:"";position:absolute;left:0;right:0;bottom:0}
.cell::before{height:46%;background:var(--c);clip-path:polygon(0 60%,28% 20%,52% 55%,76% 10%,100% 50%,100% 100%,0 100%);opacity:.9}
.cell::after{height:26%;background:var(--e);clip-path:polygon(0 50%,35% 15%,65% 60%,100% 25%,100% 100%,0 100%)}
.c1{grid-column:1;grid-row:1/3;--a:#f59e0b;--b:#b45309;--c:#7c2d12;--e:#431407;--s:#fde68a;--d:.2s;transform-origin:50% 50%}
.c2{grid-column:2;grid-row:1;--a:#38bdf8;--b:#1e3a8a;--c:#0f766e;--e:#064e3b;--s:#e0f2fe;--d:.48s}
.c3{grid-column:3;grid-row:1;--a:#fb7185;--b:#7e22ce;--c:#4c1d95;--e:#2e1065;--s:#ffe4e6;--d:.76s}
.c4{grid-column:2;grid-row:2;--a:#a3e635;--b:#15803d;--c:#14532d;--e:#052e16;--s:#f7fee7;--d:1.04s}
.c5{grid-column:3;grid-row:2;--a:#f472b6;--b:#be123c;--c:#881337;--e:#4c0519;--s:#fff1f2;--d:1.32s}
.title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;padding:2.4vmin 5vmin;border-radius:99vmin;background:rgba(17,24,39,.74);color:#fff;font-weight:800;font-size:7vmin;letter-spacing:.02em;box-shadow:0 1vmin 3vmin rgba(0,0,0,.4);animation:fadein .8s ease-out 2.4s 1 both}
@keyframes pop{0%{transform:scale(.04);opacity:0}15%{opacity:1}65%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes fadein{from{opacity:0;filter:blur(1vmin)}to{opacity:1;filter:blur(0)}}
</style>
<div class="stage">
  <div class="zoom">
    <div class="pulse">
      <div class="grid">
        <div class="cell c1"></div>
        <div class="cell c2"></div>
        <div class="cell c3"></div>
        <div class="cell c4"></div>
        <div class="cell c5"></div>
      </div>
    </div>
    <div class="title">우리 가게 대표 메뉴</div>
  </div>
</div>
</html>
