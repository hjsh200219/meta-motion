<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 B01 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#4b6a8a 0%,#2c3e55 55%,#1b2433 100%)}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(180deg,#3a2f2a,#201915)}
.person{position:absolute;left:18%;bottom:0;width:34vmin;height:62vmin}
.head{position:absolute;left:50%;top:0;width:20vmin;height:24vmin;margin-left:-10vmin;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 40% 35%,#f0c9a4,#d0a07a)}
.body{position:absolute;left:0;right:0;top:25vmin;bottom:0;border-radius:45% 45% 0 0;background:linear-gradient(180deg,#c8d3df,#8b9bb0)}
.tag{position:absolute;left:3vmin;top:3vmin;font-size:3vmin;color:#fff;background:rgba(0,0,0,.35);padding:.6vmin 1.6vmin;border-radius:1vmin}
.note{position:absolute;left:50%;bottom:5vmin;transform:translateX(-50%);white-space:nowrap;font-size:4vmin;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:1.2vmin 3vmin;border-radius:1.6vmin}
.pos{position:absolute;right:8vmin;top:10vmin}
.pop,.shake,.out{display:block}
.pop{animation:pop .3s cubic-bezier(.3,.7,.4,1) .15s 1 both}
.shake{animation:shake .45s linear .45s 1 both}
.out{animation:out .2s ease-in 1.7s 1 both}
.txt{display:block;white-space:nowrap;font-size:12vmin;font-weight:900;line-height:1.1;color:#FFD400;-webkit-text-stroke:1.8vmin #16130E;paint-order:stroke fill;text-shadow:0 1.4vmin 0 #16130E;letter-spacing:.02em}
@keyframes pop{
0%{transform:scale(.05);opacity:0}
10%{opacity:1}
65%{transform:scale(1.3);opacity:1}
100%{transform:scale(1);opacity:1}}
@keyframes shake{
0%{transform:rotate(0) translateX(0)}
15%{transform:rotate(-5deg) translateX(-1vmin)}
30%{transform:rotate(-5deg) translateX(1vmin)}
45%{transform:rotate(-5deg) translateX(-1vmin)}
60%{transform:rotate(-5deg) translateX(1vmin)}
75%{transform:rotate(-5deg) translateX(-.6vmin)}
90%{transform:rotate(-5deg) translateX(.4vmin)}
100%{transform:rotate(-5deg) translateX(0)}}
@keyframes out{
0%{transform:scale(1);opacity:1}
100%{transform:scale(0);opacity:0}}
</style>
<div class="stage">
  <div class="tag">촬영 화면 예시</div>
  <div class="person"><div class="head"></div><div class="body"></div></div>
  <div class="pos"><span class="out"><span class="shake"><span class="pop"><span class="txt">헉!</span></span></span></span></div>
  <div class="note">상황: 처음 써 보는 자동 분류</div>
</div>
</html>
