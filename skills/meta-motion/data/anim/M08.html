<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 M08 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;font-weight:900}
.stage{position:relative;width:100%;height:100%;box-sizing:border-box;padding:4vmin 5vmin;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:linear-gradient(180deg,#2F86D6 0%,#A6D6F6 100%)}
.stage *{box-sizing:border-box}
.cloud{position:relative;width:5em;height:1.8em;border-radius:1em;background:#fff}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:2.2em;height:2.2em;left:.7em;top:-1.1em}
.cloud::after{width:2.8em;height:2.8em;left:1.8em;top:-1.6em}

/* 하늘 구름 */
.sky{position:absolute;inset:0;pointer-events:none}
.sky .cloud{position:absolute;opacity:.55;filter:blur(.6vmin);animation:drift 5s linear 0s 1 both}
.sky .cloud:nth-child(1){font-size:9vmin;top:14%;left:-5%;--d:14vmin}
.sky .cloud:nth-child(2){font-size:12vmin;top:46%;left:55%;--d:-18vmin;opacity:.4}
.sky .cloud:nth-child(3){font-size:7vmin;top:70%;left:8%;--d:10vmin;opacity:.35}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--d))}}

/* 위치 */
.loc{position:relative;display:flex;align-items:center;gap:2.5vmin;font-size:10vmin;line-height:1;text-shadow:0 .5vmin 1.5vmin rgba(0,60,120,.35);animation:down .45s ease-out 0s 1 both}
@keyframes down{from{opacity:0;transform:translateY(-5vmin)}to{opacity:1;transform:translateY(0)}}
.pin{width:6vmin;height:6vmin;background:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);position:relative;flex:none;box-shadow:0 .5vmin 1.5vmin rgba(0,60,120,.3)}
.pin::after{content:"";position:absolute;width:2.4vmin;height:2.4vmin;border-radius:50%;background:#2F86D6;left:1.8vmin;top:1.8vmin}

/* 가운데 */
.mid{position:relative;display:flex;align-items:center;justify-content:space-around;gap:3vmin}
.art{position:relative;width:36vmin;height:36vmin;flex:none;animation:pop 1s linear .2s 1 both}
@keyframes pop{0%{opacity:0;transform:scale(0)}35%{opacity:1;transform:scale(1.18)}55%{transform:scale(.92)}75%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
.burstwrap,.raywrap{position:absolute;inset:0}
.raywrap{animation:burstscale .6s ease-in-out 1.8s 1 both}
@keyframes burstscale{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#FFD23A 0 7deg,transparent 7deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 30%,#000 34%,transparent 70%);mask:radial-gradient(circle,transparent 0 30%,#000 34%,transparent 70%);animation:spin 4.8s linear .2s 1 both}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(180deg)}}
.sunbody{position:absolute;left:23%;top:23%;width:54%;height:54%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFE680,#FFD23A 70%);box-shadow:0 0 4vmin rgba(255,210,58,.7)}
.burst{position:absolute;left:-20%;top:-20%;width:140%;height:140%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,235,140,.7) 30%,transparent 65%);animation:flash .6s ease-out 1.8s 1 both;opacity:0}
@keyframes flash{0%{opacity:0;transform:scale(.5)}30%{opacity:.95}100%{opacity:0;transform:scale(1.5)}}
.sway{position:absolute;right:-8%;bottom:6%;animation:sway .7s ease-in-out 2.9s 3 alternate both}
@keyframes sway{from{transform:translateX(-1.2vmin)}to{transform:translateX(1.5vmin)}}
.slide{font-size:6vmin;filter:drop-shadow(0 1vmin 1.5vmin rgba(0,60,120,.25));animation:slidein .7s cubic-bezier(.2,.8,.3,1) .5s 1 both}
@keyframes slidein{from{opacity:0;transform:translateX(40vmin)}to{opacity:1;transform:translateX(0)}}

.tempbox{display:flex;flex-direction:column;align-items:center;gap:1vmin}
.temp{display:flex;font-size:24vmin;line-height:1;text-shadow:0 .8vmin 2vmin rgba(0,60,120,.3);animation:fadein .2s ease-out .55s 1 both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.win{height:1em;width:.62em;overflow:hidden;text-align:center}
.strip span{display:block;height:1em;line-height:1em}
.s1{animation:roll1 1.25s cubic-bezier(.15,.7,.2,1) .55s 1 both}
.s2{animation:roll2 1.25s cubic-bezier(.15,.7,.2,1) .55s 1 both}
@keyframes roll1{from{transform:translateY(0)}to{transform:translateY(-12em)}}
@keyframes roll2{from{transform:translateY(0)}to{transform:translateY(-13em)}}
.deg{line-height:1;width:.4em}
.desc{font-size:6vmin;line-height:1.1;text-shadow:0 .4vmin 1.2vmin rgba(0,60,120,.3);white-space:nowrap;animation:rise .4s ease-out 1.6s 1 both}
@keyframes rise{from{opacity:0;transform:translateY(4vmin)}to{opacity:1;transform:translateY(0)}}

/* 예보 칸 */
.cards{position:relative;display:flex;gap:2.5vmin}
.card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1vmin;padding:2vmin 1vmin;background:rgba(255,255,255,.25);border:.5vmin solid rgba(255,255,255,.8);border-radius:3vmin;animation:cardup .4s ease-out 2s 1 both}
.card:nth-child(2){animation-delay:2.25s}
.card:nth-child(3){animation-delay:2.5s}
@keyframes cardup{from{opacity:0;transform:translateY(14vmin)}to{opacity:1;transform:translateY(0)}}
.day{font-size:4.6vmin;line-height:1.1;text-shadow:0 .3vmin 1vmin rgba(0,60,120,.3)}
.ct{font-size:5.6vmin;line-height:1.1;text-shadow:0 .3vmin 1vmin rgba(0,60,120,.3)}
.ico{position:relative;width:12vmin;height:9vmin;display:flex;align-items:center;justify-content:center}
.mini-sun{width:7vmin;height:7vmin;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFE680,#FFD23A 70%);box-shadow:0 0 1.5vmin rgba(255,210,58,.8)}
.ico .cloud{font-size:2.2vmin;margin-top:1.5vmin}
.ico.rain .cloud{background:#E6EEF6}
.ico.rain .cloud::before,.ico.rain .cloud::after{background:#E6EEF6}
.ico.cl .cloud{font-size:2.4vmin;background:#fff}
.drop{position:absolute;top:5.5vmin;width:.8vmin;height:2vmin;border-radius:50%;background:#3E8FE0;opacity:0;animation:fall .7s linear 2.9s 3 both}
.drop:nth-of-type(1){left:3.5vmin}
.drop:nth-of-type(2){left:6vmin;animation-name:fall2}
.drop:nth-of-type(3){left:8.5vmin}
@keyframes fall{0%{opacity:0;transform:translateY(-1vmin)}20%{opacity:1}100%{opacity:0;transform:translateY(4.5vmin)}}
@keyframes fall2{0%,45%{opacity:0;transform:translateY(-1vmin)}60%{opacity:1}100%{opacity:0;transform:translateY(4.5vmin)}}

@media (orientation:portrait){
  .mid{flex-direction:column;gap:2vmin}
  .art{width:40vmin;height:40vmin}
  .temp{font-size:22vmin}
  .desc{font-size:5.6vmin}
  .day{font-size:4vmin}
  .ct{font-size:5vmin}
  .ico{width:10vmin}
}
</style>
<div class="stage">
  <div class="sky"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
  <div class="loc"><div class="pin"></div><span>○○시</span></div>
  <div class="mid">
    <div class="art">
      <div class="burstwrap"><div class="burst"></div></div>
      <div class="raywrap"><div class="rays"></div></div>
      <div class="sunbody"></div>
      <div class="sway"><div class="slide"><div class="cloud"></div></div></div>
    </div>
    <div class="tempbox">
      <div class="temp">
        <div class="win"><div class="strip s1"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span><span>1</span><span>2</span></div></div>
        <div class="win"><div class="strip s2"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span><span>1</span><span>2</span><span>3</span></div></div>
        <div class="deg">°</div>
      </div>
      <div class="desc">맑고 구름 조금</div>
    </div>
  </div>
  <div class="cards">
    <div class="card"><div class="day">내일</div><div class="ico"><div class="mini-sun"></div></div><div class="ct">25°</div></div>
    <div class="card"><div class="day">모레</div><div class="ico rain"><div class="cloud"></div><i class="drop"></i><i class="drop"></i><i class="drop"></i></div><div class="ct">19°</div></div>
    <div class="card"><div class="day">글피</div><div class="ico cl"><div class="cloud"></div></div><div class="ct">21°</div></div>
  </div>
</div>
</html>
