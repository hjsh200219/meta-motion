<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T03 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1B2336;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.shake{position:absolute;inset:0;animation:bigshake 1s 2s 1 both}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
.word{font-size:22vmin;font-weight:900;letter-spacing:-0.02em;white-space:nowrap;line-height:1}
.s1{background:#1B2336;color:#FFB45A;animation:out1 1s 0s 1 both}
.s2{background:#0F1420;color:#4FD6FF;animation:out2 1s 1s 1 both}
.s3{background:#1D1220;color:#FF6B8B;animation:in3 1s 2s 1 both}
.s1 .word{animation:slam 1s 0s 1 both}
.s2 .word{animation:slam 1s 1s 1 both}
.s3 .word{animation:slam 1s 2s 1 both}
@keyframes out1{0%,96%{opacity:1}100%{opacity:0}}
@keyframes out2{0%{opacity:0}1%,96%{opacity:1}100%{opacity:0}}
@keyframes in3{0%{opacity:0}1%,100%{opacity:1}}
@keyframes slam{
0%{transform:scale(3) translateX(0);opacity:0}
3%{opacity:1}
16%{transform:scale(1) translateX(0);opacity:1}
22%{transform:scale(1) translateX(-2.5vmin)}
28%{transform:scale(1) translateX(2.5vmin)}
34%{transform:scale(1) translateX(-1.8vmin)}
40%{transform:scale(1) translateX(1.8vmin)}
46%,100%{transform:scale(1) translateX(0);opacity:1}
}
@keyframes bigshake{
0%,13%{transform:translate(0,0)}
18%{transform:translate(-3vmin,2vmin)}
24%{transform:translate(3vmin,-2.5vmin)}
30%{transform:translate(-2.5vmin,-2vmin)}
36%{transform:translate(2.5vmin,2vmin)}
42%{transform:translate(-1.5vmin,1vmin)}
48%{transform:translate(1vmin,-1vmin)}
54%,100%{transform:translate(0,0)}
}
</style>
<div class="shake">
  <div class="stage s1"><div class="word">이거</div></div>
  <div class="stage s2"><div class="word">모르면</div></div>
  <div class="stage s3"><div class="word">손해</div></div>
</div>
</html>
