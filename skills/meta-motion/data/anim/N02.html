<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 N02 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:800}
.stage{--w:min(94vw,150vmin);--p:calc(var(--w)*.2667);position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef4fa,#e3ecf5);color:#1e3a8a}
.title{position:absolute;left:5vmin;top:4.5vmin;font-size:6vmin;letter-spacing:-.02em;animation:fin .5s ease-out 0s 1 both}
.row{position:relative;width:var(--w);height:calc(var(--w)*.17);margin:6vmin 0 8vmin}
.st{position:absolute;top:0;width:calc(var(--w)*.2);height:100%;animation:pop .4s cubic-bezier(.3,1.4,.5,1) var(--d) 1 both}
.st:nth-child(1){left:0}.st:nth-child(2){left:calc(var(--w)*.2667)}.st:nth-child(3){left:calc(var(--w)*.5333)}.st:nth-child(4){left:calc(var(--w)*.8)}
.bx{position:relative;box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;border:.35vmin solid #cbd5e1;border-radius:2vmin;background:#fff;color:#1e293b;box-shadow:0 .8vmin 2vmin rgba(30,58,138,.12);font-size:3.8vmin;white-space:nowrap}
.st:nth-child(1) .bx{animation:b1 5.5s linear 0s 1 both}
.st:nth-child(2) .bx{animation:b2 5.5s linear 0s 1 both}
.st:nth-child(3) .bx{animation:b3 5.5s linear 0s 1 both}
.st:nth-child(4) .bx{animation:b4 5.5s linear 0s 1 both,bnc .6s ease-out 4.4s 1 both}
.nm{position:absolute;left:-1.4vmin;top:-1.6vmin;width:4.6vmin;height:4.6vmin;border-radius:50%;background:#f97316;color:#fff;font-size:2.8vmin;display:flex;align-items:center;justify-content:center;animation:gl .5s ease-in-out var(--a) 2 both}
.ck{position:absolute;right:-1.6vmin;top:-1.8vmin;width:4.8vmin;height:4.8vmin;border-radius:50%;background:#16a34a;color:#fff;font-size:3.2vmin;font-style:normal;text-decoration:none;display:flex;align-items:center;justify-content:center;animation:tick .3s ease-out var(--c) 1 both}
.ic{position:relative;display:block;width:5.4vmin;height:5.4vmin}
.ic::before,.ic::after{content:"";position:absolute;box-sizing:border-box}
.i1::before{left:.6vmin;top:0;width:4.2vmin;height:5.4vmin;border:.45vmin solid currentColor;border-radius:.7vmin}
.i1::after{left:1.6vmin;top:1.5vmin;width:2.2vmin;height:.4vmin;background:currentColor;box-shadow:0 1.2vmin currentColor,0 2.4vmin currentColor}
.i2::before{left:.4vmin;top:2.2vmin;width:4.6vmin;height:3vmin;border:.45vmin solid currentColor;border-top:none;border-radius:0 0 .8vmin .8vmin}
.i2::after{left:1.8vmin;top:.2vmin;width:1.8vmin;height:1.8vmin;border-right:.45vmin solid currentColor;border-bottom:.45vmin solid currentColor;transform:rotate(45deg)}
.i3::before{left:.3vmin;top:.3vmin;width:3.6vmin;height:3.6vmin;border:.45vmin solid currentColor;border-radius:50%}
.i3::after{left:3.6vmin;top:4vmin;width:2vmin;height:.5vmin;background:currentColor;transform:rotate(45deg);transform-origin:left center}
.i4::before{left:.3vmin;top:.7vmin;width:4.8vmin;height:3.8vmin;border:.45vmin solid currentColor;border-radius:.7vmin}
.i4::after{left:1.4vmin;top:.9vmin;width:2.6vmin;height:2.6vmin;border-right:.45vmin solid currentColor;border-bottom:.45vmin solid currentColor;transform:rotate(45deg) scale(.8);transform-origin:center}
.ar{position:absolute;top:50%;height:3.6vmin;margin-top:-1.8vmin;width:calc(var(--w)*.0667)}
.ar i{position:absolute;inset:0;background:#9aa7b8;clip-path:polygon(0 38%,78% 38%,78% 10%,100% 50%,78% 90%,78% 62%,0 62%);transform-origin:left center;animation:draw .3s ease-out var(--d) 1 both}
.ar i+i{background:#1e3a8a;animation:draw .7s ease-in-out var(--h) 1 both}
.chip{position:absolute;top:calc(50% + 3.4vmin);width:calc(var(--w)*.13);margin-left:calc(var(--w)*-.065);height:5.4vmin;border-radius:2.7vmin;background:#fef3c7;color:#92400e;border:.3vmin solid #fde68a;font-size:3.4vmin;display:flex;align-items:center;justify-content:center;animation:pop .35s cubic-bezier(.3,1.4,.5,1) var(--d) 1 both}
.dx{position:absolute;left:calc(var(--w)*.1 - 3.5vmin);top:-11vmin;width:7vmin;height:9vmin;animation:dx 5.5s linear 0s 1 both}
.dy{animation:dy 5.5s linear 0s 1 both}
.dd{animation:drop .3s ease-out 1.2s 1 both}
.doc{position:relative;width:7vmin;height:9vmin;box-sizing:border-box;background:#fff;border:.45vmin solid #1e3a8a;border-radius:.8vmin;box-shadow:0 1vmin 1.6vmin rgba(30,58,138,.3)}
.doc::before{content:"";position:absolute;left:1.2vmin;top:2.2vmin;width:3.6vmin;height:.5vmin;background:#1e3a8a;box-shadow:0 1.4vmin #1e3a8a,0 2.8vmin #1e3a8a}
.doc::after{content:"";position:absolute;right:-.45vmin;top:-.45vmin;width:2vmin;height:2vmin;background:#dbeafe;border-left:.45vmin solid #1e3a8a;border-bottom:.45vmin solid #1e3a8a;border-radius:0 0 0 .6vmin}
.pill{position:relative;width:76vmin;height:9.4vmin;border-radius:5vmin;background:#fff;border:.35vmin solid #cbd5e1;box-shadow:0 .8vmin 2vmin rgba(30,58,138,.12);font-size:4.2vmin;animation:pop .3s cubic-bezier(.3,1.4,.5,1) 1.2s 1 both}
.pill span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1.4vmin;white-space:nowrap;opacity:0}
.pill .t0{opacity:1;animation:out .2s linear 1.4s 1 both}
.pill .t1{animation:sw 1.1s linear 1.5s 1 both}
.pill .t2{animation:sw .9s linear 2.6s 1 both}
.pill .t3{animation:sw .9s linear 3.5s 1 both}
.pill .t4{animation:sw .5s linear 4.4s 1 both}
.pill .t5{animation:inn .2s linear 4.9s 1 both;opacity:1}
.pill .t5::before{content:"";width:2.4vmin;height:2.4vmin;border-radius:50%;background:#16a34a;box-shadow:0 0 0 .8vmin rgba(22,163,74,.25)}
@keyframes fin{from{opacity:0;transform:translateX(-3vmin)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translateY(4vmin) scale(.6)}60%{opacity:1;transform:translateY(0) scale(1.08)}100%{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-12vmin)}to{opacity:1;transform:none}}
@keyframes tick{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
@keyframes gl{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,0)}50%{box-shadow:0 0 0 1.8vmin rgba(249,115,22,.35)}}
@keyframes bnc{0%{transform:scale(1)}30%{transform:scale(1.2)}55%{transform:scale(.94)}80%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes dx{0%,34.55%{transform:translateX(0)}47.27%,50.91%{transform:translateX(var(--p))}63.64%,67.27%{transform:translateX(calc(var(--p)*2))}80%,100%{transform:translateX(calc(var(--p)*3))}}
@keyframes dy{0%,34.55%{transform:translateY(0)}40.91%{transform:translateY(-6vmin)}47.27%,50.91%{transform:translateY(0)}57.27%{transform:translateY(-6vmin)}63.64%,67.27%{transform:translateY(0)}73.64%{transform:translateY(-6vmin)}80%,100%{transform:translateY(0)}}
@keyframes b1{0%,21.8%{background:#fff;color:#1e293b;border-color:#cbd5e1}27.3%,34.5%{background:#1e3a8a;color:#fff;border-color:#1e3a8a}38.2%,100%{background:#dbeafe;color:#1e3a8a;border-color:#93c5fd}}
@keyframes b2{0%,47.2%{background:#fff;color:#1e293b;border-color:#cbd5e1}50%,51.8%{background:#1e3a8a;color:#fff;border-color:#1e3a8a}55.4%,100%{background:#dbeafe;color:#1e3a8a;border-color:#93c5fd}}
@keyframes b3{0%,63.6%{background:#fff;color:#1e293b;border-color:#cbd5e1}66.4%,68.2%{background:#1e3a8a;color:#fff;border-color:#1e3a8a}71.8%,100%{background:#dbeafe;color:#1e3a8a;border-color:#93c5fd}}
@keyframes b4{0%,80%{background:#fff;color:#1e293b;border-color:#cbd5e1}82.7%,89.1%{background:#1e3a8a;color:#fff;border-color:#1e3a8a}92.7%,100%{background:#dbeafe;color:#1e3a8a;border-color:#93c5fd}}
@keyframes sw{0%{opacity:0}10%,90%{opacity:1}100%{opacity:0}}
@keyframes out{from{opacity:1}to{opacity:0}}
@keyframes inn{from{opacity:0}to{opacity:1}}
</style>
<div class="stage">
  <div class="title">○○ 지원금 신청 절차</div>
  <div class="row">
    <div class="st" style="--d:0s;--a:1.2s;--c:1.9s"><div class="bx"><b class="nm">1</b><i class="ic i1"></i><span>서류 준비</span><u class="ck">✓</u></div></div>
    <div class="st" style="--d:.25s;--a:2.6s;--c:2.85s"><div class="bx"><b class="nm">2</b><i class="ic i2"></i><span>접수</span><u class="ck">✓</u></div></div>
    <div class="st" style="--d:.5s;--a:3.5s;--c:3.75s"><div class="bx"><b class="nm">3</b><i class="ic i3"></i><span>심사</span><u class="ck">✓</u></div></div>
    <div class="st" style="--d:.75s;--a:4.4s;--c:4.45s"><div class="bx"><b class="nm">4</b><i class="ic i4"></i><span>결과 안내</span><u class="ck">✓</u></div></div>
    <div class="ar" style="left:calc(var(--w)*.2);--d:.25s;--h:1.9s"><i></i><i></i></div>
    <div class="ar" style="left:calc(var(--w)*.4667);--d:.5s;--h:2.8s"><i></i><i></i></div>
    <div class="ar" style="left:calc(var(--w)*.7333);--d:.75s;--h:3.7s"><i></i><i></i></div>
    <div class="chip" style="left:calc(var(--w)*.2333);--d:.85s">1일</div>
    <div class="chip" style="left:calc(var(--w)*.5);--d:1s">3일</div>
    <div class="chip" style="left:calc(var(--w)*.7667);--d:1.15s">7일</div>
    <div class="dx"><div class="dy"><div class="dd"><div class="doc"></div></div></div></div>
  </div>
  <div class="pill">
    <span class="t0">신청 순서를 알려 드려요</span>
    <span class="t1">지금 1단계 · 서류 준비</span>
    <span class="t2">지금 2단계 · 접수</span>
    <span class="t3">지금 3단계 · 심사</span>
    <span class="t4">지금 4단계 · 결과 안내</span>
    <span class="t5">결과 안내 · 완료</span>
  </div>
</div>
</html>
