<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 I08 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.bg{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#312E81 0%,#1e1b4b 45%,#0F172A 100%);overflow:hidden}
.glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;left:12%;top:8%;background:radial-gradient(circle,rgba(139,92,246,.35),rgba(139,92,246,0) 70%)}
.stage{position:relative;width:62vmin;transform:translate(-5vmin,-2vmin);perspective:150vmin}
.floor{position:absolute;left:4%;right:-4%;bottom:-7vmin;height:5vmin;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(2.4vmin)}
.dev{position:relative;transform-origin:50% 55%;filter:drop-shadow(2.4vmin 3.2vmin 3vmin rgba(0,0,0,.6));
 animation:wobble 2s linear 0s 3 both}
.lid{position:relative;padding:2.2% 2.2% 2.6%;background:#05060a;border-radius:1.6vmin 1.6vmin .6vmin .6vmin;border:.25vmin solid #2b2f3d;box-sizing:border-box}
.cam{position:absolute;top:.7%;left:50%;width:.9vmin;height:.9vmin;margin-left:-.45vmin;border-radius:50%;background:#1a2236;box-shadow:0 0 0 .2vmin #0b0e16}
.screen{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#fff;border-radius:.4vmin}
.page{position:absolute;left:0;top:0;width:100%;height:250%;display:flex;flex-direction:column;
 animation:scroll 4.2s cubic-bezier(.45,0,.55,1) .8s 1 both}
.sec{flex:1;position:relative;box-sizing:border-box;padding:3% 6%;display:flex;flex-direction:column;justify-content:center;gap:1.2vmin;overflow:hidden}
.s1{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
.s2{background:#f1f5f9}
.s3{background:#fff}
.s4{background:linear-gradient(180deg,#0ea5e9,#2563eb);color:#fff}
.s5{background:#1e293b;color:#e2e8f0}
.h{font-size:3.2vmin;font-weight:800;letter-spacing:-.05vmin}
.p{font-size:1.5vmin;opacity:.85}
.nav{display:flex;gap:1vmin;margin-bottom:1vmin}
.nav i{display:block;width:4vmin;height:.8vmin;border-radius:1vmin;background:rgba(255,255,255,.55)}
.btn{align-self:flex-start;padding:.7vmin 2vmin;border-radius:2vmin;background:#fff;color:#4f46e5;font-size:1.4vmin;font-weight:700}
.row{display:flex;gap:1.6vmin}
.card{flex:1;height:9vmin;border-radius:1vmin;background:#fff;box-shadow:0 .3vmin 1vmin rgba(15,23,42,.15)}
.card:nth-child(1){border-top:1vmin solid #6366f1}
.card:nth-child(2){border-top:1vmin solid #ec4899}
.card:nth-child(3){border-top:1vmin solid #f59e0b}
.bars{display:flex;align-items:flex-end;gap:1.2vmin;height:11vmin}
.bars b{flex:1;border-radius:.6vmin .6vmin 0 0;background:linear-gradient(180deg,#8b5cf6,#6366f1)}
.bars b:nth-child(1){height:40%}.bars b:nth-child(2){height:65%}.bars b:nth-child(3){height:50%}.bars b:nth-child(4){height:85%}.bars b:nth-child(5){height:70%}.bars b:nth-child(6){height:100%}
.ln{height:.9vmin;border-radius:1vmin;background:rgba(255,255,255,.6)}
.s5 .ln{background:rgba(226,232,240,.35)}
.ln:nth-child(2){width:80%}.ln:nth-child(3){width:60%}
.base{position:relative;width:114%;margin-left:-7%;height:2vmin;background:linear-gradient(180deg,#9ca3af,#4b5563 60%,#1f2937);border-radius:.2vmin .2vmin 2.4vmin 2.4vmin / .2vmin .2vmin 1.6vmin 1.6vmin}
.base:after{content:"";position:absolute;left:50%;top:0;width:14%;height:.8vmin;margin-left:-7%;background:#6b7280;border-radius:0 0 1vmin 1vmin}
.shine{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:.4vmin}
.shine:before{content:"";position:absolute;top:-30%;bottom:-30%;left:0;width:30%;
 background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);
 transform:translateX(-150%) skewX(-20deg);opacity:0;
 animation:shine .9s ease-in-out 5s 1 both}
.glass{position:absolute;inset:0;border-radius:.4vmin;background:linear-gradient(120deg,rgba(255,255,255,.12),rgba(255,255,255,0) 35%);pointer-events:none}
@keyframes wobble{
 0%{transform:rotateY(-10deg) rotateX(0deg) translateY(0)}
 25%{transform:rotateY(-16deg) rotateX(3deg) translateY(-.8vmin)}
 50%{transform:rotateY(-22deg) rotateX(0deg) translateY(0)}
 75%{transform:rotateY(-16deg) rotateX(-3deg) translateY(.8vmin)}
 100%{transform:rotateY(-10deg) rotateX(0deg) translateY(0)}}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-56%)}}
@keyframes shine{
 0%{transform:translateX(-150%) skewX(-20deg);opacity:0}
 15%{opacity:1}
 85%{opacity:1}
 100%{transform:translateX(450%) skewX(-20deg);opacity:0}}
</style>
<div class="bg">
 <div class="glow"></div>
 <div class="stage">
  <div class="floor"></div>
  <div class="dev">
   <div class="lid">
    <div class="cam"></div>
    <div class="screen">
     <div class="page">
      <div class="sec s1"><div class="nav"><i></i><i></i><i></i></div><div class="h">screenshot.png</div><div class="p">화면 캡처의 맨 위에서 시작합니다</div><div class="btn">시작하기</div></div>
      <div class="sec s2"><div class="row"><div class="card"></div><div class="card"></div><div class="card"></div></div></div>
      <div class="sec s3"><div class="bars"><b></b><b></b><b></b><b></b><b></b><b></b></div></div>
      <div class="sec s4"><div class="h">부드럽게 스크롤</div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>
      <div class="sec s5"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>
     </div>
     <div class="glass"></div>
     <div class="shine"></div>
    </div>
   </div>
   <div class="base"></div>
  </div>
 </div>
</div>
</html>
