<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T04 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 55%,#7c3aed 100%)}
.card{grid-area:1/1;width:min(54vw,90vmin);box-sizing:border-box;padding:5vmin 4vmin;background:#fff;border-radius:3.5vmin;box-shadow:0 4vmin 9vmin rgba(10,8,40,.55),0 1vmin 2.5vmin rgba(10,8,40,.35);display:flex;flex-direction:column;align-items:center;gap:3vmin;text-align:center;animation-duration:2.16s;animation-delay:1.04s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.65,0,.35,1)}
.stars{display:flex;gap:1vmin;font-size:7vmin;line-height:1;color:#F59E0B}
.stars i{font-style:normal;display:inline-block}
.quote{font-size:8vmin;font-weight:800;color:#1e1b4b;line-height:1.3}
.by{font-size:4vmin;color:#6b7280}
.c1{z-index:3;animation-name:m1}
.c2{z-index:2;animation-name:m2}
.c3{z-index:1;animation-name:m3}
.c3 .stars i{animation:tw .5s 1 both}
.c3 .stars i:nth-child(1){animation-delay:3.2s}
.c3 .stars i:nth-child(2){animation-delay:3.4s}
.c3 .stars i:nth-child(3){animation-delay:3.6s}
.c3 .stars i:nth-child(4){animation-delay:3.8s}
.c3 .stars i:nth-child(5){animation-delay:4s}
@keyframes m1{
0%{transform:translateX(0) scale(1);opacity:1;filter:blur(0)}
25.93%,74.07%{transform:translateX(-115%) scale(.8);opacity:.45;filter:blur(.5vmin)}
100%{transform:translateX(-230%) scale(.8);opacity:.45;filter:blur(.5vmin)}}
@keyframes m2{
0%{transform:translateX(115%) scale(.8);opacity:.45;filter:blur(.5vmin)}
25.93%,74.07%{transform:translateX(0) scale(1);opacity:1;filter:blur(0)}
100%{transform:translateX(-115%) scale(.8);opacity:.45;filter:blur(.5vmin)}}
@keyframes m3{
0%{transform:translateX(230%) scale(.8);opacity:.45;filter:blur(.5vmin)}
25.93%,74.07%{transform:translateX(115%) scale(.8);opacity:.45;filter:blur(.5vmin)}
100%{transform:translateX(0) scale(1);opacity:1;filter:blur(0)}}
@keyframes tw{
0%{transform:translateY(0) scale(1);filter:brightness(1)}
40%{transform:translateY(-1.6vmin) scale(1.55) rotate(12deg);filter:brightness(1.5) drop-shadow(0 0 1.5vmin #fde68a)}
100%{transform:translateY(0) scale(1) rotate(0);filter:brightness(1)}}
</style>
<div class="stage">
  <div class="card c1"><div class="stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div><div class="quote">후기 1</div><div class="by">작성자</div></div>
  <div class="card c2"><div class="stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div><div class="quote">후기 2</div><div class="by">작성자</div></div>
  <div class="card c3"><div class="stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div><div class="quote">후기 3</div><div class="by">작성자</div></div>
</div>
</html>
