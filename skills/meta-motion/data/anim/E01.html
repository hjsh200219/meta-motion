<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 E01 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{--w:min(50vw,60vmin);position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;background:radial-gradient(ellipse at center,#2E2166 35%,#07040f 100%);overflow:hidden}
.lbl{display:grid;place-items:center;height:7vmin;font-size:5vmin;font-weight:800;z-index:2}
.lbl span{grid-area:1/1;white-space:nowrap}
.l1{color:#fff;opacity:.85;animation:fadeup .45s .05s both,out .12s 2.56s both}
.l2{color:#FFD400;font-size:6.4vmin;opacity:0;animation:pop .35s 2.56s both}
.pw{position:relative;width:var(--w);height:calc(var(--w)*.72);z-index:2;animation:rise .6s 0s both}
.pb{position:absolute;inset:0;perspective:calc(var(--w)*3);animation:bounce .35s 2.56s both}
.h{position:absolute;left:0;right:0;height:50%;overflow:hidden;backface-visibility:hidden;background:#fff;color:#111}
.t{top:0;transform-origin:50% 100%;border-radius:2vmin 2vmin 0 0;box-shadow:inset 0 -.25vmin 0 rgba(0,0,0,.3)}
.b{top:50%;transform-origin:50% 0;border-radius:0 0 2vmin 2vmin}
.h span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.34);font-weight:900;letter-spacing:-.02em}
.t span{top:0}.b span{top:-100%}
.d{background:#E8442E;color:#fff}.d span{font-size:calc(var(--w)*.21)}
.t.a{z-index:4;animation:ft .18s .7s ease-in both}
.t.bb{z-index:3;animation:ft .18s 1.45s ease-in both}
.t.c{z-index:2;animation:ft .18s 2.2s ease-in both}
.t.d{z-index:1}
.b.a{z-index:1}
.b.bb{z-index:2;animation:fb .18s .88s ease-out both}
.b.c{z-index:3;animation:fb .18s 1.63s ease-out both}
.b.d{z-index:4;animation:fb .18s 2.38s ease-out both}
.title{font-size:8vmin;font-weight:900;color:#fff;white-space:nowrap;z-index:2;animation:fadeup .45s .1s both}
.chips{display:flex;gap:2.4vmin;z-index:2}
.chip{background:#FFD400;color:#1a1033;font-size:4.2vmin;font-weight:800;padding:1.2vmin 3vmin;border-radius:10vmin;white-space:nowrap;animation:chip .45s .3s both}
.chip+.chip{animation-delay:.4s}
.ray{position:absolute;left:50%;top:50%;width:62vmin;height:1.4vmin;margin-top:-.7vmin;border-radius:1vmin;transform-origin:0 50%;rotate:var(--r);background:linear-gradient(90deg,var(--c),transparent);opacity:0;z-index:1;animation:ray 1.1s 2.56s both}
.ray:nth-of-type(even){animation-delay:2.64s}
.cf{position:absolute;left:50%;top:50%;width:1.7vmin;height:2.8vmin;margin:-1.4vmin 0 0 -.85vmin;background:var(--c);opacity:0;z-index:3;animation:cf 1.3s calc(2.56s + var(--d,0s)) both}
@keyframes fadeup{from{opacity:0;transform:translateY(2vmin)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(3vmin) scale(.92)}to{opacity:1;transform:none}}
@keyframes chip{0%{opacity:0;transform:scale(.4)}65%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes ft{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes fb{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
@keyframes bounce{0%{transform:scale(1)}25%{transform:scale(.86)}60%{transform:scale(1.2)}82%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes ray{0%{opacity:1;transform:scaleX(0)}40%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.15)}}
@keyframes cf{0%{opacity:0;translate:0 0;rotate:0deg}5%{opacity:1}30%{translate:calc(var(--x)*.7) calc(var(--y)*-1)}80%{opacity:1}100%{opacity:0;translate:calc(var(--x)*1.1) var(--f);rotate:var(--r)}}
</style>
<div class="stage">
  <div class="ray" style="--r:-22deg;--c:#FFD400"></div>
  <div class="ray" style="--r:0deg;--c:#FF5FA2"></div>
  <div class="ray" style="--r:22deg;--c:#FFD400"></div>
  <div class="ray" style="--r:158deg;--c:#FFD400"></div>
  <div class="ray" style="--r:180deg;--c:#FF5FA2"></div>
  <div class="ray" style="--r:202deg;--c:#FFD400"></div>

  <div class="lbl"><span class="l1">행사까지</span><span class="l2">드디어 오늘!</span></div>

  <div class="pw"><div class="pb">
    <div class="h t d"><span>D-DAY</span></div>
    <div class="h t c"><span>D-1</span></div>
    <div class="h t bb"><span>D-3</span></div>
    <div class="h t a"><span>D-7</span></div>
    <div class="h b a"><span>D-7</span></div>
    <div class="h b bb"><span>D-3</span></div>
    <div class="h b c"><span>D-1</span></div>
    <div class="h b d"><span>D-DAY</span></div>
  </div></div>

  <div class="title">○○시 가을 축제</div>
  <div class="chips"><div class="chip">10월 3일(토)</div><div class="chip">○○체육관</div></div>

  <i class="cf" style="--c:#FFD400;--x:-38vmin;--y:22vmin;--f:30vmin;--r:540deg"></i>
  <i class="cf" style="--c:#FF5FA2;--x:-26vmin;--y:34vmin;--f:36vmin;--r:-420deg;--d:.04s"></i>
  <i class="cf" style="--c:#38D6FF;--x:-46vmin;--y:12vmin;--f:26vmin;--r:380deg;--d:.08s"></i>
  <i class="cf" style="--c:#7CFF6B;--x:-18vmin;--y:28vmin;--f:38vmin;--r:-600deg;--d:.02s"></i>
  <i class="cf" style="--c:#FFD400;--x:-32vmin;--y:38vmin;--f:42vmin;--r:300deg;--d:.1s"></i>
  <i class="cf" style="--c:#FF5FA2;--x:-50vmin;--y:24vmin;--f:34vmin;--r:-360deg;--d:.06s"></i>
  <i class="cf" style="--c:#38D6FF;--x:-24vmin;--y:16vmin;--f:28vmin;--r:480deg;--d:.12s"></i>
  <i class="cf" style="--c:#7CFF6B;--x:-40vmin;--y:32vmin;--f:40vmin;--r:-500deg;--d:.03s"></i>
  <i class="cf" style="--c:#FFD400;--x:38vmin;--y:22vmin;--f:30vmin;--r:-540deg"></i>
  <i class="cf" style="--c:#FF5FA2;--x:26vmin;--y:34vmin;--f:36vmin;--r:420deg;--d:.04s"></i>
  <i class="cf" style="--c:#38D6FF;--x:46vmin;--y:12vmin;--f:26vmin;--r:-380deg;--d:.08s"></i>
  <i class="cf" style="--c:#7CFF6B;--x:18vmin;--y:28vmin;--f:38vmin;--r:600deg;--d:.02s"></i>
  <i class="cf" style="--c:#FFD400;--x:32vmin;--y:38vmin;--f:42vmin;--r:-300deg;--d:.1s"></i>
  <i class="cf" style="--c:#FF5FA2;--x:50vmin;--y:24vmin;--f:34vmin;--r:360deg;--d:.06s"></i>
  <i class="cf" style="--c:#38D6FF;--x:24vmin;--y:16vmin;--f:28vmin;--r:-480deg;--d:.12s"></i>
  <i class="cf" style="--c:#7CFF6B;--x:40vmin;--y:32vmin;--f:40vmin;--r:500deg;--d:.03s"></i>
</div>
</html>
