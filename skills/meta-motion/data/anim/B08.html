<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 B08 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0A09;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{--d:min(75vh,82vw);width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:140vmin;background:radial-gradient(circle at 50% 50%,#1a1612 0%,#0B0A09 62%)}
.pop,.spin,.wob{width:var(--d);height:var(--d);transform-style:preserve-3d;position:relative}
.pop{animation:pop .9s cubic-bezier(.3,1.3,.5,1) 0s 1 both}
.spin{animation:spin 1.3s cubic-bezier(.1,.5,.25,1) 0s 1 both}
.wob{animation:wob .7s ease-in-out 1.3s 1 both}
.rim,.face{position:absolute;inset:0;border-radius:50%}
.rim{background:conic-gradient(from 30deg,#8a6a2c,#f1d089,#b88d3d,#e9c874,#7a5a24,#d4a857,#f1d089,#8a6a2c);transform:translateZ(calc((var(--i) - 4) * .65vmin));animation:rimglow .8s ease-in-out 1.5s 1 both}
.face{backface-visibility:hidden;overflow:hidden;background:conic-gradient(from 30deg,#a07a32,#f6dc9c,#d4a857,#f1d089,#8a6a2c,#d4a857,#f6dc9c,#a07a32);display:flex;align-items:center;justify-content:center}
.front{transform:translateZ(2.8vmin)}
.back{transform:rotateY(180deg) translateZ(2.8vmin)}
.disc{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 70% 25%,#fffaf0 0%,#f1e8d4 45%,#d9cbab 100%);box-shadow:inset 0 0 2vmin rgba(90,60,10,.45),0 0 1vmin rgba(255,230,160,.5);display:flex;align-items:center;justify-content:center;flex-direction:column}
.mark{width:26%;aspect-ratio:1;border-radius:30%;background:linear-gradient(135deg,#3a2c14,#8a6a2c);transform:rotate(45deg);box-shadow:0 .6vmin 1vmin rgba(0,0,0,.35)}
.word{margin-top:5%;font-size:6vmin;font-weight:800;letter-spacing:.8vmin;color:#3a2c14}
.sheen{position:absolute;left:35%;top:-30%;width:30%;height:160%;background:linear-gradient(90deg,rgba(255,244,220,0),rgba(255,244,220,.9) 50%,rgba(255,244,220,0));transform:translate(calc(var(--d) * -.7),calc(var(--d) * -.7)) rotate(45deg);opacity:0;animation:sheen .8s ease-in-out 1.5s 1 both}
.glow{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 8vmin rgba(255,240,200,.0),inset 0 0 6vmin 1vmin rgba(255,244,210,.95);opacity:0;animation:glow .8s ease-in-out 1.5s 1 both}
@keyframes pop{0%{transform:scale(.6);opacity:0}15%{opacity:1}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes spin{0%{transform:rotateY(0deg)}100%{transform:rotateY(540deg)}}
@keyframes wob{0%{transform:rotateY(0deg)}35%{transform:rotateY(5deg)}70%{transform:rotateY(-3deg)}100%{transform:rotateY(0deg)}}
@keyframes sheen{0%{opacity:0;transform:translate(calc(var(--d) * -.7),calc(var(--d) * -.7)) rotate(45deg)}50%{opacity:1}100%{opacity:0;transform:translate(calc(var(--d) * .7),calc(var(--d) * .7)) rotate(45deg)}}
@keyframes glow{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@keyframes rimglow{0%{filter:brightness(1)}50%{filter:brightness(1.9)}100%{filter:brightness(1)}}
</style>
<div class="stage">
  <div class="pop"><div class="spin"><div class="wob">
    <div class="rim" style="--i:0"></div><div class="rim" style="--i:1"></div><div class="rim" style="--i:2"></div>
    <div class="rim" style="--i:3"></div><div class="rim" style="--i:4"></div><div class="rim" style="--i:5"></div>
    <div class="rim" style="--i:6"></div><div class="rim" style="--i:7"></div><div class="rim" style="--i:8"></div>
    <div class="face front">
      <div class="disc"><div class="mark"></div><div class="word">LOGO</div></div>
      <div class="glow"></div><div class="sheen"></div>
    </div>
    <div class="face back">
      <div class="disc"><div class="mark"></div><div class="word">LOGO</div></div>
      <div class="glow"></div><div class="sheen"></div>
    </div>
  </div></div></div>
</div>
</html>
