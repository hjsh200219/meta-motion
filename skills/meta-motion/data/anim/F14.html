<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F14 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0b1020 0%,#16224a 55%,#27357a 100%)}
.card{width:86vmin;display:flex;flex-direction:column;align-items:flex-start}
.qwrap{opacity:0;transform:translateY(2vmin);
  animation:qin .4s ease-out .05s 1 both}
.q{display:block;font-size:34vmin;line-height:.72;height:19vmin;font-weight:900;color:#ffb627;transform-origin:20% 60%;
  animation:qpop .4s ease-in-out 1.3s 1 both}
.quote{margin:2vmin 0 0 6vmin;font-size:8vmin;line-height:1.3;font-weight:900;color:#fff;letter-spacing:-.02em;word-break:keep-all;
  clip-path:inset(0 100% 0 0);
  animation:wipe .9s cubic-bezier(.2,.7,.2,1) .4s 1 both}
.who{margin:4vmin 0 0 6vmin;font-size:4.6vmin;color:#c9d2f0;opacity:0;transform:translateY(3vmin);
  animation:rise .5s ease-out 1.4s 1 both}
.src{position:absolute;right:4vmin;bottom:4vmin;font-size:3vmin;color:#c9d2f0;opacity:0;
  animation:fade .5s ease-out 1.4s 1 both}
@keyframes qin{from{opacity:0;transform:translateY(2vmin)}to{opacity:1;transform:none}}
@keyframes qpop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(3vmin)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:.55}}
</style>
<div class="stage">
  <div class="card">
    <div class="qwrap"><span class="q">“</span></div>
    <div class="quote">도구보다 먼저, 내 일의 순서를 적어 보세요</div>
    <div class="who">— 홍길동 · ○○센터장</div>
  </div>
  <div class="src">○○ 강연(2026)</div>
</div>
</html>
