<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F11 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;background:radial-gradient(120% 120% at 20% 10%,#1b2a4a 0%,#0e1730 60%,#080d1d 100%);overflow:hidden}
.slide{position:absolute;left:3vw;top:6vh;width:70vw;height:88vh;box-sizing:border-box;background:#fff;border-radius:2vmin;box-shadow:0 2vmin 5vmin rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:center;padding:0 5vmin;transform-origin:left center;animation:pop .5s cubic-bezier(.2,.8,.3,1) .05s 1 both}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
.kicker{font-size:4vmin;font-weight:700;letter-spacing:.3vmin;color:#ff7a1a;margin-bottom:1.5vmin;animation:fadeup .3s ease-out .25s 1 both}
.title{font-size:10vmin;line-height:1.1;font-weight:900;color:#111c33;letter-spacing:-.3vmin;animation:fadeup .4s ease-out .15s 1 both}
.bar{height:1.4vmin;width:16vmin;border-radius:1vmin;background:#ff7a1a;margin:2.5vmin 0 5vmin;transform-origin:left center;animation:grow .2s ease-out .35s 1 both}
@keyframes fadeup{0%{opacity:0;transform:translateY(3vmin)}100%{opacity:1;transform:none}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2.4vmin}
li{display:flex;align-items:center;gap:2vmin;font-size:4.8vmin;font-weight:600;color:#1d2a44;opacity:0;animation:rise .5s cubic-bezier(.2,.8,.3,1) 1 both}
li::before{content:"●";color:#ff7a1a;font-size:3.6vmin}
li:nth-child(1){animation-delay:.5s}
li:nth-child(2){animation-delay:.8s}
li:nth-child(3){animation-delay:1.1s}
@keyframes rise{0%{opacity:0;transform:translateY(5vmin)}100%{opacity:1;transform:none}}
.inset{position:absolute;right:3vw;bottom:5vmin;width:max(20vw,24vmin);aspect-ratio:4/5;box-sizing:border-box;border:.7vmin solid #fff;border-radius:2vmin;overflow:hidden;box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.55);background:linear-gradient(160deg,#6f8fb8,#3c5577 55%,#25364f);animation:slidein .5s ease-out .4s 1 both}
@keyframes slidein{0%{opacity:0;transform:translateX(45vw)}70%{opacity:1;transform:translateX(-1.8vmin)}100%{opacity:1;transform:translateX(0)}}
.cam{position:absolute;inset:0;animation:sway 1.2s ease-in-out .9s 3 both}
@keyframes sway{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(1.2%) rotate(1.5deg)}}
.shoulders{position:absolute;left:8%;right:8%;bottom:-22%;height:48%;border-radius:50% 50% 0 0;background:#1d2b44}
.neck{position:absolute;left:42%;width:16%;top:56%;height:16%;background:#d9a77f}
.head{position:absolute;left:23%;width:54%;top:14%;height:46%;border-radius:48% 48% 44% 44%;background:#e8b88f}
.hair{position:absolute;left:21%;width:58%;top:11%;height:22%;border-radius:50% 50% 30% 30%;background:#2a1c14}
.eye{position:absolute;top:36%;width:7%;height:5%;border-radius:50%;background:#2a1c14;z-index:2;animation:blink .3s linear 1.6s 3 both}
.eye.l{left:36%}.eye.r{left:57%}
@keyframes blink{0%,40%,100%{transform:scaleY(1)}20%{transform:scaleY(.1)}}
.mouth{position:absolute;left:44%;width:12%;top:50%;height:3%;border-radius:0 0 50% 50%;background:#a5503f;z-index:2;animation:talk .4s ease-in-out .9s 11 both}
@keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.2)}}
.name{position:absolute;left:0;right:0;bottom:0;padding:1.2vmin 0;text-align:center;font-size:2.4vmin;font-weight:700;color:#fff;background:rgba(14,23,48,.72);z-index:3}
</style>
<div class="stage">
  <div class="slide">
    <div class="kicker">PART 2</div>
    <div class="title">문의 분류 흐름</div>
    <div class="bar"></div>
    <ul>
      <li>밤사이 문의 40건</li>
      <li>AI가 급한 순서로 분류</li>
      <li>사람은 확인만</li>
    </ul>
  </div>
  <div class="inset">
    <div class="cam">
      <div class="shoulders"></div>
      <div class="neck"></div>
      <div class="head"></div>
      <div class="hair"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="mouth"></div>
    </div>
    <div class="name">홍길동 강사</div>
  </div>
</div>
</html>
