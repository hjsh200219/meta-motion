<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 M10 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
html{font-size:min(1vw,1.7778vh);font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{display:flex;align-items:center;justify-content:center;background:#E6F4FB}
.stage{position:relative;width:100rem;height:56.25rem;overflow:hidden;background:#E6F4FB}
.stage>div,.stage>svg{position:absolute}
.stage div{position:absolute}

@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes drive{
0%{transform:translate(13.5rem,39.3rem)}
6.25%{transform:translate(17.5rem,38.86rem)}
12.5%{transform:translate(21.5rem,37.8rem)}
18.75%{transform:translate(25.5rem,36.74rem)}
25%{transform:translate(29.5rem,36.3rem)}
31.25%{transform:translate(33.5rem,36.74rem)}
37.5%{transform:translate(37.5rem,37.8rem)}
43.75%{transform:translate(41.5rem,38.86rem)}
50%{transform:translate(45.5rem,39.3rem)}
56.25%{transform:translate(49.5rem,39.74rem)}
62.5%{transform:translate(53.5rem,40.8rem)}
68.75%{transform:translate(57.5rem,41.86rem)}
75%{transform:translate(61.5rem,42.3rem)}
81.25%{transform:translate(65.5rem,41.86rem)}
87.5%{transform:translate(69.5rem,40.8rem)}
93.75%{transform:translate(73.5rem,39.74rem)}
100%{transform:translate(77.5rem,39.3rem)}}
@keyframes tilt{
0%{transform:rotate(0deg)}6.25%{transform:rotate(-11.8deg)}12.5%{transform:rotate(-16.4deg)}
18.75%{transform:rotate(-11.8deg)}25%{transform:rotate(0deg)}31.25%{transform:rotate(11.8deg)}
37.5%{transform:rotate(16.4deg)}43.75%{transform:rotate(11.8deg)}50%{transform:rotate(0deg)}
56.25%{transform:rotate(11.8deg)}62.5%{transform:rotate(16.4deg)}68.75%{transform:rotate(11.8deg)}
75%{transform:rotate(0deg)}81.25%{transform:rotate(-11.8deg)}87.5%{transform:rotate(-16.4deg)}
93.75%{transform:rotate(-11.8deg)}100%{transform:rotate(0deg)}}
@keyframes bump{0%{transform:translateY(0)}50%{transform:translateY(-.6rem)}100%{transform:translateY(0)}}
@keyframes fade{from{opacity:1}to{opacity:0}}
@keyframes flx{0%{transform:translateX(0);opacity:0}2%{opacity:1}92%{opacity:1}100%{transform:translateX(4.2rem);opacity:0}}
@keyframes fly{
0%{transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
50%{transform:translateY(-12rem) scale(1.05);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
100%{transform:translateY(-7.9rem) scale(.85)}}
@keyframes bounce{0%{transform:scale(0)}40%{transform:scale(1.45)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes ring{0%{opacity:0;transform:scale(.3)}10%{opacity:1}100%{opacity:0;transform:scale(5)}}
@keyframes rise{from{opacity:0;transform:translateY(8rem)}to{opacity:1;transform:translateY(0)}}

/* 배경 */
.sun{left:86rem;top:3rem;width:8rem;height:8rem;border-radius:50%;background:#FFC83D;box-shadow:0 0 0 1rem rgba(255,200,61,.35),0 0 0 2rem rgba(255,200,61,.18)}
.cloud{left:6rem;top:7rem;width:10rem;height:3rem;border-radius:3rem;background:#fff}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{left:1.5rem;top:-1.6rem;width:4.5rem;height:4.5rem}
.cloud::after{left:5rem;top:-2.2rem;width:3.5rem;height:3.5rem}
.cloud.c2{left:58rem;top:13rem;transform:scale(.8)}
.hill1{left:-10rem;top:33rem;width:70rem;height:40rem;border-radius:50%;background:#7BC96F}
.hill2{left:40rem;top:36rem;width:80rem;height:50rem;border-radius:50%;background:#66BB5A}
.ground{left:0;top:50rem;width:100rem;height:7rem;background:#66BB5A}

/* 길 */
.wipe{left:0;top:0;width:100rem;height:56.25rem}
.wipe svg{position:absolute;left:0;top:0;width:100%;height:100%}
.wipe path{fill:none}
.w1{animation:wipe .95s linear .45s 1 both}
.w2{animation:wipe .7s linear .7s 1 both}
.edge{stroke:#7B5232;stroke-width:4}
.road{stroke:#A8754A;stroke-width:3.2}
.dash{stroke:#fff;stroke-width:.3;stroke-dasharray:1.4 1.2}

/* 밭·창고 */
.field{left:2rem;top:30.5rem;width:18rem;height:11rem;transform-origin:50% 100%;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);background:repeating-linear-gradient(172deg,#A0673A 0 1rem,#7CB342 1rem 2rem);animation:pop .4s ease-out 0s 1 both}
.barn{left:22rem;top:23rem;width:11rem;height:12rem;transform-origin:50% 100%;animation:pop .4s ease-out .15s 1 both}
.barn .b{left:0;top:0;width:100%;height:100%;background:#D93A2F;clip-path:polygon(0 28%,50% 0,100% 28%,100% 100%,0 100%)}
.barn .d{left:2.5rem;top:5.5rem;width:6rem;height:6.5rem;background:#B02A22;border:.35rem solid #fff;
background-image:linear-gradient(45deg,transparent 46%,#fff 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46% 54%,transparent 54%)}

/* 식당 */
.rest{left:70rem;top:14rem;width:27rem;height:24rem;transform-origin:50% 100%;animation:pop .4s ease-out .3s 1 both}
.rest .sign{left:5rem;top:0;width:17rem;height:4rem;background:#5B3A29;color:#FFE9B0;font-size:2.2rem;font-weight:800;line-height:4rem;text-align:center;border-radius:.6rem .6rem 0 0}
.rest .wall{left:1rem;top:4rem;width:25rem;height:20rem;background:#F6E3C4}
.rest .awn{left:0;top:8rem;width:27rem;height:4.5rem;background:repeating-linear-gradient(90deg,#E23B2E 0 2.25rem,#fff 2.25rem 4.5rem);border-radius:0 0 1.2rem 1.2rem}
.rest .win{left:3rem;top:14rem;width:8rem;height:6rem;background:#BFE3F2;border:.4rem solid #8D5A36}
.rest .door{left:18rem;top:14rem;width:6rem;height:10rem;background:#8D5A36;border-radius:.6rem .6rem 0 0}

/* 식탁·접시·음식 */
.table{left:76rem;top:31rem;width:17rem;height:6.5rem;transform-origin:50% 100%;animation:pop .35s ease-out .35s 1 both}
.table .slab{left:0;top:2.2rem;width:17rem;height:2rem;background:#8D5A36;border-radius:.5rem}
.table .leg{top:4rem;width:.9rem;height:2.5rem;background:#6B4226}
.table .l1{left:1.2rem}.table .l2{left:14.9rem}
.table .plate{left:4rem;top:2.3rem;width:9rem;height:1.8rem;border-radius:50%;background:#fff;box-shadow:inset 0 -.3rem 0 #E3E3E3}
.food{left:82.3rem;top:30.2rem;width:4.4rem;height:4.4rem;border-radius:50%;transform-origin:50% 100%;background:radial-gradient(circle at 38% 32%,#E3F5C4,#8BC34A 62%,#4E8F2B);animation:bounce .3s ease-out 3.6s 1 both}
.food::after{content:"";position:absolute;left:2.6rem;top:.5rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#E23B2E}
.glow{left:81.5rem;top:29.4rem;width:6rem;height:6rem;border-radius:50%;border:.6rem solid rgba(255,208,50,.9);background:radial-gradient(circle,rgba(255,235,120,.6),rgba(255,235,120,0) 70%);animation:ring .3s ease-out 3.6s 1 both}

/* 트럭 */
.follow{left:0;top:0;width:9rem;height:5.5rem;animation:drive 2s linear 1.1s 1 both}
.tilt{left:0;top:0;width:9rem;height:5.5rem;transform-origin:50% 100%;animation:tilt 2s linear 1.1s 1 both}
.tilt div,.follow>div{position:absolute}
.tpop{left:0;top:0;width:9rem;height:5.5rem;transform-origin:50% 100%;animation:pop .45s ease-out .85s 1 both}
.bump{left:0;top:0;width:9rem;height:5.5rem;animation:bump .25s ease-out 1.1s 8 both}
.bed{left:0;top:1rem;width:5.6rem;height:3.2rem;background:#F39A1E;border-radius:.4rem .2rem .2rem .4rem;box-shadow:inset 0 -.5rem 0 rgba(0,0,0,.12)}
.cabin{left:5.8rem;top:1.8rem;width:3.2rem;height:2.5rem;background:#D93A2F;border-radius:.5rem 1.4rem .3rem .3rem}
.win{left:6.6rem;top:2.2rem;width:1.6rem;height:1.1rem;background:#CFEFFC;border-radius:.3rem .6rem .2rem .2rem}
.whl{top:3.6rem;width:1.9rem;height:1.9rem;border-radius:50%;background:#2D2D2D;border:.4rem solid #BDBDBD}
.w-a{left:1rem}.w-b{left:6.2rem}
.cargo{left:0;top:0;width:5.6rem;height:2rem;animation:fade .1s linear 3.1s 1 both}
.cab{top:0;width:2rem;height:2rem;border-radius:50%;background:radial-gradient(circle at 38% 32%,#E3F5C4,#8BC34A 62%,#4E8F2B)}
.cab:nth-child(1){left:.2rem}.cab:nth-child(2){left:1.8rem}.cab:nth-child(3){left:3.4rem}
.label{left:-6rem;bottom:6rem;width:21rem;display:flex;justify-content:center;animation:fade .3s linear 3.1s 1 both}
.label span{position:relative;display:block;white-space:nowrap;background:#fff;color:#2E7D32;font-size:2.4rem;font-weight:800;padding:.5rem 1.6rem;border-radius:3rem;box-shadow:.1rem .3rem 0 rgba(0,0,0,.15);transform-origin:50% 100%;animation:pop .45s ease-out .85s 1 both}
.label span::after{content:"";position:absolute;left:50%;bottom:-.7rem;margin-left:-.7rem;border:.7rem solid transparent;border-bottom:0;border-top-color:#fff}

/* 날아가는 품목 */
.fx{left:79.2rem;top:39.2rem;width:2.2rem;height:2.2rem;animation:flx .5s linear 3.1s 1 both}
.fy{left:0;top:0;width:2.2rem;height:2.2rem;border-radius:50%;background:radial-gradient(circle at 38% 32%,#E3F5C4,#8BC34A 62%,#4E8F2B);animation:fly .5s linear 3.1s 1 both}

/* 제목·띠 */
.title{left:0;top:3rem;width:100rem;text-align:center;font-size:5rem;font-weight:800;line-height:6rem;color:#1B5E3A;text-shadow:0 .25rem 0 #fff,0 0 1rem #fff;animation:pop .5s ease-out .2s 1 both}
.bandwrap{left:0;top:49.4rem;width:100rem;height:5rem;display:flex;justify-content:center}
.band{position:relative!important;display:flex;align-items:center;gap:1.6rem;padding:.8rem 2rem;border-radius:5rem;background:#1F3A2E;font-size:2.6rem;font-weight:800;color:#fff;line-height:3rem;animation:rise .35s ease-out 3.4s 1 both}
.band b{padding:0 1.6rem;border-radius:3rem}
.band .g{background:#4CAF50}.band .r{background:#E23B2E}
.band i{font-style:normal;color:#FFD54A;font-size:3rem}
</style>

<div class="stage">
  <div class="sun"></div>
  <div class="cloud"></div>
  <div class="cloud c2"></div>
  <div class="hill1"></div>
  <div class="hill2"></div>
  <div class="ground"></div>

  <div class="wipe w1"><svg viewBox="0 0 100 56.25" preserveAspectRatio="none">
    <path class="edge" d="M0 44 L18 44 C26 44 26 41 34 41 C42 41 42 44 50 44 C58 44 58 47 66 47 C74 47 74 44 82 44 L100 44"/>
    <path class="road" d="M0 44 L18 44 C26 44 26 41 34 41 C42 41 42 44 50 44 C58 44 58 47 66 47 C74 47 74 44 82 44 L100 44"/>
  </svg></div>
  <div class="wipe w2"><svg viewBox="0 0 100 56.25" preserveAspectRatio="none">
    <path class="dash" d="M0 44 L18 44 C26 44 26 41 34 41 C42 41 42 44 50 44 C58 44 58 47 66 47 C74 47 74 44 82 44 L100 44"/>
  </svg></div>

  <div class="field"></div>
  <div class="barn"><div class="b"></div><div class="d"></div></div>

  <div class="rest">
    <div class="wall"></div>
    <div class="sign">우리 식당</div>
    <div class="win"></div>
    <div class="door"></div>
    <div class="awn"></div>
  </div>

  <div class="table"><div class="leg l1"></div><div class="leg l2"></div><div class="slab"></div><div class="plate"></div></div>
  <div class="food"></div>
  <div class="glow"></div>

  <div class="follow">
    <div class="label"><span>유기농 배추</span></div>
    <div class="tilt"><div class="tpop"><div class="bump">
      <div class="bed"></div>
      <div class="cargo"><div class="cab"></div><div class="cab"></div><div class="cab"></div></div>
      <div class="cabin"></div><div class="win"></div>
      <div class="whl w-a"></div><div class="whl w-b"></div>
    </div></div></div>
  </div>

  <div class="fx"><div class="fy"></div></div>

  <div class="title">산지에서 식탁까지</div>
  <div class="bandwrap"><div class="band"><b class="g">○○군 ○○농장</b><i>→</i><b class="r">우리 식당</b></div></div>
</div>
</html>
