<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F53 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#16222e,#0a1118);font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--ac:#c6ff3d;color:#fff}
.wrap{position:relative;width:min(88vw,130vmin);aspect-ratio:16/9;animation:frameIn .3s cubic-bezier(.2,.8,.3,1) 0s 1 both}
.photo{position:absolute;inset:0;overflow:hidden;border-radius:1.2vmin;border:.4vmin solid #2a3d4f;box-shadow:0 2vmin 6vmin rgba(0,0,0,.55);
  background:linear-gradient(180deg,#56697a 0,#7b8d9b 34%,#8c5b38 34%,#b07a4c 62%,#7d4e2d 100%)}
.photo::after{content:"";position:absolute;inset:0;background:rgba(6,12,18,.28)}
.sh{position:absolute;left:var(--l);top:var(--t);width:var(--w);height:var(--h)}
.s1{--l:7%;--t:40%;--w:24%;--h:42.7%}
.s2{--l:38%;--t:46%;--w:24%;--h:42.7%}
.s3{--l:71%;--t:52%;--w:20%;--h:35.5%}
.s4{--l:36%;--t:10%;--w:14%;--h:30%}
.s5{--l:84%;--t:12%;--w:7%;--h:34%}
.bowl{border-radius:50%;background:
 radial-gradient(circle at 34% 40%,#e0452f 0 6%,transparent 7%),
 radial-gradient(circle at 62% 36%,#e0452f 0 5%,transparent 6%),
 radial-gradient(circle at 50% 62%,#f2d04a 0 5%,transparent 6%),
 radial-gradient(circle at 50% 48%,#7fbf4a 0 34%,#4f9a35 35% 60%,#e9e4d8 62% 100%)}
.plate{border-radius:50%;background:radial-gradient(circle at 50% 50%,#c8452d 0 10%,#e8a43a 11% 24%,#f1c15b 25% 40%,#d98a2b 41% 56%,#f4efe6 58% 100%)}
.fruit{background:
 radial-gradient(circle at 28% 62%,#d93a3a 0 24%,transparent 25%),
 radial-gradient(circle at 66% 38%,#f08a24 0 26%,transparent 27%),
 radial-gradient(circle at 62% 74%,#8fc23a 0 22%,transparent 23%),
 radial-gradient(circle at 36% 28%,#7a2f8a 0 14%,transparent 15%)}
.jug{border-radius:18% 18% 12% 12%;background:linear-gradient(90deg,#3f6d99,#8ec1e8 42%,#3f6d99)}
.jug::after{content:"";position:absolute;right:-22%;top:22%;width:30%;height:42%;border:.8vmin solid #5f93c2;border-left:0;border-radius:0 50% 50% 0}
.bottle{background:linear-gradient(90deg,#2d5a34,#6cb06b 45%,#27502e);clip-path:polygon(32% 0,68% 0,68% 28%,100% 40%,100% 100%,0 100%,0 40%,32% 28%)}
.det{position:absolute;left:var(--l);top:var(--t);width:var(--w);height:var(--h)}
.br{position:absolute;inset:-.7vmin;color:var(--ac);transform-origin:50% 50%;animation:brk .2s cubic-bezier(.2,.9,.3,1) var(--d) 1 both;
 background:
 linear-gradient(currentColor,currentColor) 0 0/2.2vmin .6vmin,linear-gradient(currentColor,currentColor) 0 0/.6vmin 2.2vmin,
 linear-gradient(currentColor,currentColor) 100% 0/2.2vmin .6vmin,linear-gradient(currentColor,currentColor) 100% 0/.6vmin 2.2vmin,
 linear-gradient(currentColor,currentColor) 0 100%/2.2vmin .6vmin,linear-gradient(currentColor,currentColor) 0 100%/.6vmin 2.2vmin,
 linear-gradient(currentColor,currentColor) 100% 100%/2.2vmin .6vmin,linear-gradient(currentColor,currentColor) 100% 100%/.6vmin 2.2vmin;
 background-repeat:no-repeat}
.bx{position:absolute;inset:0;border:.35vmin solid var(--ac);animation:fade .15s linear calc(var(--d) + .15s) 1 both}
.low .bx{border-style:dashed}
.chip{position:absolute;left:-.4vmin;bottom:100%;margin-bottom:1.2vmin;white-space:nowrap;background:var(--ac);color:#0a1118;font-weight:800;font-size:3vmin;line-height:1;padding:.7vmin 1.2vmin;border-radius:.6vmin;display:flex;gap:1vmin;align-items:center;transform-origin:0 100%;animation:pop .2s ease-out calc(var(--d) + .25s) 1 both}
.chip i{font-style:normal;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.chip em{font-style:normal;background:#fff;color:#0a1118;padding:.4vmin .8vmin;border-radius:.4vmin;font-size:2.6vmin}
.low .chip{left:auto;right:-.4vmin;transform-origin:100% 100%}
.d1{--d:.8s}.d2{--d:.95s}.d3{--d:1.1s}.d4{--d:1.25s}.d5{--d:1.4s}
.scan{position:absolute;left:0;right:0;top:0;height:.6vmin;background:var(--ac);box-shadow:0 0 3vmin 1vmin var(--ac);animation:sweep .5s cubic-bezier(.45,0,.55,1) .3s 1 both}
.scan::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:16vmin;background:linear-gradient(to top,rgba(198,255,61,.28),rgba(198,255,61,0))}
.tag{position:absolute;right:0;top:-6.5vmin;background:#22384c;border:.3vmin solid var(--ac);color:#fff;font-size:3vmin;font-weight:700;padding:.8vmin 1.6vmin;border-radius:5vmin;animation:chipIn .3s ease-out .3s 1 both}
.st{position:absolute;left:0;top:-6.5vmin;display:flex;align-items:center;gap:1.2vmin;font:700 3.6vmin ui-monospace,"SF Mono",Menlo,"Apple SD Gothic Neo",monospace;color:#fff;animation:reveal .3s ease-out 2s 1 both}
.st b{color:var(--ac);font-size:3vmin}
@keyframes frameIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{0%{top:0;opacity:0}12%{opacity:1}85%{opacity:1}100%{top:100%;opacity:0}}
@keyframes chipIn{from{opacity:0;transform:translateY(-1.5vmin)}to{opacity:1;transform:none}}
@keyframes brk{from{opacity:0;transform:scale(1.22)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:translateY(40%) scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
</style>
<div class="wrap">
  <div class="photo" aria-label="photo.jpg">
    <div class="sh s1 bowl"></div>
    <div class="sh s2 plate"></div>
    <div class="sh s3 fruit"></div>
    <div class="sh s4 jug"></div>
    <div class="sh s5 bottle"></div>
    <div class="scan"></div>
  </div>
  <div class="det s1 d1"><div class="br"></div><div class="bx"></div><div class="chip">샐러드 <i>0.94</i></div></div>
  <div class="det s2 d2"><div class="br"></div><div class="bx"></div><div class="chip">파스타 <i>0.91</i></div></div>
  <div class="det s3 d3"><div class="br"></div><div class="bx"></div><div class="chip">과일 <i>0.83</i></div></div>
  <div class="det s4 d4"><div class="br"></div><div class="bx"></div><div class="chip">주전자 <i>0.72</i></div></div>
  <div class="det s5 d5 low"><div class="br"></div><div class="bx"></div><div class="chip">병 <i>0.55</i><em>확인 필요</em></div></div>
  <div class="st"><b>●</b><span>인식 중… 5개 찾음</span></div>
  <div class="tag">재현 화면</div>
</div>
</html>
