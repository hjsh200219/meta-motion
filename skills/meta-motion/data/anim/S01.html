<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 S01 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wood{width:100%;height:100%;box-sizing:border-box;border:3vmin solid #7a4b27;background:#5e3a1d;display:flex;align-items:center;justify-content:center}
.board{position:relative;width:100%;height:100%;box-sizing:border-box;padding:4vmin 5vmin;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto 1fr;column-gap:4vmin;
 background:radial-gradient(ellipse at 30% 20%,#2f5a44 0%,#1f4331 60%,#16352a 100%);box-shadow:inset 0 0 8vmin rgba(0,0,0,.55);color:#F4EFE2}
h1{grid-column:1/3;margin:0 0 3vmin;font-size:9vmin;font-weight:900;letter-spacing:.2vmin;animation:drop .4s ease-out .15s 1 both}
@keyframes drop{from{opacity:0;transform:translateY(-4vmin)}to{opacity:1;transform:translateY(0)}}
.menu{display:flex;flex-direction:column;justify-content:center;gap:2.6vmin;min-width:0}
.row{position:relative;display:flex;align-items:baseline;gap:1.2vmin;font-size:5vmin;font-weight:900;padding:1.2vmin 1.5vmin;animation:slide .7s ease-out 1 both}
.row:nth-child(1){animation-delay:.5s}
.row:nth-child(2){animation-delay:.8s}
.row:nth-child(3){animation-delay:1.1s}
@keyframes slide{from{opacity:0;transform:translateX(-12vmin)}to{opacity:1;transform:translateX(0)}}
.mk{width:4.5vmin;flex:none;color:#FFD400;text-align:center}
.nm,.pr,.dots{position:relative;z-index:1}
.nm{flex:none}
.dots{flex:1;border-bottom:.7vmin dotted rgba(244,239,226,.7);transform:translateY(-.8vmin);min-width:3vmin}
.pr{flex:none;width:15vmin;text-align:right;font-variant-numeric:tabular-nums}
.band{position:absolute;inset:0;background:rgba(255,212,0,.22);border-radius:1vmin;transform-origin:left center;animation:band .3s ease-out 2.7s 1 both}
@keyframes band{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.hl .nm,.hl .pr{animation:yel .3s linear 2.7s 1 both}
@keyframes yel{from{color:#F4EFE2}to{color:#FFD400}}
.side{display:flex;align-items:center;justify-content:center;min-width:0}
.card{position:relative;width:34vmin;background:#F4EFE2;padding:2.2vmin 2.2vmin 1.6vmin;box-shadow:0 1.5vmin 3vmin rgba(0,0,0,.5);color:#3b2a1a;text-align:center;animation:cardin .5s ease-out 1.8s 1 both}
@keyframes cardin{0%{opacity:0;transform:scale(0) rotate(-8deg)}60%{opacity:1;transform:scale(1.12) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(3deg)}}
.photo{position:relative;overflow:hidden;width:100%;aspect-ratio:1/1;background:radial-gradient(circle at 50% 50%,#8a5a35 0 22%,#f1e3c8 23% 34%,#fff7e8 35% 52%,#c9a77c 53% 100%)}
.photo:before{content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0 20%,#d9b48a 21% 60%,transparent 61%)}
.shine{position:absolute;top:-20%;left:-40%;width:25%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:translateX(0) rotate(20deg);animation:shine .8s ease-in-out 3s 1 both}
@keyframes shine{from{transform:translateX(0) rotate(20deg);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateX(600%) rotate(20deg);opacity:0}}
.cap{margin-top:1.6vmin;font-size:4vmin;font-weight:900}
.badge{position:absolute;top:-4vmin;right:-4vmin;animation:pop .35s ease-out 2.35s 1 both}
.badge i{display:flex;align-items:center;justify-content:center;width:12vmin;height:12vmin;border-radius:50%;background:#FFD400;color:#3b2a1a;font-style:normal;font-weight:900;font-size:4.2vmin;box-shadow:0 .8vmin 1.5vmin rgba(0,0,0,.4);animation:beat .4s ease-in-out 3.8s 4 both}
@keyframes pop{0%{opacity:0;transform:scale(0)}65%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.sp{position:absolute;font-size:5vmin;color:#FFD400;animation:pop .35s ease-out 2.35s 1 both}
.sp b{display:block;font-weight:400;animation:spin 1.6s linear 3.8s 1 both,tw .6s ease-in-out 2.35s 5 both}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.45;filter:brightness(1.6)}}
.s1{top:-6vmin;right:7vmin}
.s2{top:3vmin;right:-8vmin;font-size:3.6vmin}
.s3{top:-2vmin;left:-5vmin;font-size:3.4vmin}
.s4{bottom:10vmin;right:-7vmin;font-size:4vmin}
@media (orientation:portrait){
 .board{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;row-gap:2vmin}
 h1{grid-column:1}
 .row{font-size:5.4vmin}
 .card{width:44vmin}
}
</style>
<div class="wood"><div class="board">
 <h1>오늘의 메뉴</h1>
 <div class="menu">
  <div class="row"><span class="mk"></span><span class="nm">아메리카노</span><span class="dots"></span><span class="pr">4,000원</span></div>
  <div class="row hl"><span class="band"></span><span class="mk">★</span><span class="nm">카페라테</span><span class="dots"></span><span class="pr">4,500원</span></div>
  <div class="row"><span class="mk"></span><span class="nm">유자차</span><span class="dots"></span><span class="pr">5,000원</span></div>
 </div>
 <div class="side"><div class="card">
  <div class="photo"><span class="shine"></span></div>
  <div class="cap">카페라테 · 4,500원</div>
  <div class="badge"><i>추천</i></div>
  <div class="sp s1"><b>✦</b></div>
  <div class="sp s2"><b>✦</b></div>
  <div class="sp s3"><b>✦</b></div>
  <div class="sp s4"><b>✦</b></div>
 </div></div>
</div></div>
</html>
