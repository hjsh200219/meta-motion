<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F58 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#f6f1e4;display:flex;align-items:center;justify-content:center;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#2a2a2a}
.wrap{width:92vmin;display:flex;flex-direction:column;animation:shake .25s 2.55s 1 both linear}
h1{margin:0;font-size:7.6vmin;line-height:1.15;font-weight:900;letter-spacing:-.02em;animation:in .5s 0s 1 both ease-out}
.case{align-self:flex-start;margin:1.6vmin 0 3vmin;background:#ff5a1f;color:#fff;font-weight:800;font-size:4vmin;padding:.9vmin 2.4vmin;border-radius:5vmin;animation:in .5s 0s 1 both ease-out}
.row{display:flex;align-items:center;gap:2vmin}
.q{flex:1;min-width:0;box-sizing:border-box;background:#fff;border:.6vmin solid #2a2a2a;border-radius:1.6vmin;padding:2vmin 2.4vmin;font-size:4.2vmin;font-weight:800;opacity:.4;animation:qpop .25s var(--d) 1 both ease-out}
.a{background:#ff5a1f;color:#fff;font-weight:900;font-size:4.2vmin;padding:1.2vmin 2.4vmin;border-radius:5vmin;animation:chip .2s var(--d) 1 both ease-out}
.no{width:24vmin;font-size:3vmin;line-height:1.3;color:#2a2a2a;opacity:.35;font-weight:700}
.link{position:relative;width:1vmin;height:3.6vmin;margin-left:6vmin;background:#d6cfbc}
.link::after{content:"";position:absolute;inset:0;background:#ff5a1f;transform-origin:top;animation:draw .2s var(--d) 1 both linear}
.ghost{border:.5vmin dashed #c9c1aa;border-radius:2vmin;padding:1.2vmin;display:flex;justify-content:center}
.end{display:flex;align-items:center;justify-content:center;gap:2.4vmin;box-sizing:border-box;width:100%;background:#1f2a44;color:#fff;border:.8vmin solid #ff5a1f;border-radius:1.8vmin;padding:1.8vmin;font-size:7vmin;font-weight:900;animation:stamp .4s 2.4s 1 both ease-in}
.ic{width:8vmin;height:8vmin;border-radius:50%;background:#fff;color:#1f2a44;display:flex;align-items:center;justify-content:center;font-size:6vmin}
@keyframes in{from{opacity:.2;transform:translateY(1.5vmin)}to{opacity:1;transform:none}}
@keyframes qpop{0%{opacity:.4;border-color:#2a2a2a;transform:scale(1);box-shadow:none}50%{transform:scale(1.05)}100%{opacity:1;border-color:#ff5a1f;transform:scale(1);box-shadow:0 0 0 .7vmin #ff5a1f}}
@keyframes chip{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes stamp{0%{opacity:0;transform:scale(1.5)}55%{opacity:1;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(.8vmin,.6vmin)}50%{transform:translate(-.6vmin,-.4vmin)}75%{transform:translate(.3vmin,.2vmin)}}
</style>
<h1>이 일, AI에게 맡길까?</h1>
<div class="case">예: 매주 같은 보고서</div>
<div class="row"><div class="q" style="--d:.5s">자주 반복하나?</div><div class="a" style="--d:.7s">예</div><div class="no">아니오 →<br>사람이 한다</div></div>
<div class="link" style="--d:.9s"></div>
<div class="row"><div class="q" style="--d:1.1s">규칙이 늘 같은가?</div><div class="a" style="--d:1.3s">예</div><div class="no">아니오 →<br>반만 맡긴다</div></div>
<div class="link" style="--d:1.5s"></div>
<div class="row"><div class="q" style="--d:1.7s">틀려도 되돌릴 수 있나?</div><div class="a" style="--d:1.9s">예</div><div class="no">아니오 →<br>확인 후 맡긴다</div></div>
<div class="link" style="--d:2.1s"></div>
<div class="ghost"><div class="end"><span class="ic">✓</span>맡긴다</div></div>
</html>
