<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 B17 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#5f7f9a 0%,#9db4bf 38%,#c9b79a 62%,#3d4a3b 100%)}
.hill{position:absolute;left:-10%;right:-10%;bottom:-18%;height:48%;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#56684a,#2c3a2b)}
.hill.b{left:30%;right:-40%;bottom:-24%;height:42%;background:linear-gradient(180deg,#6b7b57,#34432f)}
.sun{position:absolute;left:62%;top:24%;width:14vmin;height:14vmin;border-radius:50%;background:radial-gradient(circle,#fff3cf,#f5cf85 60%,rgba(245,207,133,0) 72%)}
.bar{position:absolute;top:3vmin;left:25%;right:3%;box-sizing:border-box;padding:2vmin 0 1.8vmin;border-radius:3vmin;background:rgba(22,19,14,.82);animation:barIn 1s ease-out 0s 1 both;overflow:hidden}
.track{position:absolute;left:10%;width:80%;top:3vmin;height:.55vmin;border-radius:1vmin;background:#4A4538}
.fill{position:absolute;left:10%;width:80%;top:3vmin;height:.55vmin;border-radius:1vmin;background:#E8442E;transform-origin:left center;animation:fill 8s linear 2.5s 1 both}
.row{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.item{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;animation:itemIn .6s ease-out var(--a) 1 both}
.dotbox{position:relative;width:1.8vmin;height:1.8vmin;margin-top:.1vmin}
.dot{position:absolute;inset:0;border-radius:50%;background:#4A4538;animation:dotOn .35s ease-out var(--d) 1 both}
.ring{position:absolute;left:50%;top:50%;width:4vmin;height:4vmin;margin:-2vmin 0 0 -2vmin;border-radius:50%;background:rgba(232,68,46,.22);border:.3vmin solid rgba(232,68,46,.4);box-sizing:border-box;opacity:0;animation:ringCur 2s linear var(--d) 1 both}
.name{font-size:3vmin;font-weight:800;color:#BDB6A8;white-space:nowrap;animation:nameCur 2s linear var(--d) 1 both}
.item:nth-child(1){--a:.8s;--d:2.5s}
.item:nth-child(2){--a:.95s;--d:4.5s}
.item:nth-child(3){--a:1.1s;--d:6.5s}
.item:nth-child(4){--a:1.25s;--d:8.5s}
.item:nth-child(5){--a:1.4s;--d:10.5s}
.item:nth-child(5) .ring{animation:ringStay .4s ease-out 10.5s 1 both}
.item:nth-child(5) .name{animation:nameStay .4s ease-out 10.5s 1 both}
.flash{position:absolute;inset:0;border-radius:3vmin;background:#E8442E;opacity:0;pointer-events:none;animation:flash .9s ease-in-out 10.5s 1 both}
@keyframes barIn{from{opacity:0;transform:translateY(-4vmin)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateY(1.5vmin)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dotOn{0%{background:#4A4538;transform:scale(1)}60%{background:#E8442E;transform:scale(1.5)}100%{background:#E8442E;transform:scale(1.2)}}
@keyframes ringCur{0%{opacity:0;transform:scale(.5)}10%{opacity:1;transform:scale(1)}90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
@keyframes ringStay{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes nameCur{0%{color:#BDB6A8;transform:scale(1)}10%{color:#F4EDDC;transform:scale(1.15)}90%{color:#F4EDDC;transform:scale(1.15)}100%{color:#BDB6A8;transform:scale(1)}}
@keyframes nameStay{from{color:#BDB6A8;transform:scale(1)}to{color:#F4EDDC;transform:scale(1.15)}}
@keyframes flash{0%{opacity:0}35%{opacity:.7}100%{opacity:0}}
</style>
<div class="stage">
  <div class="sun"></div>
  <div class="hill"></div>
  <div class="hill b"></div>
  <div class="bar">
    <div class="track"></div>
    <div class="fill"></div>
    <div class="row">
      <div class="item"><div class="dotbox"><div class="ring"></div><div class="dot"></div></div><div class="name">도입</div></div>
      <div class="item"><div class="dotbox"><div class="ring"></div><div class="dot"></div></div><div class="name">개념</div></div>
      <div class="item"><div class="dotbox"><div class="ring"></div><div class="dot"></div></div><div class="name">실습</div></div>
      <div class="item"><div class="dotbox"><div class="ring"></div><div class="dot"></div></div><div class="name">주의</div></div>
      <div class="item"><div class="dotbox"><div class="ring"></div><div class="dot"></div></div><div class="name">정리</div></div>
    </div>
    <div class="flash"></div>
  </div>
</div>
</html>
