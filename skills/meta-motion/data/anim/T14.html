<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 T14 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;background:linear-gradient(160deg,#FFF7ED,#FFE4E6);font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-align:center}
.tag{font-size:4.5vmin;font-weight:800;color:#E11D48;letter-spacing:.3vmin;animation:tagIn 1s 0s 1 both}
.q{font-size:7vmin;font-weight:900;color:#374151;line-height:1.3;max-width:86vmin;word-break:keep-all;animation:qIn 1s 0s 1 both}
.timer{position:relative;width:34vmin;height:34vmin;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FFD5DC;animation:pulse 1s 0s 1 both}
.ring{position:absolute;inset:0;border-radius:50%;background:#E11D48;-webkit-mask:radial-gradient(circle,transparent 0 62%,#000 63%);mask:radial-gradient(circle,transparent 0 62%,#000 63%)}
.num{position:relative;font-size:16vmin;font-weight:900;color:#E11D48;line-height:1}
@keyframes tagIn{from{opacity:.85}to{opacity:1}}
@keyframes qIn{from{opacity:.85}to{opacity:1}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
</style>
<div class="stage">
  <div class="tag">OX 퀴즈</div>
  <div class="q">비밀번호를 AI 채팅창에 넣어도 된다?</div>
  <div class="timer"><div class="ring"></div><div class="num">5</div></div>
</div>
</html>
