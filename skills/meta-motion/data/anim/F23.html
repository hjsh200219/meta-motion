<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F23 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#0b0d13 0%,#050609 70%)}
.row{width:100%;box-sizing:border-box;padding:0 3vmin;display:grid;grid-template-columns:1fr 1fr;gap:2.4vmin;margin-bottom:16vmin}
.box{position:relative;width:100%;height:56vmin;max-height:60vh;border-radius:2vmin;overflow:hidden;background:#111;opacity:0}
.l{animation:inL .55s cubic-bezier(.2,.8,.2,1) .1s 1 both}
.r{animation:inR .55s cubic-bezier(.2,.8,.2,1) .4s 1 both}
@keyframes inL{from{transform:translateX(-60vw);opacity:0}15%{opacity:1}to{transform:translateX(0);opacity:1}}
@keyframes inR{from{transform:translateX(60vw);opacity:0}15%{opacity:1}to{transform:translateX(0);opacity:1}}
.vid{position:absolute;inset:0;overflow:hidden}
.v1{background:linear-gradient(170deg,#3b4a63 0%,#26324a 55%,#161c2b 100%)}
.v2{background:linear-gradient(170deg,#5a3d57 0%,#3a2a45 55%,#1d1626 100%)}
.person{position:absolute;inset:0}
.l .person{animation:bob 4.4s ease-in-out .1s 1 both}
.r .person{animation:bob 4.1s ease-in-out .4s 1 both}
@keyframes bob{0%,100%{transform:translate(0,0)}12%{transform:translate(.6vmin,.5vmin)}25%{transform:translate(-.5vmin,-.3vmin)}38%{transform:translate(.4vmin,.4vmin)}52%{transform:translate(-.6vmin,0)}66%{transform:translate(.5vmin,-.4vmin)}80%{transform:translate(-.3vmin,.5vmin)}90%{transform:translate(.3vmin,0)}}
.head{position:absolute;left:50%;top:14%;width:15vmin;height:18vmin;margin-left:-7.5vmin;border-radius:50% 50% 46% 46%;background:linear-gradient(180deg,#e7b996,#c98f6b)}
.head:before{content:"";position:absolute;left:-1vmin;right:-1vmin;top:-1.5vmin;height:8vmin;border-radius:50% 50% 30% 30%;background:#2a1d18}
.r .head{background:linear-gradient(180deg,#f0c9a8,#d29c78)}
.r .head:before{background:#4a2a1d;height:9vmin}
.body{position:absolute;left:50%;top:36%;width:34vmin;height:30vmin;margin-left:-17vmin;border-radius:40% 40% 0 0;background:linear-gradient(180deg,#f1f1f1,#b9bdc7)}
.r .body{background:linear-gradient(180deg,#35e0c2,#1b8f7c)}
.sweep{position:absolute;top:-20%;bottom:-20%;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-18deg)}
.l .sweep{animation:sw 1.1s linear .1s 4 both}
.r .sweep{animation:sw 1.1s linear .4s 3 both}
@keyframes sw{from{left:-40%}to{left:130%}}
.frame{position:absolute;inset:0;border-radius:2vmin;box-sizing:border-box;border:.9vmin solid #fff;animation:fl .5s ease-out .95s 1 both}
.r .frame{border-color:#35e0c2;animation-name:flr}
@keyframes fl{0%{box-shadow:0 0 0 0 rgba(255,255,255,0);filter:brightness(1)}35%{box-shadow:0 0 5vmin 1.2vmin rgba(255,255,255,.9),inset 0 0 3vmin rgba(255,255,255,.6);filter:brightness(1.6)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);filter:brightness(1)}}
@keyframes flr{0%{box-shadow:0 0 0 0 rgba(53,224,194,0);filter:brightness(1)}35%{box-shadow:0 0 5vmin 1.2vmin rgba(53,224,194,.95),inset 0 0 3vmin rgba(53,224,194,.6);filter:brightness(1.6)}100%{box-shadow:0 0 0 0 rgba(53,224,194,0);filter:brightness(1)}}
.tag{position:absolute;left:2vmin;bottom:2vmin;padding:.8vmin 2.2vmin;border-radius:1vmin;font-size:4.2vmin;font-weight:700;background:#fff;color:#12141a}
.r .tag{background:#35e0c2;color:#04251f}
</style>
<div class="stage">
  <div class="row">
    <div class="box l">
      <div class="vid v1"><div class="person"><div class="body"></div><div class="head"></div></div><div class="sweep"></div></div>
      <div class="frame"></div>
      <div class="tag">강사</div>
    </div>
    <div class="box r">
      <div class="vid v2"><div class="person"><div class="body"></div><div class="head"></div></div><div class="sweep"></div></div>
      <div class="frame"></div>
      <div class="tag">참가자</div>
    </div>
  </div>
</div>
</html>
