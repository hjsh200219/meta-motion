<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F22 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
*{box-sizing:border-box}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#14213d;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}

/* 촬영 화면 예시: 처음엔 전체 화면, 오른쪽 위로 0.72배 줄어듦(가로세로 같은 배율이라 비율 유지) */
.video{position:absolute;inset:0;transform-origin:100% 0;overflow:hidden;
  background:linear-gradient(180deg,#3b4a8c 0%,#c4608f 55%,#f4a261 100%);
  animation:shrink .8s cubic-bezier(.65,0,.25,1) .2s 1 both,
            round .8s ease .2s 1 both}
@keyframes shrink{from{transform:scale(1)}to{transform:scale(.72)}}
@keyframes round{from{border-radius:0}to{border-radius:2.6vmin}}
.sun{position:absolute;left:30%;top:22%;width:16vmin;height:16vmin;border-radius:50%;
  background:radial-gradient(circle,#fff6c9 30%,#ffd27a 70%,rgba(255,210,122,0) 72%);
  animation:sunmove 4.5s linear 0s 1 both}
@keyframes sunmove{from{transform:translateX(-12vmin)}to{transform:translateX(30vmin)}}
.hills{position:absolute;left:-5%;right:-5%;bottom:0;height:45%;animation:drift 4.5s linear 0s 1 both}
.hills i{position:absolute;bottom:0;background:#2a2e5c}
.hills i:nth-child(1){left:0;width:55%;height:100%;clip-path:polygon(0 100%,35% 10%,100% 100%)}
.hills i:nth-child(2){left:35%;width:65%;height:75%;background:#1d2148;clip-path:polygon(0 100%,50% 0,100% 100%)}
.hills i:nth-child(3){left:0;width:100%;height:30%;background:#12163a;clip-path:polygon(0 60%,30% 20%,60% 55%,100% 15%,100% 100%,0 100%)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-4vmin)}}
.tag{position:absolute;right:2vmin;top:2vmin;font-size:2vmin;color:rgba(255,255,255,.7);background:rgba(0,0,0,.25);padding:.5vmin 1.2vmin;border-radius:1vmin}

/* 왼쪽 칸 */
.left{position:absolute;left:2.5%;top:4%;width:25%}
.title{margin:0 0 3vmin;font-size:5.4vmin;line-height:1.2;font-weight:900;color:#ffc83d;
  animation:slidein .5s cubic-bezier(.2,.8,.2,1) .9s 1 both}
@keyframes slidein{from{transform:translateX(-120%);opacity:0}to{transform:translateX(0);opacity:1}}
.item{font-size:3.4vmin;line-height:1.3;font-weight:800;color:#fff;margin:0 0 2.2vmin;
  animation:rise .5s ease-out 1.1s 1 both}
.item:nth-child(2){animation-delay:1.35s}
.item:nth-child(3){animation-delay:1.6s}
@keyframes rise{from{transform:translateY(4vmin);opacity:0}to{transform:translateY(0);opacity:1}}

/* 아래 띠 */
.band{position:absolute;left:0;right:0;bottom:0;height:28%;background:#0a1226;
  display:flex;align-items:center;justify-content:center;padding:0 4vmin;
  animation:bandup .5s cubic-bezier(.2,.8,.2,1) 1s 1 both}
@keyframes bandup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.band p{margin:0;font-size:5vmin;line-height:1.3;font-weight:900;color:#fff;text-align:center}
.line{position:absolute;left:0;right:0;top:0;height:.7vmin;background:#ffc83d;overflow:hidden}
.line::after{content:"";position:absolute;top:0;bottom:0;left:0;width:18%;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));
  animation:glint .6s ease-in-out 1.5s 1 both}
@keyframes glint{from{transform:translateX(-100%);opacity:1}to{transform:translateX(600%);opacity:1}}
</style>

<div class="stage">
  <div class="left">
    <h1 class="title">오늘의 순서</h1>
    <div class="item">1. 문제 고르기</div>
    <div class="item">2. 순서 적기</div>
    <div class="item">3. AI에 맡기기</div>
  </div>
  <div class="video">
    <div class="sun"></div>
    <div class="hills"><i></i><i></i><i></i></div>
    <div class="tag">촬영 화면 예시</div>
  </div>
  <div class="band">
    <div class="line"></div>
    <p>자료 받기: 설명란 링크 · 질문은 댓글로</p>
  </div>
</div>
</html>
