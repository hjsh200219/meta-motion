<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F48 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#f4f1ea;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1b2147}
.wrap{width:92vw;max-height:96vh;display:flex;flex-direction:column;gap:2.4vmin}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:1.4vmin;animation:in .45s ease-out 0s 1 both}
.tag{background:#ff5a36;color:#fff;font-weight:800;font-size:3.4vmin;padding:.7vmin 2.2vmin;border-radius:5vmin}
h1{margin:0;font-size:9vmin;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.panel{background:#fff;border-radius:3vmin;padding:3vmin 3.2vmin 2.4vmin;box-shadow:0 1.2vmin 4vmin rgba(27,33,71,.1);display:grid;grid-template-columns:1fr 1fr;gap:2.6vmin 3vmin;animation:in .45s ease-out 0s 1 both}
.c{--c:#ff5a36;--b:rgba(255,90,54,.17);--d:calc(.6s + var(--i)*.4s)}
.c:nth-child(even){--c:#1b2147;--b:rgba(27,33,71,.11)}
.t{position:relative;padding:.6vmin 1vmin;font-size:4.4vmin;font-weight:900;line-height:1.3;letter-spacing:-.02em}
.t b{position:relative;font-weight:900}
.band{position:absolute;inset:0;background:var(--b);border-radius:1vmin;transform-origin:left center;animation:sweep .2s linear var(--d) 1 both}
.br{display:block;height:1.4vmin;margin:.8vmin .6vmin 0;border:.5vmin solid var(--c);border-top:0;border-radius:0 0 1.2vmin 1.2vmin;transform-origin:left center;animation:sweep .12s ease-out calc(var(--d) + .2s) 1 both}
.nm{display:flex;align-items:center;flex-wrap:wrap;gap:1.2vmin;margin-top:1.2vmin}
.chip{background:var(--c);color:#fff;font-weight:800;font-size:3.2vmin;padding:.6vmin 1.8vmin;border-radius:5vmin;white-space:nowrap;animation:pop .13s ease-out calc(var(--d) + .32s) 1 both}
.nm em{font-style:normal;color:#8a8d99;font-size:3vmin;animation:fade .1s linear calc(var(--d) + .45s) 1 both}
.concl{display:flex;align-items:center;gap:1.8vmin;padding:0 1vmin;animation:rise .45s ease-out 2.3s 1 both}
.arrow{font-size:7vmin;font-weight:900;color:#ff5a36}
.pz{display:inline-block;transform-origin:left center;font-size:6vmin;font-weight:900;letter-spacing:-.02em;animation:grow .15s ease-out 2.8s 1 both}
.hl{padding:.3vmin 1vmin;border-radius:.8vmin;background:linear-gradient(#ffd23f,#ffd23f) no-repeat left center/0% 100%;animation:mark .45s ease-out 2.35s 1 both}
@media (max-aspect-ratio:4/5){.panel{grid-template-columns:1fr}.t{font-size:5.2vmin}}
@media (min-aspect-ratio:5/4){.panel{gap:3vmin 4vmin}.t{font-size:4.2vmin}}
@keyframes in{from{opacity:0;transform:translateY(2vmin)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0;transform:translateX(-1vmin)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(4vmin)}to{opacity:1;transform:none}}
@keyframes mark{from{background-size:0% 100%}to{background-size:100% 100%}}
@keyframes grow{from{transform:scale(1)}to{transform:scale(1.05)}}
</style>
<div class="wrap">
  <div class="head"><span class="tag">프롬프트 해부도</span><h1>이 문장은 4조각</h1></div>
  <div class="panel">
    <div class="c" style="--i:0"><div class="t"><i class="band"></i><b>당신은 ○○센터 교육 담당자입니다.</b></div><u class="br"></u><div class="nm"><s class="chip" style="text-decoration:none">① 역할</s><em>누구로서</em></div></div>
    <div class="c" style="--i:1"><div class="t"><i class="band"></i><b>행사 안내 메일을 써 주세요.</b></div><u class="br"></u><div class="nm"><s class="chip" style="text-decoration:none">② 할 일</s><em>무엇을</em></div></div>
    <div class="c" style="--i:2"><div class="t"><i class="band"></i><b>받는 분은 어르신 20명입니다.</b></div><u class="br"></u><div class="nm"><s class="chip" style="text-decoration:none">③ 맥락</s><em>누구에게</em></div></div>
    <div class="c" style="--i:3"><div class="t"><i class="band"></i><b>5줄 이내 존댓말로.</b></div><u class="br"></u><div class="nm"><s class="chip" style="text-decoration:none">④ 형식</s><em>어떤 모양으로</em></div></div>
  </div>
  <div class="concl"><span class="arrow">→</span><span class="pz"><span class="hl">‘형식’이 빠지면 답이 길어져요</span></span></div>
</div>
</html>
