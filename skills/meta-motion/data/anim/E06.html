<!-- 생성 파일(build_card_anim.py) — 카드 E06 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>

.city b{position:absolute;width:.8vmin;height:.8vmin;background:#ffd98a;box-shadow:0 0 1vmin #ffb85c}
.name{position:absolute;left:0;right:0;top:55%;display:flex;flex-direction:column;align-items:center;gap:1.4vmin;
animation:glow 1.45s ease-in-out 3.05s 1 both}
@keyframes glow{0%{filter:drop-shadow(0 0 1vmin rgba(255,150,40,.5))}50%{filter:drop-shadow(0 0 3vmin rgba(255,170,60,.95))}100%{filter:drop-shadow(0 0 2vmin rgba(255,150,40,.7))}}
