<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 생성 파일(build_card_anim.py) — 카드 F21 샘플. 부모가 {{t: 초}} 를 보내면 그 시각 장면으로 맞춘다 -->
<script>
const all = () => document.getAnimations();
addEventListener('load', () => { for (const a of all()) { a.pause(); a.effect.updateTiming({ fill: 'both' }); } parent.postMessage({ anim: 'ready' }, '*'); });
addEventListener('message', (e) => { const t = Number(e.data && e.data.t); if (Number.isFinite(t)) for (const a of all()) a.currentTime = t * 1000; });
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#3b4a5e 0%,#56677d 45%,#2a3342 100%)}
.window{position:absolute;left:6%;top:10%;width:26%;height:38%;border-radius:1vmin;background:linear-gradient(160deg,#9ec0d8,#e6d9b8);opacity:.45}
.shelf{position:absolute;right:7%;top:14%;width:16%;height:30%;border-radius:1vmin;background:repeating-linear-gradient(180deg,#2c3544 0 18%,#465369 18% 22%);opacity:.7}
.person{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:34vmin;height:60vmin}
.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:15vmin;height:19vmin;border-radius:50%;background:linear-gradient(180deg,#d9b49a,#b98f77)}
.body{position:absolute;left:0;right:0;top:19vmin;bottom:0;border-radius:45% 45% 0 0;background:linear-gradient(180deg,#d8dde6,#aab3c2)}
.tag-cam{position:absolute;left:3vmin;top:3vmin;font-size:2.4vmin;color:#fff;opacity:.45;letter-spacing:.2vmin}
.sub{position:absolute;left:0;right:0;bottom:0;padding:0 5vw 15vmin;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
.name{display:inline-block;padding:.7vmin 2.2vmin;border-radius:.8vmin;background:#ffd23f;color:#1a1a1a;font-weight:900;font-size:3.8vmin;line-height:1.3;opacity:0;transform-origin:50% 100%;
animation:fadeIn .3s linear .1s 1 both,pop .3s ease-out .1s 1 both}
.quote{max-width:90%;text-align:center;color:#fff;font-weight:900;font-size:5vmin;line-height:1.35;word-break:keep-all;opacity:0;
-webkit-text-stroke:1.2vmin #111;paint-order:stroke fill;text-shadow:0 .3vmin 1vmin rgba(0,0,0,.6);
animation:fadeIn .4s linear .35s 1 both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
</style>
<div class="stage">
  <div class="window"></div>
  <div class="shelf"></div>
  <div class="person"><div class="head"></div><div class="body"></div></div>
  <div class="tag-cam">촬영 화면 예시</div>
  <div class="sub">
    <div class="name">참가자 A</div>
    <div class="quote">“처음엔 어려울 줄 알았는데, 순서만 적으니 되더라고요”</div>
  </div>
</div>
</html>
